    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  fillStroke(C('#5A4A33'), ink(), 5);

  // pipes radiating out
  for (let i = 0; i < 4; i++){
    const a = i / 4 * TAU + Math.PI/4;
    ctx.save(); ctx.rotate(a);
    rr(B.r - 4, -9, 34, 18, 6); fillStroke(C('#8A7A55'), ink(), 4);
    rr(B.r + 24, -13, 12, 26, 4); fillStroke(C(PAL.brass), ink(), 4);
    ctx.restore();
  }

  // main drum
  const g = ctx.createRadialGradient(-B.r*0.35, -B.r*0.4, 4, 0, 0, B.r * 1.15);
  g.addColorStop(0, C('#F0C878')); g.addColorStop(0.5, C(PAL.brass)); g.addColorStop(1, C('#8E6520'));
  circ(0, 0, B.r); fillStroke(_flash ? '#FFFFFF' : g, ink(), 6);

  // rivets
  ctx.fillStyle = C('#6E5326');
  for (let i = 0; i < 14; i++){
    const a = i / 14 * TAU;
    circ(Math.cos(a) * (B.r - 9), Math.sin(a) * (B.r - 9), 3.1); ctx.fill();
  }

  // furnace window — the fire dims and reddens as it takes damage
  const pulse = 0.75 + Math.sin(S.rt * 6) * 0.12 + Math.sin(S.rt * 11.3) * 0.06;
  const fg = ctx.createRadialGradient(0, 6, 2, 0, 6, 26);
  const hot = frac > 0.35 ? '#FFE49A' : '#FF9A5B';
  fg.addColorStop(0, C(hot));
  fg.addColorStop(0.55, C(frac > 0.35 ? '#E2691E' : '#B0301A'));
  fg.addColorStop(1, C('rgba(90,30,10,0.15)'));
  ctx.save(); ctx.globalAlpha = pulse;
  circ(0, 6, 25); ctx.fillStyle = _flash ? '#FFF' : fg; ctx.fill();
  ctx.restore();
  ctx.strokeStyle = ink(); ctx.lineWidth = 4; circ(0, 6, 25); ctx.stroke();
  // grate bars
  ctx.strokeStyle = C('#3A2B20'); ctx.lineWidth = 3.5;
  for (let i = -1; i <= 1; i++){
    ctx.beginPath(); ctx.moveTo(-22, 6 + i*11); ctx.lineTo(22, 6 + i*11); ctx.stroke();
  }

  // pressure gauge on top
  ctx.save(); ctx.translate(0, -B.r * 0.62);
  circ(0, 0, 15); fillStroke(C('#EDE4C8'), ink(), 4);
  ctx.strokeStyle = C(PAL.oxblood); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, 10, Math.PI * 1.15, Math.PI * 1.15 + Math.PI * 0.7 * (1 - frac)); ctx.stroke();
  const na = Math.PI * 1.15 + Math.PI * 0.7 * (1 - frac);
  ctx.strokeStyle = ink(); ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(na) * 11, Math.sin(na) * 11); ctx.stroke();
  ctx.restore();

  // damage: cracks and smoke
  if (frac < 0.6){
    ctx.strokeStyle = C('#3A2B20'); ctx.lineWidth = 3; ctx.globalAlpha = 0.9;
    for (let i = 0; i < 5; i++){
      const a = i * 1.7 + 0.4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * 18, Math.sin(a) * 18);
      ctx.lineTo(Math.cos(a + 0.3) * 34, Math.sin(a + 0.3) * 34);
      ctx.lineTo(Math.cos(a + 0.1) * (B.r - 6), Math.sin(a + 0.1) * (B.r - 6));
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  if (B.flash > 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(B.flash / 0.14, 0, 1) * 0.6;
    ctx.fillStyle = '#FFE9C0'; circ(0, 0, B.r); ctx.fill();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 6; circ(0, 0, B.r); ctx.stroke();
    ctx.restore();
  }
  _flash = false;
  ctx.restore();

  if (frac < 0.6 && rnd() < 0.10) pSmoke(B.x + rnd(-24,24), B.y - 20, 1, 'rgba(50,45,42,0.55)', 40);
  if (frac < 0.3 && rnd() < 0.10) pSparks(B.x + rnd(-20,20), B.y, 1, '#FF9A5B', 90);
  if (rnd() < 0.035) pSmoke(B.x + rnd(-40,40), B.y - 34, 1, 'rgba(225,220,214,0.4)', 26);
}

/* ---------------------------------------------------------------------------
   RENDER — the player: a red-coated silhouette with brass fittings
--------------------------------------------------------------------------- */
function drawPlayerTrail(){
  const P = S.player;
  for (const t of P.trail){
    const k = 1 - t.t / 0.32;
    ctx.save();
    ctx.globalAlpha = k * 0.42;
    ctx.translate(t.x, t.y); ctx.rotate(t.a);
    ctx.fillStyle = '#FF6E5A';
    ell(0, 0, 20 * (0.6 + k*0.4), 16 * (0.6 + k*0.4)); ctx.fill();
    ctx.restore();
  }
}

function drawPlayer(){
  const P = S.player;
  if (P.hp <= 0) return;
  const bob = Math.sin(P.walk * 2.2) * 1.4;
  const inv = P.iframe > 0 && Math.floor(S.rt * 24) % 2 === 0;
  const AS = 1.34;                                   // player art scale

  groundShadow(P.x, P.y + 5, 22, 16, 0.32);

  // separation halo — keeps the captain legible under a pile of boarders
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(P.x, P.y, 52, '#FFCDA6', 0.26);
  ctx.restore();

  ctx.save();
  ctx.translate(P.x, P.y + bob);
  if (P.dashT > 0){
    const k = P.dashT / TUNING.player.dashTime;
    ctx.globalAlpha = 0.9;
    ctx.save(); ctx.rotate(P.dashAng);
    ctx.fillStyle = 'rgba(255,150,120,0.35)';
    ell(-20, 0, 34 * k + 13, 14); ctx.fill();
    ctx.restore();
  }
  if (inv) ctx.globalAlpha *= 0.55;
  ctx.rotate(P.aim);
  ctx.scale(AS, AS);
  ctx.lineJoin = 'round';

  const hurt = P.hurt > 0;
  const COAT = hurt ? '#FF8080' : PAL.oxblood;
  const COATD = hurt ? '#D45050' : '#6A1212';

  // coat tails, swaying
  const sway = P.coatSway + Math.sin(P.walk * 2.2) * 0.10;
  ctx.save(); ctx.rotate(sway * 0.5);
  ctx.beginPath();
  ctx.moveTo(-4, -12);
  ctx.quadraticCurveTo(-22, -20, -30, -4);
  ctx.quadraticCurveTo(-33, 0, -30, 4);
  ctx.quadraticCurveTo(-22, 20, -4, 12);
  ctx.closePath();
  fillStroke(COATD, PAL.ink, 4);
  ctx.restore();

  // legs (a hint under the coat)
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 6; ctx.lineCap = 'round';
  const st = Math.sin(P.walk * 2.2) * 4;
  ctx.beginPath(); ctx.moveTo(-2, -6); ctx.lineTo(2 + st, -9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2,  6); ctx.lineTo(2 - st,  9); ctx.stroke();

  // torso
  ell(0, 0, 14, 11.5);
  fillStroke(COAT, PAL.ink, 4);
  // lapels
  ctx.beginPath();
  ctx.moveTo(6, -8); ctx.quadraticCurveTo(2, 0, 6, 8);
  ctx.strokeStyle = PAL.brass; ctx.lineWidth = 3; ctx.stroke();
  // belt
  ctx.beginPath(); ctx.moveTo(-6, -10); ctx.lineTo(-6, 10);
  ctx.strokeStyle = '#3A2B20'; ctx.lineWidth = 5; ctx.stroke();
  ctx.fillStyle = PAL.brass; rr(-9, -3, 7, 6, 2); ctx.fill();

  // shoulders
  for (const s of [-1, 1]){
    circ(1, s * 11, 5.6); fillStroke(COATD, PAL.ink, 3);
    ctx.fillStyle = PAL.brass; circ(1, s * 11, 2.4); ctx.fill();
  }

  // back arm
  ctx.strokeStyle = COATD; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(2, 10); ctx.lineTo(12, 13); ctx.stroke();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(2, 10); ctx.lineTo(12, 13); ctx.stroke();

  // casting arm + gauntlet
  const cf = P.castFlash / 0.12;
  const lastEl = P.lastElem ? ELEMENTS[P.lastElem] : ELEMENTS.EMBER;
  ctx.strokeStyle = COAT; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(3, -10); ctx.lineTo(15 + cf*3, -12); ctx.stroke();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(3, -10); ctx.lineTo(15 + cf*3, -12); ctx.stroke();
  circ(18 + cf*3, -12.5, 6);
  fillStroke(PAL.brass, PAL.ink, 3);
  if (cf > 0){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = cf;
    drawGlow(18 + cf*3, -12.5, 22, lastEl.glow, 1);
    ctx.restore();
  }

  // head + tricorn
  circ(4, 0, 7); fillStroke('#3A2B20', PAL.ink, 3);
  ctx.beginPath();
  ctx.moveTo(13, 0); ctx.quadraticCurveTo(4, -13, -5, -6);
  ctx.quadraticCurveTo(-8, 0, -5, 6); ctx.quadraticCurveTo(4, 13, 13, 0);
  ctx.closePath();
  fillStroke('#2E2118', PAL.ink, 3.5);
  ctx.fillStyle = PAL.brass; circ(-3, 0, 2.6); ctx.fill();
  // goggle lens catching the light
  ctx.fillStyle = '#F2D14B'; circ(8.5, -3, 2.2); ctx.fill();
  ctx.fillStyle = '#D9A441'; circ(8.5, 3, 2.2); ctx.fill();

  ctx.restore();

  // dash-ready shimmer at the feet
  if (P.dashStock > 0 && P.dashT <= 0){
    ctx.save();
    ctx.globalAlpha = 0.18 + Math.sin(S.rt * 5) * 0.06;
    ctx.strokeStyle = '#FFD36B'; ctx.lineWidth = 2.4;
    circ(P.x, P.y + 15, 22); ctx.stroke();
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------------
   RENDER — enemies. Five silhouettes, readable at a glance:
     SCRAPPER lean + sabre · GUNNER squat + rotor + barrel
     ARMORED wide + frontal plate · SWARM tiny + scuttling legs
     BOSS huge + stacks + furnace core
--------------------------------------------------------------------------- */
/* Boarders are baked into a small sprite atlas: 8 walk frames plus a windup and
   a swing pose, flashed and unflashed. A crowd then costs one drawImage each
   instead of ~25 stroked paths. Built lazily, on first sight of each type. */
const ANIM_FRAMES = 8;
const _enemySprites = new Map();
function enemySprite(type, pose, frame, flash){
  const key = type + '|' + pose + '|' + frame + '|' + (flash ? 1 : 0);
  let cn = _enemySprites.get(key);
  if (cn) return cn;
  const def = ENEMIES[type];
  const half = def.spriteHalf;
  cn = document.createElement('canvas');
  cn.width = cn.height = half * 2;
  const c2 = cn.getContext('2d');
  const ph = frame / ANIM_FRAMES * TAU;
  const sw = pose === 1 ? -0.55 : pose === 2 ? 0.85 : 0;
  withCtx(c2, () => {
    c2.translate(half, half);
    c2.scale(def.art, def.art);
    c2.lineJoin = 'round'; c2.lineCap = 'round';
    _flash = !!flash;
    if (type === 'SCRAPPER') drawScrapper(ph, sw);
    else if (type === 'GUNNER') drawGunner(ph, pose === 1);
    else if (type === 'ARMORED') drawArmored(ph, sw);
    else drawSwarm(ph);
    _flash = false;
  });
  _enemySprites.set(key, cn);
  return cn;
}
const ANIM_RATE = { SCRAPPER: 7, GUNNER: 5.5, ARMORED: 3.4, SWARM: 15 };

function drawEnemy(e){
  const climbing = e.state === 'climb';
  const k = climbing ? e.climb : 1;

  if (!climbing) groundShadow(e.x, e.y + 4, e.r * 0.86, e.r * 0.6, 0.28);

  ctx.save();
  ctx.translate(e.x, e.y);
  if (climbing){
    ctx.globalAlpha = 0.30 + 0.70 * k;
    ctx.translate(0, (1 - k) * 22);
    ctx.scale(0.55 + 0.45 * k, 0.35 + 0.65 * k);
  }

  // status rings, drawn under and unrotated
  if (e.slowT > 0){
    ctx.save(); ctx.globalAlpha = 0.5;
    ctx.strokeStyle = ELEMENTS.FROST.color; ctx.lineWidth = 3;
    ctx.setLineDash([6, 5]); ctx.lineDashOffset = -S.rt * 22;
    circ(0, 4, e.r + 6); ctx.stroke();
    ctx.restore();
  }
  if (e.accT > 0){
    ctx.save(); ctx.globalAlpha = 0.35;
    ctx.strokeStyle = ELEMENTS.STEAM.color; ctx.lineWidth = 2.5;
    circ(0, 4, e.r + 11); ctx.stroke();
    ctx.restore();
  }

  ctx.rotate(e.facing);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

  if (e.type === 'BOSS'){
    ctx.scale(e.def.art, e.def.art);
    _flash = e.flash > 0;
    drawBoss(e);
    _flash = false;
  } else {
    const pose = e.swingFx > 0 ? 2 : (e.state === 'windup' ? 1 : 0);
    const frame = pose ? 0
      : (Math.floor(e.anim * ANIM_RATE[e.type] / TAU * ANIM_FRAMES) % ANIM_FRAMES + ANIM_FRAMES) % ANIM_FRAMES;
    const half = e.def.spriteHalf;
    ctx.drawImage(enemySprite(e.type, pose, frame, e.flash > 0), -half, -half);
    // live bits that can't be baked
    if (e.type === 'GUNNER' && e.state === 'windup')
      drawGlow(34 * e.def.art, 0, 12, '#FFC168', 0.5 + Math.sin(S.rt * 40) * 0.3);
    if (e.type === 'ARMORED' && e.blockFlash > 0){
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = e.blockFlash / 0.18;
      ctx.strokeStyle = '#FFF0B8'; ctx.lineWidth = 16 * e.def.art;
      const fa = e.def.frontArc;
      ctx.beginPath(); ctx.arc(0, 0, 20 * e.def.art, -fa/2, fa/2); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();

  // stun stars
  if (e.stunT > 0){
    ctx.save();
    ctx.translate(e.x, e.y - e.r - 14);
    for (let i = 0; i < 3; i++){
      const a = S.rt * 7 + i / 3 * TAU;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = ELEMENTS.ARC.color;
      circ(Math.cos(a) * 11, Math.sin(a) * 4.5, 3); ctx.fill();
    }
    ctx.restore();
  }
  // burning shimmer
  if (e.burnStacks > 0 && !climbing){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(e.x, e.y, e.r * 2.2, '#FFC168', 0.16 * e.burnStacks);
    ctx.restore();
  }
  // hp bar
  if (!climbing && e.hp < e.maxHp && e.type !== 'BOSS'){
    const w = Math.max(22, e.r * 2.1), h = 4.5;
    const x = e.x - w/2, y = e.y - e.r - 12;
    ctx.fillStyle = 'rgba(25,18,14,0.8)'; rr(x-1.5, y-1.5, w+3, h+3, 2.5); ctx.fill();
    ctx.fillStyle = e.hp / e.maxHp > 0.4 ? '#C93B2B' : '#E86A2E';
    rr(x, y, w * clamp(e.hp/e.maxHp, 0, 1), h, 2); ctx.fill();
  }
}

function legs(e, n, len, spread, w, col){
  const ph = e.anim * (e.def.speed / 22);
  ctx.strokeStyle = col; ctx.lineWidth = w;
  for (let i = 0; i < n; i++){
    const s = i % 2 ? 1 : -1;
    const o = Math.sin(ph + i * 1.9) * 3.2;
    ctx.beginPath();
    ctx.moveTo(-2, s * spread * 0.45);
    ctx.lineTo(-2 + o, s * spread + (i > 1 ? 2 : -2));
    ctx.lineTo(-2 + o - len * 0.5, s * spread * 1.25);
    ctx.stroke();
  }
}

function drawScrapper(ph, sw){
  // legs
  ctx.strokeStyle = ink(); ctx.lineWidth = 4.5;
  for (const s of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(-3, s * 5);
    ctx.lineTo(-4 + Math.sin(ph + (s>0?0:Math.PI)) * 5, s * 10);
    ctx.stroke();
  }
  // coat tail
  ctx.beginPath();
  ctx.moveTo(-3, -8); ctx.quadraticCurveTo(-17, -12, -20, 0);
  ctx.quadraticCurveTo(-17, 12, -3, 8); ctx.closePath();
  fillStroke(C(PAL.olive), ink(), 3);
  // body
  ell(0, 0, 10, 8.5); fillStroke(C(PAL.grey), ink(), 3.5);
  ctx.strokeStyle = C(PAL.brass); ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(-4, -6); ctx.lineTo(-4, 6); ctx.stroke();
  // off arm
  ctx.strokeStyle = C('#585349'); ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(1, 7); ctx.lineTo(9, 11); ctx.stroke();
  // sabre arm
  ctx.save();
  ctx.translate(4, -7); ctx.rotate(-0.5 + sw * 1.5);
  ctx.strokeStyle = C('#585349'); ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(8, 0); ctx.stroke();
  ctx.strokeStyle = C(PAL.brass); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(11, 0); ctx.stroke();
  // blade
  ctx.beginPath();
  ctx.moveTo(11, -2.4); ctx.quadraticCurveTo(24, -5, 30, -1);
  ctx.quadraticCurveTo(24, 1.6, 11, 2.4); ctx.closePath();
  fillStroke(C('#C9C6BC'), ink(), 2.4);
  ctx.restore();
  // head + tricorn
  circ(4, 0, 5.4); fillStroke(C('#4E4941'), ink(), 3);
  ctx.beginPath();
  ctx.moveTo(10, 0); ctx.quadraticCurveTo(3, -10, -3, -4.5);
  ctx.quadraticCurveTo(-5, 0, -3, 4.5); ctx.quadraticCurveTo(3, 10, 10, 0);
  ctx.closePath();
  fillStroke(C('#3B352E'), ink(), 3);
  // eye
  ctx.fillStyle = C('#FF4A3D'); circ(7, 0, 2.1); ctx.fill();
  if (!_flash){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.5;
    ctx.fillStyle='#FF4A3D'; circ(7,0,4.4); ctx.fill(); ctx.restore(); }
}

function drawGunner(ph, charging){
  // legs
  ctx.strokeStyle = ink(); ctx.lineWidth = 5;
  for (const s of [-1, 1]){
    ctx.beginPath(); ctx.moveTo(-2, s * 6);
    ctx.lineTo(-3 + Math.sin(ph + (s>0?0:Math.PI)) * 4, s * 12); ctx.stroke();
  }
  // squat body
  ell(0, 0, 11, 10.5); fillStroke(C('#7A6A4C'), ink(), 3.5);
  ctx.strokeStyle = C(PAL.brass); ctx.lineWidth = 2.4;
  circ(-2, 0, 5.5); ctx.stroke();
  // ammo drum
  circ(-7, 6, 5); fillStroke(C('#5B5348'), ink(), 3);
  // gun: long barrel forward
  ctx.save(); ctx.translate(2, -4);
  rr(2, -4.5, 20, 9, 3); fillStroke(C('#4C4741'), ink(), 3);
  rr(20, -3, 14, 6, 2.5); fillStroke(C('#3A3630'), ink(), 2.6);
  ctx.fillStyle = C(PAL.brass); rr(13, -5.5, 4, 11, 2); ctx.fill();
  circ(34, 0, 3.6); fillStroke(C('#2E2A26'), ink(), 2.4);
  if (charging){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    drawGlow(34, 0, 10, '#FFC168', 0.8); ctx.restore();
  }
  ctx.restore();
  // arms
  ctx.strokeStyle = C('#585349'); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(2, -8); ctx.lineTo(9, -5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(2, 7); ctx.lineTo(10, 2); ctx.stroke();
  // head
  circ(3, 0, 5); fillStroke(C('#4E4941'), ink(), 3);
  ctx.fillStyle = C('#FFB020'); circ(6.5, 0, 2); ctx.fill();
  // rotor headgear — spins, so you spot a gunner instantly
  ctx.save();
  ctx.translate(1, 0); ctx.rotate(ph * 3);
  ctx.strokeStyle = C('#8E8778'); ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++){
    const a = i / 3 * TAU;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 13, Math.sin(a) * 13); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = C(PAL.brass); circ(1, 0, 3); fillStroke(C(PAL.brass), ink(), 2);
}

function drawArmored(ph, sw){
  const frontArc = ENEMIES.ARMORED.frontArc;
  // piston legs
  ctx.strokeStyle = ink(); ctx.lineWidth = 8;
  for (const s of [-1, 1]){
    ctx.beginPath(); ctx.moveTo(-4, s * 8);
    ctx.lineTo(-6 + Math.sin(ph + (s>0?0:Math.PI)) * 4, s * 16); ctx.stroke();
  }
  ctx.strokeStyle = C(PAL.brass); ctx.lineWidth = 3;
  for (const s of [-1, 1]){
    ctx.beginPath(); ctx.moveTo(-4, s * 8);
    ctx.lineTo(-6 + Math.sin(ph + (s>0?0:Math.PI)) * 4, s * 16); ctx.stroke();
  }
  // bulk
  ell(-2, 0, 15, 14); fillStroke(C('#57514A'), ink(), 4);
  // shoulder blocks
  for (const s of [-1, 1]){
    rr(-6, s * 11 - 6, 14, 12, 4); fillStroke(C('#6B6459'), ink(), 3.4);
  }
  // hook arm
  ctx.save();
  ctx.translate(6, 13); ctx.rotate(-0.3 + sw * 1.4);
  ctx.strokeStyle = C('#585349'); ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(11, 0); ctx.stroke();
  ctx.strokeStyle = C('#C9C6BC'); ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.arc(15, 3, 6.5, -1.9, 1.5); ctx.stroke();
  ctx.restore();
  // head, recessed
  circ(1, -2, 5.5); fillStroke(C('#413C36'), ink(), 3);
  ctx.fillStyle = C('#FF4A3D'); circ(4, -2, 2); ctx.fill();
  // THE FRONT PLATE — 40% damage reduction lives here, so make it obvious
  ctx.save();
  ctx.strokeStyle = C('#A98A46');
  ctx.lineWidth = 11;
  ctx.beginPath(); ctx.arc(0, 0, 20, -frontArc/2, frontArc/2); ctx.stroke();
  ctx.strokeStyle = ink(); ctx.lineWidth = 2.6;
  ctx.beginPath(); ctx.arc(0, 0, 25.5, -frontArc/2, frontArc/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 14.5, -frontArc/2, frontArc/2); ctx.stroke();
  ctx.fillStyle = C(PAL.brass);
  for (let i = -2; i <= 2; i++){
    const a = i / 5 * frontArc;
    circ(Math.cos(a) * 20, Math.sin(a) * 20, 2.4); ctx.fill();
  }
  ctx.restore();
}

function drawSwarm(ph){
  // scuttling legs
  ctx.strokeStyle = ink(); ctx.lineWidth = 2.6;
  for (let i = 0; i < 6; i++){
    const s = i < 3 ? -1 : 1;
    const j = i % 3;
    const o = Math.sin(ph + i * 1.5) * 3;
    ctx.beginPath();
    ctx.moveTo(-2 + j * 3, s * 3);
    ctx.lineTo(-4 + j * 4 + o, s * 10);
    ctx.stroke();
  }
  // shell
  ell(0, 0, 8, 6.5); fillStroke(C('#6E6A5E'), ink(), 3);
  ctx.strokeStyle = C(PAL.brass); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(4, 0); ctx.stroke();
  // single eye
  ctx.fillStyle = C('#FFB020'); circ(4.5, 0, 2.6); ctx.fill();
  if (!_flash){ ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=0.45;
    ctx.fillStyle='#FFB020'; circ(4.5,0,5); ctx.fill(); ctx.restore(); }
  // mandibles
  ctx.strokeStyle = C('#C9C6BC'); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(6, -3); ctx.lineTo(11, -1.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,  3); ctx.lineTo(11,  1.5); ctx.stroke();
}

function drawBoss(e){
  const R = e.r / e.def.art;
  // piston legs
  ctx.strokeStyle = ink(); ctx.lineWidth = 17;
  const ph = e.anim * 2.2;
  for (const s of [-1, 1]){
    ctx.beginPath(); ctx.moveTo(-10, s * 22);
    ctx.lineTo(-16 + Math.sin(ph + (s>0?0:Math.PI)) * 8, s * 42); ctx.stroke();
  }
  ctx.strokeStyle = C(PAL.brass); ctx.lineWidth = 6;
  for (const s of [-1, 1]){
    ctx.beginPath(); ctx.moveTo(-10, s * 22);
    ctx.lineTo(-16 + Math.sin(ph + (s>0?0:Math.PI)) * 8, s * 42); ctx.stroke();
  }
  // chimney stacks at the back
  for (const s of [-1, 1]){
    ctx.save(); ctx.translate(-R * 0.62, s * 22);
    rr(-11, -11, 22, 22, 6); fillStroke(C('#4B453D'), ink(), 4);
    ctx.strokeStyle = C(PAL.brass); ctx.lineWidth = 3; rr(-8, -8, 16, 16, 4); ctx.stroke();
    ctx.restore();
  }
  // hull — warmer and brass-edged so he reads against the deck, not into it
  ell(0, 0, R * 0.95, R * 0.86); fillStroke(C('#7A6F5E'), ink(), 7);
  ctx.strokeStyle = C(PAL.brass); ctx.lineWidth = 4;
  ell(0, 0, R * 0.83, R * 0.74); ctx.stroke();
  ctx.fillStyle = C('#8B1A1A');
  for (let i = 0; i < 10; i++){
    const a = i / 10 * TAU;
    circ(Math.cos(a) * R * 0.89, Math.sin(a) * R * 0.8, 3.4); ctx.fill();
  }
  // shoulder plates
  for (const s of [-1, 1]){
    ctx.save(); ctx.translate(4, s * (R * 0.72));
    rr(-22, -15, 44, 30, 9); fillStroke(C('#8C8271'), ink(), 5);
    ctx.strokeStyle = C(PAL.brass); ctx.lineWidth = 4; rr(-16, -10, 32, 20, 6); ctx.stroke();
    ctx.fillStyle = C(PAL.oxblood); rr(-6, -4, 12, 8, 3); ctx.fill();
    ctx.restore();
  }
  // arms + fists
  for (const s of [-1, 1]){
    ctx.strokeStyle = C('#4B453D'); ctx.lineWidth = 12;
    ctx.beginPath(); ctx.moveTo(8, s * (R*0.7)); ctx.lineTo(R * 0.75, s * (R*0.55)); ctx.stroke();
    circ(R * 0.86, s * (R*0.5), 13); fillStroke(C('#6B6357'), ink(), 4);
  }
  // furnace core
  const pulse = 0.7 + Math.sin(S.rt * 5) * 0.2;
  const cg = ctx.createRadialGradient(6, 0, 2, 6, 0, 30);
  cg.addColorStop(0, C('#FFE49A')); cg.addColorStop(0.5, C('#E2691E')); cg.addColorStop(1, 'rgba(120,40,10,0.1)');
  ctx.save(); ctx.globalAlpha = pulse;
  circ(6, 0, 28); ctx.fillStyle = _flash ? '#FFF' : cg; ctx.fill();
  ctx.restore();
  ctx.strokeStyle = ink(); ctx.lineWidth = 5; circ(6, 0, 28); ctx.stroke();
  ctx.strokeStyle = C('#3A2B20'); ctx.lineWidth = 4;
  for (let i = -1; i <= 1; i++){
    ctx.beginPath(); ctx.moveTo(-16, i * 12); ctx.lineTo(28, i * 12); ctx.stroke();
  }
  // head dome + three eyes, under an absurd brass tricorn — he is a captain
  ctx.save(); ctx.translate(R * 0.52, 0);
  circ(0, 0, 15); fillStroke(C('#413C36'), ink(), 4);
  ctx.fillStyle = C('#FF4A3D');
  circ(6, 0, 3.4); ctx.fill(); circ(2, -7, 2.6); ctx.fill(); circ(2, 7, 2.6); ctx.fill();
  if (!_flash){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    drawGlow(6, 0, 12, '#FF4A3D', 0.55); ctx.restore();
  }
  ctx.beginPath();
  ctx.moveTo(24, 0); ctx.quadraticCurveTo(6, -26, -10, -13);
  ctx.quadraticCurveTo(-16, 0, -10, 13); ctx.quadraticCurveTo(6, 26, 24, 0);
  ctx.closePath();
  fillStroke(C('#2E2118'), ink(), 4);
  ctx.strokeStyle = C(PAL.brass); ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(20, -3); ctx.lineTo(-8, -9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(20, 3);  ctx.lineTo(-8, 9);  ctx.stroke();
  ctx.fillStyle = C(PAL.oxblood); circ(-6, 0, 4.5); fillStroke(C(PAL.oxblood), ink(), 2.5);
  ctx.restore();
  // arm cannon glow when it is about to sweep
  if (e.boss && (e.boss.atk === 'ray') && (e.state === 'windup' || e.state === 'active')){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    drawGlow(R * 0.95, 0, 38, '#FFE49A', 0.6 + Math.sin(S.rt * 30) * 0.3);
    ctx.restore();
  }
  if (rnd() < 0.25){
    for (const s of [-1, 1]) pSmoke(e.x - Math.cos(e.facing) * R * 0.6 - Math.sin(e.facing) * s * 22,
                                   e.y - Math.sin(e.facing) * R * 0.6 + Math.cos(e.facing) * s * 22,
                                   1, 'rgba(60,55,50,0.5)', 40);
  }
}

/* ---------------------------------------------------------------------------
   RENDER — boarding markers + attack telegraphs (always before the hit lands)
--------------------------------------------------------------------------- */
function drawTelegraphs(){
  ctx.save();
  ctx.lineJoin = 'round';

  // boarding markers
  for (const e of S.enemies){
    if (e.state !== 'climb') continue;
    const k = e.climb;
    ctx.save();
    ctx.translate(e.spawnX, e.spawnY);
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(S.rt * 12);
    ctx.strokeStyle = PAL.oxblood; ctx.lineWidth = 3;
    circ(0, 0, 22); ctx.stroke();
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = PAL.brass; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, 22, -Math.PI/2, -Math.PI/2 + TAU * k); ctx.stroke();
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = PAL.oxblood;
    for (let i = 0; i < 3; i++){
      const o = ((S.rt * 40 + i * 12) % 36) - 18;
      ctx.beginPath();
      ctx.moveTo(-7, o + 6); ctx.lineTo(0, o); ctx.lineTo(7, o + 6);
      ctx.lineTo(7, o + 10); ctx.lineTo(0, o + 4); ctx.lineTo(-7, o + 10);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // attack telegraphs
  for (const e of S.enemies){
    if (e.dead) continue;
    const def = e.def;
    if (e.state === 'windup'){
      const total = e.type === 'BOSS' ? (e.boss.atk === 'slam' ? 0.9 : e.boss.atk === 'summon' ? 0.7 : 0.8) : def.windup;
      const k = 1 - clamp(e.st / total, 0, 1);
      ctx.save();
      ctx.translate(e.x, e.y);
      const flick = 0.30 + 0.34 * k + Math.sin(S.rt * 26) * 0.06;
      if (e.type === 'BOSS' && e.boss.atk === 'slam'){
        ctx.globalAlpha = flick * 0.55;
        ctx.fillStyle = PAL.oxblood; circ(0, 0, 240 * k); ctx.fill();
        ctx.globalAlpha = 0.9; ctx.strokeStyle = '#FF5B4A'; ctx.lineWidth = 5;
        circ(0, 0, 240); ctx.stroke();
      } else if (e.type === 'BOSS' && e.boss.atk === 'summon'){
        ctx.globalAlpha = flick * 0.6; ctx.strokeStyle = '#FF5B4A'; ctx.lineWidth = 6;
        ctx.setLineDash([14, 10]); ctx.lineDashOffset = -S.rt * 40;
        circ(0, 0, 130); ctx.stroke();
      } else if (e.type === 'BOSS'){
        ctx.rotate(e.atkAng);
        ctx.globalAlpha = flick * 0.5; ctx.fillStyle = PAL.oxblood;
        ctx.fillRect(0, -26, 620, 52);
        ctx.globalAlpha = 0.85; ctx.strokeStyle = '#FF5B4A'; ctx.lineWidth = 3;
        ctx.strokeRect(0, -26, 620, 52);
      } else if (def.ai === 'ranged'){
        ctx.rotate(e.atkAng);
        ctx.globalAlpha = flick * 0.55;
        ctx.fillStyle = PAL.oxblood; ctx.fillRect(16, -3.5, def.atkRange + 60, 7);
        ctx.globalAlpha = 0.95;
        ctx.fillStyle = '#FF5B4A';
        ctx.fillRect(16, -1.6, (def.atkRange + 60) * k, 3.2);
        ctx.beginPath(); ctx.moveTo(def.atkRange + 76, 0);
        ctx.lineTo(def.atkRange + 62, -8); ctx.lineTo(def.atkRange + 62, 8); ctx.closePath(); ctx.fill();
      } else {
        ctx.rotate(e.atkAng);
        ctx.globalAlpha = flick * 0.6;
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, def.reach, -def.swing/2, def.swing/2); ctx.closePath();
        ctx.fillStyle = PAL.oxblood; ctx.fill();
        ctx.globalAlpha = 0.95; ctx.strokeStyle = '#FF5B4A'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, def.reach, -def.swing/2, -def.swing/2 + def.swing * k); ctx.stroke();
      }
      ctx.restore();
    }
    // boss ray while it is actually firing
    if (e.type === 'BOSS' && e.state === 'active'){
      ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.facing);
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(0, -26, 0, 26);
      g.addColorStop(0, 'rgba(226,105,30,0)'); g.addColorStop(0.5, 'rgba(255,228,154,0.95)');
      g.addColorStop(1, 'rgba(226,105,30,0)');
      ctx.fillStyle = g; ctx.fillRect(0, -26, 620, 52);
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(0, -7, 620, 14);
      ctx.restore();
    }
  }
  ctx.restore();
}

/* ---------------------------------------------------------------------------
   RENDER — skill VFX. Additive, bright core + soft outer glow, element coloured.
--------------------------------------------------------------------------- */
function jitterAt(i, seed){
  const n = Math.sin(i * 127.1 + seed * 311.7) * 43758.5453;
  return (n - Math.floor(n)) * 2 - 1;
}

// Pass 1 — solid, normal-blend bodies. Additive alone whites out over the bright
// deck; a saturated underlay is what keeps each element identifiable in a crowd.
function drawFxSolid(){
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const f of S.fx){
    if (f.delay > 0) continue;
    const k = clamp(f.t / f.life, 0, 1), inv = 1 - k, e = easeOut(k);
    if (f.kind === 'arc'){
      // a filled crescent reads as a swing; a stroked arc reads as a hoop
      const R = f.r * (0.62 + 0.42 * e);
      const R0 = R * (0.42 + 0.18 * e);
      const half = f.arc/2 * (0.30 + 0.70 * e);
      ctx.save(); ctx.translate(f.x, f.y);
      ctx.beginPath();
      ctx.arc(0, 0, R, f.a - half, f.a + half);
      ctx.arc(0, 0, R0, f.a + half, f.a - half, true);
      ctx.closePath();
      const g = ctx.createRadialGradient(0, 0, R0, 0, 0, R);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.55, f.col); g.addColorStop(1, f.glow);
      ctx.globalAlpha = inv * 0.78; ctx.fillStyle = g; ctx.fill();
      ctx.globalAlpha = inv * 0.9;
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3; ctx.stroke();
      ctx.restore();
    } else if (f.kind === 'cone'){
      const R = f.r * (0.35 + 0.75 * e);
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
      ctx.globalAlpha = inv * 0.42;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, -f.arc/2, f.arc/2); ctx.closePath();
      ctx.fillStyle = f.col; ctx.fill();
      ctx.globalAlpha = inv * 0.8;
      ctx.strokeStyle = f.col; ctx.lineWidth = 5; ctx.stroke();
      ctx.restore();
    } else if (f.kind === 'aoe'){
      ctx.globalAlpha = inv * 0.34;
      ctx.fillStyle = f.col; circ(f.x, f.y, f.r * (0.45 + 0.55 * e)); ctx.fill();
      // hard ring at the true damage radius — it teaches the hit area
      ctx.globalAlpha = inv * 0.55;
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 11 * inv + 4;
      circ(f.x, f.y, f.r * (0.55 + 0.45 * e)); ctx.stroke();
      ctx.globalAlpha = inv * 0.95;
      ctx.strokeStyle = f.col; ctx.lineWidth = 7 * inv + 2.5;
      circ(f.x, f.y, f.r * (0.55 + 0.45 * e)); ctx.stroke();
    } else if (f.kind === 'line'){
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
      const w = f.w * (0.6 + 0.4 * inv);
      ctx.globalAlpha = inv * 0.55;
      ctx.fillStyle = f.col; ctx.fillRect(0, -w/2, f.len, w);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawFx(){
  drawFxSolid();
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  for (const f of S.fx){
    if (f.delay > 0) continue;
    const k = clamp(f.t / f.life, 0, 1), inv = 1 - k, e = easeOut(k);

    if (f.kind === 'arc'){
      const R = f.r * (0.62 + 0.42 * e);
      const half = f.arc/2 * (0.30 + 0.70 * e);
      ctx.save(); ctx.translate(f.x, f.y);
      ctx.globalAlpha = inv * 0.30;
      ctx.strokeStyle = f.col; ctx.lineWidth = 26 * inv + 12;
      ctx.beginPath(); ctx.arc(0, 0, R * 0.9, f.a - half, f.a + half); ctx.stroke();
      ctx.globalAlpha = inv * 0.95;
      ctx.strokeStyle = f.glow; ctx.lineWidth = 8 * inv + 2.5;
      ctx.beginPath(); ctx.arc(0, 0, R, f.a - half, f.a + half); ctx.stroke();
      // leading spark on both tips of the swing
      ctx.globalAlpha = inv;
      ctx.fillStyle = '#FFFFFF';
      circ(Math.cos(f.a + half) * R, Math.sin(f.a + half) * R, 6 * inv + 1.5); ctx.fill();
      circ(Math.cos(f.a - half) * R, Math.sin(f.a - half) * R, 6 * inv + 1.5); ctx.fill();
      ctx.restore();

    } else if (f.kind === 'line'){
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
      const w = f.w * (1 + e * 0.5) * inv + 3;
      const g = ctx.createLinearGradient(0, -w, 0, w);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, f.col); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = inv * 0.8;
      ctx.fillStyle = g; ctx.fillRect(0, -w, f.len, w * 2);
      ctx.globalAlpha = inv;
      ctx.fillStyle = f.glow; ctx.fillRect(0, -w * 0.28, f.len, w * 0.56);
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, -w * 0.1, f.len * (0.3 + 0.7*inv), w * 0.2);
      // muzzle star
      ctx.globalAlpha = inv * 0.9;
      drawGlow(0, 0, 40 * inv + 10, f.glow, 1);
      ctx.restore();

    } else if (f.kind === 'cone'){
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
      const R = f.r * (0.35 + 0.75 * e);
      const g = ctx.createRadialGradient(0, 0, 6, 0, 0, R);
      g.addColorStop(0, f.glow); g.addColorStop(0.45, f.col); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = inv * 0.85;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, -f.arc/2, f.arc/2); ctx.closePath();
      ctx.fillStyle = g; ctx.fill();
      ctx.globalAlpha = inv * 0.7;
      ctx.strokeStyle = f.glow; ctx.lineWidth = 4 * inv + 1;
      ctx.beginPath(); ctx.arc(0, 0, R, -f.arc/2, f.arc/2); ctx.stroke();
      // streaks
      ctx.globalAlpha = inv * 0.5;
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++){
        const a = lerp(-f.arc/2, f.arc/2, (i + 0.5)/6);
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * R * 0.3, Math.sin(a) * R * 0.3);
        ctx.lineTo(Math.cos(a) * R * 0.95, Math.sin(a) * R * 0.95);
        ctx.stroke();
      }
      ctx.restore();

    } else if (f.kind === 'aoe'){
      ctx.save(); ctx.translate(f.x, f.y);
      const R = f.r * (0.35 + 0.72 * e);
      // hot core, brief
      ctx.globalAlpha = Math.max(0, 1 - k * 2.6) * 0.85;
      drawGlow(0, 0, R * 0.62, f.glow || f.col, 1);
      drawGlow(0, 0, R * 0.3, '#FFFFFF', 0.85);
      // thin bright rim on the true radius
      ctx.globalAlpha = inv * 0.6;
      ctx.strokeStyle = f.glow || '#FFF'; ctx.lineWidth = 3 * inv + 1;
      circ(0, 0, f.r * (0.55 + 0.45 * e)); ctx.stroke();
      // radial spokes give it shape instead of a haze
      ctx.globalAlpha = inv * 0.45;
      ctx.strokeStyle = f.glow || f.col; ctx.lineWidth = 2.5;
      for (let i = 0; i < 8; i++){
        const a = i / 8 * TAU + (f.x + f.y) * 0.01;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * R * 0.35, Math.sin(a) * R * 0.35);
        ctx.lineTo(Math.cos(a) * R * (0.9 + 0.28 * e), Math.sin(a) * R * (0.9 + 0.28 * e));
        ctx.stroke();
      }
      ctx.restore();

    } else if (f.kind === 'chain'){
      const seed = Math.floor(f.t * 34);
      ctx.save();
      for (let pass = 0; pass < 2; pass++){
        ctx.globalAlpha = inv * (pass ? 0.95 : 0.34);
        ctx.strokeStyle = pass ? (f.glow || '#FFF') : f.col;
        ctx.lineWidth = pass ? (4 * inv + 1.4) : (16 * inv + 5);
        ctx.beginPath();
        for (let s = 0; s < f.pts.length - 1; s++){
          const a = f.pts[s], b = f.pts[s+1];
          const dx = b.x - a.x, dy = b.y - a.y;
          const L = Math.hypot(dx, dy) || 1;
          const nx = -dy / L, ny = dx / L;
          ctx.moveTo(a.x, a.y);
          for (let i = 1; i <= 5; i++){
            const t = i / 5;
            const amp = (i === 5 ? 0 : 13 * inv);
            const j = jitterAt(s * 11 + i, seed) * amp;
            ctx.lineTo(a.x + dx * t + nx * j, a.y + dy * t + ny * j);
          }
        }
        ctx.stroke();
      }
      ctx.globalAlpha = inv;
      for (let i = 1; i < f.pts.length; i++)
        drawGlow(f.pts[i].x, f.pts[i].y, 26 * inv + 6, f.glow || '#FFFFFF', 1);
      ctx.restore();

    } else if (f.kind === 'muzzle'){
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
      ctx.globalAlpha = inv;
      drawGlow(0, 0, 28 * inv + 7, f.glow || f.col, 1);
      drawGlow(0, 0, 13 * inv + 4, '#FFFFFF', 0.9);
      ctx.strokeStyle = f.glow || f.col; ctx.lineWidth = 3 * inv + 1;
      for (let i = 0; i < 4; i++){
        const a = i / 4 * TAU + 0.4;
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * (30 * inv + 6), Math.sin(a) * (30 * inv + 6)); ctx.stroke();
      }
      ctx.restore();

    } else if (f.kind === 'pop' || f.kind === 'fizzle'){
      ctx.save();
      ctx.globalAlpha = inv * (f.kind === 'pop' ? 0.85 : 0.4);
      ctx.strokeStyle = f.col; ctx.lineWidth = 6 * inv + 1;
      circ(f.x, f.y, (f.r || 20) * (0.4 + 1.3 * e)); ctx.stroke();
      ctx.restore();

    } else if (f.kind === 'gear'){
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.t * 6);
      ctx.globalAlpha = inv * 0.9;
      ctx.strokeStyle = PAL.brass; ctx.lineWidth = 5 * inv + 2;
      const R = 30 + 40 * e;
      circ(0, 0, R); ctx.stroke();
      for (let i = 0; i < 8; i++){
        const a = i / 8 * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R);
        ctx.lineTo(Math.cos(a) * (R + 10), Math.sin(a) * (R + 10)); ctx.stroke();
      }
      ctx.restore();

    } else if (f.kind === 'swing'){
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.a);
      ctx.globalAlpha = inv * 0.55;
      ctx.strokeStyle = '#EDE4C8'; ctx.lineWidth = 7 * inv + 1;
      ctx.beginPath(); ctx.arc(0, 0, f.r * 0.85, -f.arc/2, f.arc/2); ctx.stroke();
      ctx.restore();

    } else if (f.kind === 'stun'){
      // handled on the enemy itself
    }
  }
  ctx.restore();
}

function drawRay(){
  const R = S.player.ray;
  if (!R) return;
  const sk = S.slots[R.slot];
  if (!sk) return;
  const st = skillStats(sk), E = ELEMENTS[sk.element];
  const P = S.player, a = P.aim;
  const pulse = 0.85 + Math.sin(S.rt * 40) * 0.15;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(P.x, P.y); ctx.rotate(a);
  // half-width: matches the hit test, so the beam never claims more than it hits
  const hw = st.width * 0.5 * pulse;
  const g = ctx.createLinearGradient(0, -hw, 0, hw);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.5, E.color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.6; ctx.fillStyle = g;
  ctx.fillRect(14, -hw, R.len, hw * 2);
  ctx.globalAlpha = 0.7; ctx.fillStyle = E.glow;
  ctx.fillRect(14, -hw * 0.42, R.len, hw * 0.84);
  ctx.globalAlpha = 0.8; ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(14, -hw * 0.16, R.len, hw * 0.32);
  // ripples travelling down the beam
  ctx.globalAlpha = 0.4; ctx.fillStyle = '#FFFFFF';
  for (let i = 0; i < 5; i++){
    const x = 14 + ((S.rt * 520 + i * 120) % Math.max(40, R.len));
    ctx.fillRect(x, -hw * 0.8, 9, hw * 1.6);
  }
  // emitter + impact
  ctx.globalAlpha = 1;
  drawGlow(14, 0, 28, E.glow, 0.9);
  drawGlow(14 + R.len, 0, 40 * pulse, E.glow, 1);
  drawGlow(14 + R.len, 0, 18 * pulse, '#FFFFFF', 0.9);
  ctx.restore();
}

function drawFields(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const f of S.fields){
    const E = ELEMENTS[f.elem];
    const k = clamp(f.life / 2, 0, 1);
    drawGlow(f.x, f.y, f.r, E.color, 0.42 * k);
    ctx.globalAlpha = 0.55 * k;
    ctx.strokeStyle = E.color; ctx.lineWidth = 3;
    ctx.setLineDash([10, 8]); ctx.lineDashOffset = -S.rt * 30;
    circ(f.x, f.y, f.r * (0.9 + Math.sin(S.rt * 3 + f.seed) * 0.05)); ctx.stroke();
    ctx.setLineDash([]);
  }
  ctx.restore();
}

function drawBolts(){
  ctx.save();
  for (const b of S.bolts){
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(0, 0, 20, '#FFC168', 1);
    ctx.fillStyle = 'rgba(255,193,104,0.6)';
    ctx.beginPath(); ctx.moveTo(-26, -4); ctx.lineTo(2, 0); ctx.lineTo(-26, 4); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#FFE49A'; circ(0, 0, 4.2); fillStroke('#FFE49A', '#7A4A10', 2);
    ctx.restore();
  }
  ctx.restore();
}

function drawPickup(p){
  const bob = Math.sin(p.bob) * 3;
  const fade = p.life < 3 ? (0.4 + 0.6 * Math.abs(Math.sin(p.life * 8))) : 1;
  ctx.save();
  ctx.globalAlpha = fade;
  groundShadow(p.x, p.y + 6, 9, 6, 0.25);
  ctx.translate(p.x, p.y + bob);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(0, 0, 26, '#8CE07A', 0.6 * fade);
  ctx.restore();
  ctx.rotate(S.rt * 1.6);
  ctx.lineJoin = 'round';
  circ(0, 0, 9); fillStroke(PAL.brass, PAL.ink, 3);
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3;
  for (let i = 0; i < 6; i++){
    const a = i / 6 * TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 8, Math.sin(a) * 8);
    ctx.lineTo(Math.cos(a) * 12, Math.sin(a) * 12); ctx.stroke();
  }
  ctx.rotate(-S.rt * 1.6);
  ctx.fillStyle = '#5FBF4C';
  ctx.fillRect(-5.5, -1.8, 11, 3.6); ctx.fillRect(-1.8, -5.5, 3.6, 11);
  ctx.restore();
}

function drawParticles(){
  const pool = Particles.pool;
  ctx.save();
  // additive pass
  ctx.globalCompositeOperation = 'lighter';
  for (const p of pool){
    if (!p.live || !p.add) continue;
    const k = p.life / p.max;
    ctx.globalAlpha = clamp(k, 0, 1);
    if (p.kind === 'spark'){
      ctx.strokeStyle = p.col; ctx.lineWidth = p.size * k;
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.014 * p.w, p.y - p.vy * 0.014 * p.w); ctx.stroke();
    } else {
      ctx.fillStyle = p.col; circ(p.x, p.y, p.size * k); ctx.fill();
    }
  }
  // normal pass
  ctx.globalCompositeOperation = 'source-over';
  for (const p of pool){
    if (!p.live || p.add) continue;
    const k = p.life / p.max;
    if (p.kind === 'shard'){
      ctx.save();
      ctx.globalAlpha = clamp(k * 1.4, 0, 1);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.7);
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.4;
      ctx.strokeRect(-p.size/2, -p.size/2, p.size, p.size * 0.7);
      ctx.restore();
    } else if (p.kind === 'smoke'){
      ctx.globalAlpha = clamp(k * 0.75, 0, 1);
      ctx.fillStyle = p.col;
      circ(p.x, p.y, p.size * (1.6 - k * 0.6)); ctx.fill();
    } else {
      ctx.globalAlpha = clamp(k, 0, 1);
      ctx.fillStyle = p.col; circ(p.x, p.y, p.size * k); ctx.fill();
    }
  }
  ctx.restore();
}

function drawNums(){
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let lastPx = -1;
  ctx.lineWidth = 5; ctx.lineJoin = 'round';
  for (const n of S.nums){
    const k = n.t / n.life;
    const pop = n.crit ? (1 + Math.max(0, 0.5 - k * 4)) : 1;
    ctx.globalAlpha = k < 0.7 ? 1 : (1 - (k - 0.7) / 0.3);
    const px = Math.round(n.size * pop);
    if (px !== lastPx){ setFont(px, 800, true); lastPx = px; }
    ctx.strokeStyle = 'rgba(28,20,15,0.9)';
    ctx.strokeText(n.text, n.x, n.y);
    ctx.fillStyle = n.col;
    ctx.fillText(n.text, n.x, n.y);
  }
  ctx.restore();
}

/* ---------------------------------------------------------------------------
   RENDER — world composition
--------------------------------------------------------------------------- */
function drawAoePreview(){
  for (let i = 0; i < 4; i++){
    const sk = S.slots[i];
    if (!sk || SHAPES[sk.shape].kind !== 'aoe') continue;
    const st = skillStats(sk);
    let tx = Input.mouse.x, ty = Input.mouse.y;
    const d = dist(S.player.x, S.player.y, tx, ty);
    if (d > st.castRange){
      tx = S.player.x + (tx - S.player.x) / d * st.castRange;
      ty = S.player.y + (ty - S.player.y) / d * st.castRange;
    }
    const c = clampToDeck(tx, ty, 6);
    const ready = sk.cdLeft <= 0;
    const E = ELEMENTS[sk.element];
    ctx.save();
    ctx.globalAlpha = ready ? 0.34 : 0.13;
    ctx.strokeStyle = E.color; ctx.lineWidth = 2.5;
    ctx.setLineDash([9, 7]); ctx.lineDashOffset = -S.rt * 26;
    circ(c.x, c.y, st.radius); ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = ready ? 0.10 : 0.04;
    ctx.fillStyle = E.color; circ(c.x, c.y, st.radius); ctx.fill();
    ctx.restore();
    return;
  }
}

function drawWorld(){
  drawStage();
  drawFields();
  drawTelegraphs();
  drawAoePreview();
  drawPlayerTrail();

  const list = [];
  for (const p of SOLID_PROPS) list.push({ y: p.y, k: 0, o: p });
  for (const e of S.enemies)   list.push({ y: e.y, k: 1, o: e });
  list.push({ y: S.boiler.y + 22, k: 2 });
  for (const p of S.pickups)   list.push({ y: p.y, k: 4, o: p });
  list.sort((a, b) => a.y - b.y);
  for (const it of list){
    if (it.k === 0) drawProp(it.o);
    else if (it.k === 1) drawEnemy(it.o);
    else if (it.k === 2) drawBoiler();
    else drawPickup(it.o);
  }
  // the captain always draws on top — you must never lose yourself in a crowd
  drawPlayer();
  drawBolts();
  drawFx();
  drawRay();
  drawParticles();
  drawNums();
}

/* ---------------------------------------------------------------------------
   RENDER — top level
--------------------------------------------------------------------------- */
function render(){
  ctx.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;

  drawSky();

  ctx.save();
  ctx.translate(View.ox, View.oy);
  ctx.scale(View.scale, View.scale);
  const W = TUNING.world;
  ctx.translate(W.w/2, W.h/2); ctx.rotate(S.shakeR); ctx.translate(-W.w/2, -W.h/2);
  ctx.translate(S.shakeX, S.shakeY);

  drawClouds();
  drawWorld();
  ctx.restore();

  drawScreenFx();
  const ended = S.mode === 'gameover' || S.mode === 'victory';
  if (S.mode !== 'title' && !ended) drawHUD();
  if (S.mode === 'draft') drawDraft();
  if (S.mode === 'pause') drawPause();
  if (S.mode === 'title') drawTitle();
  if (S.mode === 'gameover' || S.mode === 'victory') drawEndScreen();
  if (S.showFps) drawFps();
  drawCursor();
}

// F3 — frame time, entity counts. Cheap, and it keeps you honest.
function drawFps(){
  const b = S.ftBuf, n = Math.min(S.ftIdx, b.length);
  if (n < 4) return;
  let sum = 0, worst = 0;
  for (let i = 0; i < n; i++){ sum += b[i]; if (b[i] > worst) worst = b[i]; }
  const avg = sum / n;
  let live = 0, parts = 0;
  for (const e of S.enemies) if (!e.dead) live++;
  for (const p of Particles.pool) if (p.live) parts++;
  const HS = hudScale();
  ctx.save();
  const lines = [
    Math.round(1 / avg) + ' fps   ' + (avg * 1000).toFixed(1) + ' ms   peak ' + (worst * 1000).toFixed(0) + ' ms',
    live + ' boarders   ' + parts + ' particles   ' + S.fx.length + ' fx   ' + S.nums.length + ' numbers',
  ];
  setFont(Math.round(13 * HS), 700, false);
  const w = Math.max(ctx.measureText(lines[0]).width, ctx.measureText(lines[1]).width) + 22 * HS;
  brassPanel(View.w - w - 16 * HS, 16 * HS, w, 50 * HS, 7 * HS, 0.9);
  lines.forEach((l, i) => textOut(l, View.w - w - 5 * HS, 30 * HS + i * 19 * HS,
                                  i ? '#B9AE86' : (1/avg > 55 ? '#8CE07A' : '#FFB05A'), null, 0, 'left'));
  ctx.restore();
}

function drawScreenFx(){
  const w = View.w, h = View.h;
  if (!_vigCv) buildBackdrops();
  // low-health vignette
  const hpFrac = S.player ? S.player.hp / S.player.maxHp : 1;
  if (S.mode !== 'title' && hpFrac < 0.3 && S.player.hp > 0){
    const pulse = 0.35 + Math.sin(S.rt * 5.5) * 0.22;
    ctx.save();
    ctx.globalAlpha = clamp(pulse * (1 - hpFrac/0.3) * 0.9, 0, 1);
    ctx.drawImage(_redCv, 0, 0, w, h);
    ctx.restore();
  }
  // permanent soft vignette for focus
  ctx.drawImage(_vigCv, 0, 0, w, h);

  if (S.flashRed > 0){
    ctx.fillStyle = 'rgba(160,30,30,' + (S.flashRed * 0.35).toFixed(3) + ')';
    ctx.fillRect(0, 0, w, h);
  }
  if (S.flashWhite > 0){
    ctx.fillStyle = 'rgba(255,248,230,' + (S.flashWhite * 0.7).toFixed(3) + ')';
    ctx.fillRect(0, 0, w, h);
  }
}

function drawCursor(){
  const x = Input.mouse.sx, y = Input.mouse.sy;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(S.rt * 0.7);
  ctx.strokeStyle = 'rgba(35,26,20,0.85)'; ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
  ctx.strokeStyle = PAL.brass; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
  for (let i = 0; i < 4; i++){
    const a = i / 4 * TAU;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 5, Math.sin(a) * 5);
    ctx.lineTo(Math.cos(a) * 9, Math.sin(a) * 9);
    ctx.stroke();
  }
  ctx.rotate(-S.rt * 0.7);
  ctx.fillStyle = PAL.oxblood;
  ctx.beginPath(); ctx.arc(0, 0, 2.6, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ---------------------------------------------------------------------------
   RENDER — HUD. Brass-framed panels, no images, all drawn.
--------------------------------------------------------------------------- */
function hudScale(){ return clamp(Math.min(View.w / 1400, View.h / 860), 0.6, 1.4); }

function brassPanel(x, y, w, h, r, alpha){
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  rr(x, y, w, h, r);
  ctx.fillStyle = 'rgba(32,25,19,0.86)'; ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 5; ctx.stroke();
  rr(x + 3, y + 3, w - 6, h - 6, Math.max(2, r - 3));
  ctx.strokeStyle = PAL.brass; ctx.lineWidth = 2.4; ctx.stroke();
  ctx.fillStyle = PAL.brass;
  const pd = 9;
  for (const p of [[x+pd,y+pd],[x+w-pd,y+pd],[x+pd,y+h-pd],[x+w-pd,y+h-pd]]){
    ctx.beginPath(); ctx.arc(p[0], p[1], 2.6, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function gearFrame(cx, cy, r, col, teeth){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let i = 0; i < (teeth || 10); i++){
    const a = i / (teeth || 10) * TAU;
    ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    ctx.lineTo(Math.cos(a) * (r + r * 0.16), Math.sin(a) * (r + r * 0.16));
  }
  ctx.stroke();
  ctx.restore();
}

// The six shape glyphs — a player should learn the vocabulary from the icons.
// Rendered once into a sprite (shadowBlur is far too expensive per frame).
const _spriteCache = new Map();
function cachedSprite(key, half, draw){
  let cn = _spriteCache.get(key);
  if (cn) return cn;
  cn = document.createElement('canvas');
  cn.width = cn.height = Math.max(2, Math.ceil(half * 2));
  const c2 = cn.getContext('2d');
  withCtx(c2, () => { c2.translate(half, half); draw(); });
  _spriteCache.set(key, cn);
  return cn;
}
function drawShapeGlyph(shape, cx, cy, r, col, glow){
  r = Math.max(1, Math.round(r));
  const half = Math.ceil(r * 1.9 + 18);
  const cn = cachedSprite('g|'+shape+'|'+r+'|'+col+'|'+glow, half,
                          () => drawShapeGlyphRaw(shape, 0, 0, r, col, glow));
  ctx.drawImage(cn, cx - half, cy - half);
}
function drawCardIcon(kind, cx, cy, r, col, glow){
  r = Math.max(1, Math.round(r));
  const half = Math.ceil(r * 1.8 + 18);
  const cn = cachedSprite('i|'+kind+'|'+r+'|'+col+'|'+glow, half,
                          () => drawCardIconRaw(kind, 0, 0, r, col, glow));
  ctx.drawImage(cn, cx - half, cy - half);
}

function drawShapeGlyphRaw(shape, cx, cy, r, col, glow){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = glow; ctx.shadowBlur = 10;
  ctx.strokeStyle = col; ctx.fillStyle = col;
  if (shape === 'CLOSEHIT'){
    ctx.lineWidth = r * 0.30;
    ctx.beginPath(); ctx.arc(-r*0.35, 0, r * 0.82, -1.15, 1.15); ctx.stroke();
    ctx.lineWidth = r * 0.16; ctx.strokeStyle = glow;
    ctx.beginPath(); ctx.arc(-r*0.35, 0, r * 0.82, -0.95, 0.95); ctx.stroke();
    ctx.beginPath(); ctx.arc(-r*0.62, 0, r*0.22, 0, TAU); ctx.fillStyle = col; ctx.fill();
  } else if (shape === 'LINE_BURST'){
    ctx.lineWidth = r * 0.30;
    ctx.beginPath(); ctx.moveTo(-r*0.9, 0); ctx.lineTo(r*0.42, 0); ctx.stroke();
    ctx.strokeStyle = glow; ctx.lineWidth = r * 0.13;
    ctx.beginPath(); ctx.moveTo(-r*0.9, 0); ctx.lineTo(r*0.42, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.92, 0); ctx.lineTo(r*0.30, -r*0.46); ctx.lineTo(r*0.30, r*0.46);
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  } else if (shape === 'CONE'){
    ctx.beginPath(); ctx.moveTo(-r*0.85, 0);
    ctx.arc(-r*0.85, 0, r * 1.6, -0.62, 0.62); ctx.closePath();
    ctx.globalAlpha = 0.42; ctx.fill();
    ctx.globalAlpha = 1; ctx.lineWidth = r * 0.17; ctx.stroke();
    ctx.strokeStyle = glow; ctx.lineWidth = r * 0.11;
    ctx.beginPath(); ctx.arc(-r*0.85, 0, r * 1.6, -0.62, 0.62); ctx.stroke();
  } else if (shape === 'RANGED_AOE'){
    ctx.lineWidth = r * 0.20;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = glow; ctx.lineWidth = r * 0.16;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.34, 0, TAU); ctx.stroke();
    ctx.lineWidth = r * 0.12;
    for (let i = 0; i < 4; i++){
      const a = i / 4 * TAU + Math.PI/4;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95);
      ctx.lineTo(Math.cos(a) * r * 1.2, Math.sin(a) * r * 1.2); ctx.stroke();
    }
  } else if (shape === 'CHAIN'){
    ctx.lineWidth = r * 0.20;
    ctx.beginPath();
    ctx.moveTo(-r*0.95, r*0.4); ctx.lineTo(-r*0.25, -r*0.5);
    ctx.lineTo(r*0.15, r*0.25); ctx.lineTo(r*0.95, -r*0.55);
    ctx.stroke();
    ctx.strokeStyle = glow; ctx.lineWidth = r * 0.09; ctx.stroke();
    ctx.fillStyle = glow;
    for (const p of [[-r*0.25,-r*0.5],[r*0.15,r*0.25],[r*0.95,-r*0.55]]){
      ctx.beginPath(); ctx.arc(p[0], p[1], r * 0.15, 0, TAU); ctx.fill();
    }
  } else if (shape === 'RAY'){
    ctx.globalAlpha = 0.5; ctx.lineWidth = r * 0.44;
    ctx.beginPath(); ctx.moveTo(-r*0.8, 0); ctx.lineTo(r*0.95, 0); ctx.stroke();
    ctx.globalAlpha = 1; ctx.strokeStyle = glow; ctx.lineWidth = r * 0.17;
    ctx.beginPath(); ctx.moveTo(-r*0.8, 0); ctx.lineTo(r*0.95, 0); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(-r*0.82, 0, r * 0.28, 0, TAU); ctx.fill();
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(-r*0.82, 0, r * 0.14, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

// Little procedural icons for the cards that aren't tied to a skill slot.
const CARD_ICON = {
  burnDmg:'flame', burnDur:'flame', slowAmt:'frost', brittle:'frost', stun:'bolt',
  knock:'steam', scald:'steam', hp:'heart', spd:'boot', dashcd:'dash', dashdmg:'dash',
  dashchg:'dash', crit:'crit', critx:'crit', scrap:'scrap', lifesteal:'scrap',
  boilerhp:'boiler', boilerdr:'boiler', fifth:'gear', residue:'burst', autofire:'burst',
  killboom:'burst',
};
function drawCardIconRaw(kind, x, y, r, col, glow){
  ctx.save();
  ctx.translate(x, y);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.shadowColor = glow || col; ctx.shadowBlur = 12;
  ctx.lineWidth = r * 0.22;
  if (kind === 'flame'){
    ctx.beginPath();
    ctx.moveTo(0, -r);
    ctx.bezierCurveTo(r*0.85, -r*0.2, r*0.7, r*0.75, 0, r);
    ctx.bezierCurveTo(-r*0.7, r*0.75, -r*0.85, -r*0.2, 0, -r);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#FFF2C8';
    ctx.beginPath();
    ctx.moveTo(0, -r*0.25);
    ctx.bezierCurveTo(r*0.42, r*0.1, r*0.34, r*0.62, 0, r*0.78);
    ctx.bezierCurveTo(-r*0.34, r*0.62, -r*0.42, r*0.1, 0, -r*0.25);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'frost'){
    for (let i = 0; i < 3; i++){
      const a = i / 3 * Math.PI;
      ctx.beginPath();
      ctx.moveTo(-Math.cos(a)*r, -Math.sin(a)*r);
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); ctx.stroke();
      for (const s of [-1, 1]){
        const bx = Math.cos(a)*r*s*0.62, by = Math.sin(a)*r*s*0.62;
        ctx.beginPath(); ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(a + 0.9)*r*0.32*s, by + Math.sin(a + 0.9)*r*0.32*s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(a - 0.9)*r*0.32*s, by + Math.sin(a - 0.9)*r*0.32*s); ctx.stroke();
      }
    }
  } else if (kind === 'bolt'){
    ctx.beginPath();
    ctx.moveTo(r*0.28, -r); ctx.lineTo(-r*0.5, r*0.12); ctx.lineTo(-r*0.03, r*0.12);
    ctx.lineTo(-r*0.3, r); ctx.lineTo(r*0.55, -r*0.18); ctx.lineTo(r*0.07, -r*0.18);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'steam'){
    for (let i = 0; i < 3; i++){
      const yy = -r*0.5 + i * r*0.55;
      ctx.beginPath();
      ctx.moveTo(-r*0.9, yy);
      ctx.bezierCurveTo(-r*0.3, yy - r*0.4, r*0.3, yy + r*0.4, r*0.9, yy);
      ctx.stroke();
    }
  } else if (kind === 'heart'){
    ctx.beginPath();
    ctx.moveTo(0, r*0.85);
    ctx.bezierCurveTo(-r*1.35, -r*0.1, -r*0.5, -r*1.05, 0, -r*0.35);
    ctx.bezierCurveTo(r*0.5, -r*1.05, r*1.35, -r*0.1, 0, r*0.85);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'boot'){
    ctx.beginPath();
    ctx.moveTo(-r*0.35, -r*0.9); ctx.lineTo(r*0.2, -r*0.9);
    ctx.lineTo(r*0.2, r*0.15); ctx.lineTo(r, r*0.5); ctx.lineTo(r, r*0.85);
    ctx.lineTo(-r*0.6, r*0.85); ctx.lineTo(-r*0.6, -r*0.55);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = glow || '#FFF'; ctx.lineWidth = r*0.14;
    ctx.beginPath(); ctx.moveTo(-r*0.6, r*0.45); ctx.lineTo(r, r*0.45); ctx.stroke();
  } else if (kind === 'dash'){
    for (let i = 0; i < 3; i++){
      const ox = -r*0.75 + i * r*0.7;
      ctx.globalAlpha = 0.35 + i * 0.32;
      ctx.beginPath();
      ctx.moveTo(ox - r*0.28, -r*0.62); ctx.lineTo(ox + r*0.34, 0);
      ctx.lineTo(ox - r*0.28, r*0.62);
      ctx.lineWidth = r*0.26; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (kind === 'crit'){
    ctx.beginPath();
    for (let i = 0; i < 10; i++){
      const a = i / 10 * TAU - Math.PI/2;
      const rr2 = i % 2 ? r * 0.42 : r;
      i ? ctx.lineTo(Math.cos(a)*rr2, Math.sin(a)*rr2) : ctx.moveTo(Math.cos(a)*rr2, Math.sin(a)*rr2);
    }
    ctx.closePath(); ctx.fill();
  } else if (kind === 'scrap'){
    ctx.beginPath(); ctx.arc(0, 0, r*0.62, 0, TAU); ctx.lineWidth = r*0.3; ctx.stroke();
    for (let i = 0; i < 6; i++){
      const a = i / 6 * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*0.72, Math.sin(a)*r*0.72);
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); ctx.lineWidth = r*0.26; ctx.stroke();
    }
    ctx.fillStyle = glow || '#FFF';
    ctx.fillRect(-r*0.42, -r*0.13, r*0.84, r*0.26);
    ctx.fillRect(-r*0.13, -r*0.42, r*0.26, r*0.84);
  } else if (kind === 'boiler'){
    ctx.beginPath(); ctx.arc(0, 0, r*0.8, 0, TAU); ctx.lineWidth = r*0.24; ctx.stroke();
    ctx.fillStyle = glow || '#FFF';
    ctx.beginPath(); ctx.arc(0, r*0.1, r*0.34, 0, TAU); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = r*0.18;
    for (const s of [-1, 1]){
      ctx.beginPath(); ctx.moveTo(s*r*0.8, -r*0.5); ctx.lineTo(s*r*1.15, -r*0.5); ctx.stroke();
    }
  } else if (kind === 'burst'){
    for (let i = 0; i < 8; i++){
      const a = i / 8 * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*0.34, Math.sin(a)*r*0.34);
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
      ctx.lineWidth = r*0.2; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, r*0.26, 0, TAU); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, r*0.62, 0, TAU); ctx.lineWidth = r*0.28; ctx.stroke();
    ctx.shadowBlur = 0;
    gearFrame(0, 0, r*0.8, col, 8);
  }
  ctx.restore();
}

const SLOT_KEYS = ['LMB', 'RMB', 'SPACE', 'SHIFT'];
const SLOT_UNLOCK_WAVE = [1, 1, 3, 6];

function drawSkillBar(){
  const HS = hudScale();
  const size = 78 * HS, gap = 13 * HS;
  const total = size * 4 + gap * 3;
  const x0 = (View.w - total) / 2;
  const y0 = View.h - size - 46 * HS;

  brassPanel(x0 - 14*HS, y0 - 13*HS, total + 28*HS, size + 44*HS, 12*HS, 0.9);

  for (let i = 0; i < 4; i++){
    const x = x0 + i * (size + gap), y = y0;
    const sk = S.slots[i];
    const locked = i >= S.unlockedSlots;
    ctx.save();
    ctx.translate(x + size/2, y + size/2);

    // frame + element wash, baked once per (element, size, locked)
    const isz = Math.round(size);
    const ekey = sk ? sk.element : (locked ? 'LOCK' : 'NONE');
    const half = Math.ceil(isz * 0.72);
    const bg = cachedSprite('slot|'+ekey+'|'+isz+'|'+(locked?1:0), half, () => {
      rr(-isz/2, -isz/2, isz, isz, 10*HS);
      ctx.fillStyle = locked ? 'rgba(26,21,17,0.92)' : 'rgba(46,37,28,0.95)';
      ctx.fill();
      if (sk){
        ctx.save();
        rr(-isz/2 + 4, -isz/2 + 4, isz - 8, isz - 8, 8*HS); ctx.clip();
        const E2 = ELEMENTS[sk.element];
        const g2 = ctx.createRadialGradient(0, 0, 2, 0, 0, isz * 0.7);
        g2.addColorStop(0, E2.dark); g2.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = g2; ctx.fillRect(-isz/2, -isz/2, isz, isz);
        ctx.restore();
      }
      rr(-isz/2, -isz/2, isz, isz, 10*HS);
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4.5; ctx.stroke();
      gearFrame(0, 0, isz * 0.5 + 2, locked ? '#544A3B' : PAL.brass, 12);
    });
    ctx.drawImage(bg, -half, -half);

    if (locked){
      ctx.strokeStyle = '#6E6144'; ctx.lineWidth = 4;
      rr(-size*0.18, -size*0.06, size*0.36, size*0.26, 4); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -size*0.06, size*0.13, Math.PI, 0); ctx.stroke();
      setFont(Math.round(12*HS), 700, true);
      textOut('WAVE ' + SLOT_UNLOCK_WAVE[i], 0, size*0.34, '#8A7B5C');
    } else if (!sk){
      setFont(Math.round(13*HS), 700, true);
      textOut('EMPTY', 0, 0, '#7A6C50');
    } else {
      const E = ELEMENTS[sk.element];
      const st = skillStats(sk);
      drawShapeGlyph(sk.shape, 0, -3*HS, size * 0.30, E.color, E.glow);

      // cooldown sweep
      if (sk.cdLeft > 0){
        const frac = clamp(sk.cdLeft / Math.max(0.001, st.cd), 0, 1);
        ctx.save();
        rr(-size/2 + 3, -size/2 + 3, size - 6, size - 6, 9*HS); ctx.clip();
        ctx.globalAlpha = 0.72; ctx.fillStyle = '#100C09';
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, size, -Math.PI/2, -Math.PI/2 + TAU * frac);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        setFont(Math.round(19*HS), 800, true);
        textOut(sk.cdLeft.toFixed(1), 0, -2*HS, '#E6DCC0', 'rgba(0,0,0,0.85)', 4);
      }
      // ray duration
      if (S.player.ray && S.player.ray.slot === i){
        const kk = 1 - S.player.ray.t / st.maxDur;
        ctx.fillStyle = E.glow;
        ctx.fillRect(-size/2 + 6, size/2 - 12*HS, (size - 12) * clamp(kk,0,1), 4*HS);
      }
      // ready pulse
      if (sk.readyPulse > 0){
        const k = sk.readyPulse / 0.35;
        ctx.save();
        ctx.globalAlpha = k * 0.9;
        ctx.strokeStyle = '#FFF6D8'; ctx.lineWidth = 3 + 6 * k;
        rr(-size/2 - 3*k*4, -size/2 - 3*k*4, size + 6*k*4, size + 6*k*4, 10*HS); ctx.stroke();
        ctx.restore();
      }
      // held indicator
      if (slotHeld(i) && sk.cdLeft <= 0){
        ctx.strokeStyle = E.glow; ctx.lineWidth = 3;
        rr(-size/2 + 2, -size/2 + 2, size - 4, size - 4, 9*HS); ctx.stroke();
      }
      // name
      setFont(Math.round(11.5*HS), 700, true);
      textOut(skillName(sk).toUpperCase(), 0, size/2 + 12*HS, E.color, 'rgba(20,14,10,0.9)', 3.5);
    }

    // key cap
    setFont(Math.round(11*HS), 800, true);
    const kw = ctx.measureText(SLOT_KEYS[i]).width + 12*HS;
    rr(-kw/2, -size/2 - 9*HS, kw, 16*HS, 4*HS);
    ctx.fillStyle = '#1C1610'; ctx.fill();
    ctx.strokeStyle = locked ? '#5A5040' : PAL.brass; ctx.lineWidth = 1.8; ctx.stroke();
    textOut(SLOT_KEYS[i], 0, -size/2 - 1*HS, locked ? '#6E6144' : PAL.bone);

    ctx.restore();
  }
}

function drawHealthPanel(){
  const HS = hudScale();
  const w = 250 * HS, h = 78 * HS;
  const x = 20 * HS, y = View.h - h - 20 * HS;
  brassPanel(x, y, w, h, 10*HS, 0.9);

  const P = S.player;
  const frac = clamp(P.hp / P.maxHp, 0, 1);
  const bx = x + 16*HS, by = y + 20*HS, bw = w - 32*HS, bh = 22*HS;
  ctx.save();
  rr(bx, by, bw, bh, 4*HS);
  ctx.fillStyle = '#160F0B'; ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3; ctx.stroke();
  const g = ctx.createLinearGradient(bx, by, bx, by + bh);
  g.addColorStop(0, frac > 0.3 ? '#D8402E' : '#FF6B4A');
  g.addColorStop(1, frac > 0.3 ? '#8B1A1A' : '#B02F1E');
  rr(bx + 1, by + 1, Math.max(0, (bw - 2) * frac), bh - 2, 3*HS);
  ctx.fillStyle = g; ctx.fill();
  // segment ticks every 20hp
  ctx.strokeStyle = 'rgba(20,14,10,0.55)'; ctx.lineWidth = 2;
  const segs = Math.max(1, Math.round(P.maxHp / 20));
  for (let i = 1; i < segs; i++){
    const sx = bx + bw * (i / segs);
    ctx.beginPath(); ctx.moveTo(sx, by + 2); ctx.lineTo(sx, by + bh - 2); ctx.stroke();
  }
  ctx.restore();

  setFont(Math.round(12*HS), 700, true);
  textOut('CAPTAIN', x + 16*HS, y + 12*HS, '#B9AE86', null, 0, 'left');
  setFont(Math.round(15*HS), 800, true);
  textOut(Math.ceil(P.hp) + ' / ' + Math.round(P.maxHp), x + w - 16*HS, y + 12*HS, PAL.bone, 'rgba(0,0,0,0.7)', 3, 'right');

  // dash charges
  const maxD = S.mods.dashCharges;
  const py = y + h - 16*HS;
  setFont(Math.round(11*HS), 700, true);
  textOut('DASH [E]', x + 16*HS, py, '#8A7B5C', null, 0, 'left');
  for (let i = 0; i < maxD; i++){
    const px = x + 84*HS + i * 22*HS;
    const filled = i < P.dashStock;
    ctx.save();
    ctx.beginPath(); ctx.arc(px, py, 7*HS, 0, TAU);
    ctx.fillStyle = filled ? PAL.brass : '#2A2119'; ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 2.4; ctx.stroke();
    if (!filled && i === P.dashStock && P.dashCd > 0){
      const k = 1 - clamp(P.dashCd / dashCdMax(), 0, 1);
      ctx.beginPath(); ctx.moveTo(px, py);
      ctx.arc(px, py, 7*HS, -Math.PI/2, -Math.PI/2 + TAU * k); ctx.closePath();
      ctx.fillStyle = '#8A6E2E'; ctx.fill();
    }
    ctx.restore();
  }
}

    setFont(Math.round(70*HS), 900, true);

/* ---------------------------------------------------------------------------
   RENDER — draft, title, pause, end screens
--------------------------------------------------------------------------- */
function wrapText(text, maxW){
  const words = String(text).split(' ');
  const lines = []; let cur = '';
  for (const w of words){
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function dimScreen(a){
  ctx.fillStyle = 'rgba(14,10,16,' + a + ')';
  ctx.fillRect(0, 0, View.w, View.h);
}
function cardRects(){
  const HS = hudScale();
  const cw = 286 * HS, ch = 384 * HS, gap = 26 * HS;
  const total = cw * 3 + gap * 2;
  const scale = Math.min(1, (View.w - 60) / total);
  const cw2 = cw * scale, ch2 = ch * scale, gap2 = gap * scale;
  const t2 = cw2 * 3 + gap2 * 2;
  const x0 = (View.w - t2) / 2, y0 = (View.h - ch2) / 2 + 22 * HS;
  const out = [];
  for (let i = 0; i < 3; i++) out.push({ x: x0 + i * (cw2 + gap2), y: y0, w: cw2, h: ch2, s: scale });
  return out;
}
function updateDraftHover(){
  if (!S.draft) return;
  const rects = cardRects();
  S.draft.hover = -1;
  for (let i = 0; i < S.draft.cards.length; i++){
    const r = rects[i];
    if (Input.mouse.sx >= r.x && Input.mouse.sx <= r.x + r.w &&
        Input.mouse.sy >= r.y && Input.mouse.sy <= r.y + r.h){
      if (S.draft.lastHover !== i){ S.draft.lastHover = i; SFX.uiHover(); }
      S.draft.hover = i;
    }
  }
  if (S.draft.hover < 0) S.draft.lastHover = -1;
}

function drawDraft(){
  if (!S.draft) return;
  const HS = hudScale();
  dimScreen(0.68);

  const intro = clamp(S.draft.t / 0.35, 0, 1);
  ctx.save();
  ctx.globalAlpha = intro;
  setFont(Math.round(46*HS), 900, true);
  textOut('DRAFT AN UPGRADE', View.w/2, cardRects()[0].y - 74*HS, PAL.bone, 'rgba(20,14,10,0.95)', 8);
  setFont(Math.round(15*HS), 700, true);
  textOut('PICK ONE  —  CLICK OR PRESS 1 / 2 / 3', View.w/2, cardRects()[0].y - 42*HS, PAL.brass, 'rgba(20,14,10,0.9)', 4);
  ctx.restore();

  const rects = cardRects();
  for (let i = 0; i < S.draft.cards.length; i++){
    const c = S.draft.cards[i], r = rects[i];
    const R = RARITY[c.rarity] || RARITY.common;
    const hov = S.draft.hover === i;
    const chosen = S.draft.chosen === i;
    const rejected = S.draft.chosen >= 0 && !chosen;
    const s = r.s;

    ctx.save();
    const t = clamp((S.draft.t - i * 0.07) / 0.32, 0, 1);
    ctx.globalAlpha = (rejected ? clamp(S.draft.chooseT / 0.45, 0, 1) * 0.35 : 1) * easeOut(t);
    ctx.translate(r.x + r.w/2, r.y + r.h/2 + (1 - easeOut(t)) * 50);
    const sc = (hov && !rejected ? 1.045 : 1) * (chosen ? 1 + (1 - S.draft.chooseT/0.45) * 0.10 : 1);
    ctx.scale(sc, sc);
    ctx.translate(-r.w/2, -r.h/2);

    // glow
    if (hov || chosen){
      ctx.save();
      ctx.shadowColor = R.glow; ctx.shadowBlur = 34;
      rr(0, 0, r.w, r.h, 14*s); ctx.fillStyle = R.fill; ctx.fill();
      ctx.restore();
    }
    // body
    rr(0, 0, r.w, r.h, 14*s);
    const g = ctx.createLinearGradient(0, 0, 0, r.h);
    g.addColorStop(0, R.fill); g.addColorStop(1, '#1B1610');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 6*s; ctx.stroke();
    rr(5*s, 5*s, r.w - 10*s, r.h - 10*s, 10*s);
    ctx.strokeStyle = R.edge; ctx.lineWidth = 3*s; ctx.stroke();
    // corner rivets
    ctx.fillStyle = R.edge;
    for (const p of [[17*s,17*s],[r.w-17*s,17*s],[17*s,r.h-17*s],[r.w-17*s,r.h-17*s]]){
      ctx.beginPath(); ctx.arc(p[0], p[1], 3.2*s, 0, TAU); ctx.fill();
    }

    // rarity ribbon
    rr(r.w/2 - 58*s, -10*s, 116*s, 24*s, 6*s);
    ctx.fillStyle = R.edge; ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3*s; ctx.stroke();
    setFont(Math.round(12*s), 800, true);
    textOut(R.name, r.w/2, 2*s, '#241A14');

    // icon
    const iconY = 84*s;
    ctx.save();
    ctx.translate(r.w/2, iconY);
    ctx.strokeStyle = 'rgba(217,164,65,0.5)'; ctx.lineWidth = 2.4*s;
    ctx.beginPath(); ctx.arc(0, 0, 42*s, 0, TAU); ctx.stroke();
    gearFrame(0, 0, 42*s, 'rgba(217,164,65,0.5)', 12);
    ctx.restore();
    if (c.slot !== undefined && S.slots[c.slot]){
      const sk = S.slots[c.slot], E = ELEMENTS[sk.element];
      drawShapeGlyph(sk.shape, r.w/2, iconY, 26*s, E.color, E.glow);
      setFont(Math.round(11*s), 700, true);
      textOut('SLOT ' + (c.slot + 1), r.w/2, iconY + 56*s, E.color, 'rgba(0,0,0,0.7)', 3);
    } else {
      const ic = CARD_ICON[c.id] || 'gear';
      const tint = { flame:'#E2691E', frost:'#7FC7D9', bolt:'#F2D14B', steam:'#B9A8C9',
                     heart:'#D8402E', boot:'#B9AE86', dash:'#FFD36B', crit:'#FFD36B',
                     scrap:'#8CE07A', boiler:'#D9A441', burst:'#E2691E' }[ic] || R.edge;
      drawCardIcon(ic, r.w/2, iconY, 25*s, tint, '#FFF6D8');
    }

    // title
    setFont(Math.round(25*s), 900, true);
    const tl = wrapText(c.title, r.w - 40*s);
    tl.forEach((ln, j) => textOut(ln, r.w/2, 174*s + j * 27*s, PAL.bone, 'rgba(20,14,10,0.9)', 5*s));

    // divider
    ctx.strokeStyle = 'rgba(217,164,65,0.45)'; ctx.lineWidth = 2*s;
    ctx.beginPath();
    ctx.moveTo(34*s, 174*s + tl.length * 27*s + 6*s);
    ctx.lineTo(r.w - 34*s, 174*s + tl.length * 27*s + 6*s);
    ctx.stroke();

    // body text
    setFont(Math.round(15.5*s), 600, false);
    const bl = wrapText(c.text, r.w - 46*s);
    bl.forEach((ln, j) => textOut(ln, r.w/2, 174*s + tl.length*27*s + 32*s + j * 22*s, '#DCD2B4'));

    // key hint
    rr(r.w/2 - 20*s, r.h - 44*s, 40*s, 30*s, 6*s);
    ctx.fillStyle = '#120E0A'; ctx.fill();
    ctx.strokeStyle = R.edge; ctx.lineWidth = 2.4*s; ctx.stroke();
    setFont(Math.round(17*s), 800, true);
    textOut((i + 1) + '', r.w/2, r.h - 29*s, R.edge);

    ctx.restore();
  }
}

function drawTitle(){
  const HS = hudScale();
  dimScreen(0.42);
  const t = S.titleT;

  // wordmark
  ctx.save();
  ctx.translate(View.w/2, View.h * 0.245);
  const bob = Math.sin(t * 1.3) * 4;
  ctx.translate(0, bob);

  // gear cluster behind the mark
  ctx.save();
  ctx.globalAlpha = 0.5;
  for (let i = 0; i < 3; i++){
    const rr2 = [96, 62, 44][i] * HS;
    const ox = [-250, 258, 300][i] * HS, oy = [12, -22, 34][i] * HS;
    ctx.save();
    ctx.translate(ox, oy); ctx.rotate(t * (i % 2 ? -0.35 : 0.28));
    ctx.strokeStyle = PAL.brass; ctx.lineWidth = 7*HS;
    ctx.beginPath(); ctx.arc(0, 0, rr2, 0, TAU); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, rr2 * 0.42, 0, TAU); ctx.stroke();
    gearFrame(0, 0, rr2, PAL.brass, 12);
    ctx.restore();
  }
  ctx.restore();

  setFont(Math.round(118*HS), 900, true);
  ctx.letterSpacing = '10px';
  textOut('SKYGEAR', 0, 0, '#F0C878', 'rgba(20,14,10,0.95)', 16);
  ctx.letterSpacing = '0px';
  setFont(Math.round(19*HS), 700, true);
  textOut('A  H E R O   D E F E N S E  ·  1 0 , 0 0 0   F E E T', 0, 74*HS, PAL.bone, 'rgba(20,14,10,0.9)', 5);
  ctx.restore();

  // how to play
  const pw = Math.min(View.w - 60, 860 * HS), ph = 224 * HS;
  const px = (View.w - pw) / 2, py = View.h * 0.44;
  brassPanel(px, py, pw, ph, 12*HS, 0.94);
  setFont(Math.round(17*HS), 800, true);
  textOut('HOW TO PLAY', px + pw/2, py + 24*HS, PAL.brass, 'rgba(0,0,0,0.6)', 3);

  const col1 = px + 34*HS, col2 = px + pw * 0.54;
  const rows1 = [
    ['W A S D', 'move the captain'],
    ['MOUSE', 'aim — you always face the cursor'],
    ['LEFT / RIGHT MOUSE', 'fire skill 1 and 2'],
    ['SPACE / SHIFT', 'skill 3 and 4 (unlocked later)'],
  ];
  const rows2 = [
    ['E', 'dash — invulnerable, use it constantly'],
    ['ESC', 'pause    ·    M mute    ·    − / = volume'],
    ['DEFEND', 'the Boiler amidships. If it dies, you lose.'],
    ['DRAFT', 'a card after every wave. 12 waves to win.'],
  ];
  const draw = (rows, x) => rows.forEach((r, i) => {
    const y = py + 62*HS + i * 38*HS;
    setFont(Math.round(14*HS), 800, true);
    textOut(r[0], x, y, '#FFD36B', null, 0, 'left');
    setFont(Math.round(13.5*HS), 600, false);
    textOut(r[1], x, y + 17*HS, '#C9BC96', null, 0, 'left');
  });
  draw(rows1, col1); draw(rows2, col2);

  // start prompt
  const pulse = 0.7 + Math.sin(t * 3.4) * 0.3;
  ctx.save();
  ctx.globalAlpha = pulse;
  setFont(Math.round(34*HS), 900, true);
  textOut('CLICK  TO  BOARD', View.w/2, View.h * 0.86, '#FFD36B', 'rgba(20,14,10,0.95)', 8);
  ctx.restore();
  setFont(Math.round(12.5*HS), 600, false);
  textOut('every skill is a SHAPE × an ELEMENT — 24 combinations, and the draft rewrites them',
          View.w/2, View.h * 0.93, '#9C907A');
}

function drawPause(){
  const HS = hudScale();
  dimScreen(0.66);
  setFont(Math.round(70*HS), 900, true);
  textOut('PAUSED', View.w/2, View.h * 0.34, PAL.bone, 'rgba(20,14,10,0.95)', 10);
  setFont(Math.round(17*HS), 700, true);
  textOut('ESC  RESUME        Q  QUIT TO TITLE', View.w/2, View.h * 0.34 + 56*HS, PAL.brass, 'rgba(20,14,10,0.9)', 5);

  // current loadout
  const rows = [];
  for (let i = 0; i < 4; i++){
    const sk = S.slots[i];
    if (!sk) continue;
    const st = skillStats(sk);
    rows.push([ (i+1) + '.  ' + skillName(sk).toUpperCase(),
                SHAPES[sk.shape].desc + '  ·  ' + ELEMENTS[sk.element].blurb +
                '  ·  ' + st.cd.toFixed(2) + 's cd', ELEMENTS[sk.element].color ]);
  }
  const pw = Math.min(View.w - 60, 760*HS), ph = 44*HS + rows.length * 46*HS;
  const px = (View.w - pw)/2, py = View.h * 0.50;
  brassPanel(px, py, pw, ph, 12*HS, 0.94);
  setFont(Math.round(14*HS), 800, true);
  textOut('LOADOUT', px + pw/2, py + 20*HS, PAL.brass);
  rows.forEach((r, i) => {
    const y = py + 52*HS + i * 46*HS;
    setFont(Math.round(16*HS), 800, true);
    textOut(r[0], px + 28*HS, y, r[2], 'rgba(0,0,0,0.6)', 3, 'left');
    setFont(Math.round(13*HS), 600, false);
    textOut(r[1], px + 28*HS, y + 19*HS, '#B3A88C', null, 0, 'left');
  });
}

function drawEndScreen(){
  const HS = hudScale();
  const win = S.mode === 'victory';
  const k = clamp(S.endT / 0.8, 0, 1);
  dimScreen(0.5 + 0.24 * k);

  ctx.save();
  ctx.globalAlpha = k;
  ctx.translate(View.w/2, View.h * 0.22);
  ctx.scale(lerp(1.7, 1, easeOut(k)), lerp(1.7, 1, easeOut(k)));
  setFont(Math.round(84*HS), 900, true);
  textOut(S.endTitle || (win ? 'DECK HELD' : 'BOARDED'), 0, 0,
          win ? '#FFD36B' : '#D8402E', 'rgba(20,14,10,0.95)', 12);
  ctx.restore();

  setFont(Math.round(19*HS), 700, true);
  textOut(S.endReason || '', View.w/2, View.h * 0.22 + 62*HS, PAL.bone, 'rgba(20,14,10,0.9)', 5);

  const stats = [
    ['WAVES SURVIVED', (win ? TUNING.totalWaves : Math.max(0, S.wave - 1)) + ' / ' + TUNING.totalWaves],
    ['BOARDERS DESTROYED', S.stats.kills + ''],
    ['DAMAGE DEALT', Math.round(S.stats.damage).toLocaleString()],
    ['BEST CHAIN', S.stats.bestCombo + ''],
    ['DASHES', S.stats.dashes + ''],
    ['UPGRADES DRAFTED', S.stats.cards.length + ''],
  ];
  const pw = Math.min(View.w - 60, 640*HS), ph = 60*HS + stats.length * 34*HS;
  const px = (View.w - pw)/2, py = View.h * 0.38;
  ctx.save();
  ctx.globalAlpha = clamp((S.endT - 0.3) / 0.5, 0, 1);
  brassPanel(px, py, pw, ph, 12*HS, 0.95);
  setFont(Math.round(15*HS), 800, true);
  textOut('AFTER ACTION', px + pw/2, py + 26*HS, PAL.brass);
  stats.forEach((s, i) => {
    const y = py + 60*HS + i * 34*HS;
    setFont(Math.round(14.5*HS), 700, true);
    textOut(s[0], px + 34*HS, y, '#B3A88C', null, 0, 'left');
    setFont(Math.round(19*HS), 900, true);
    textOut(s[1], px + pw - 34*HS, y, PAL.bone, 'rgba(0,0,0,0.6)', 3, 'right');
  });

  // final loadout strip
  const ly = py + ph + 26*HS;
  let n = 0;
  for (let i = 0; i < 4; i++) if (S.slots[i]) n++;
  const gw = 58*HS, gx = View.w/2 - (n * gw)/2;
  let gi = 0;
  for (let i = 0; i < 4; i++){
    const sk = S.slots[i];
    if (!sk) continue;
    const E = ELEMENTS[sk.element];
    const cx = gx + gi * gw + gw/2;
    ctx.save();
    rr(cx - 24*HS, ly - 24*HS, 48*HS, 48*HS, 8*HS);
    ctx.fillStyle = 'rgba(40,32,24,0.9)'; ctx.fill();
    ctx.strokeStyle = E.color; ctx.lineWidth = 2.4; ctx.stroke();
    ctx.restore();
    drawShapeGlyph(sk.shape, cx, ly, 16*HS, E.color, E.glow);
    gi++;
  }
  ctx.restore();

  if (S.endT > 0.8){
    const pulse = 0.65 + Math.sin(S.rt * 3.6) * 0.35;
    ctx.save(); ctx.globalAlpha = pulse;
    setFont(Math.round(26*HS), 900, true);
    textOut('CLICK  OR  PRESS  R  TO  SAIL  AGAIN', View.w/2, View.h * 0.92, '#FFD36B', 'rgba(20,14,10,0.95)', 7);
    ctx.restore();
  }
}

/* ---------------------------------------------------------------------------
   BOOT
--------------------------------------------------------------------------- */
resize();
resetGame();
buildBackdrops();
buildStage();
S.mode = 'title';
S.phase = 'idle';
requestAnimationFrame(frame);

// A small hatch into the machine — handy for tinkering with the tables above.
window.SKYGEAR = { S, TUNING, SHAPES, ELEMENTS, ENEMIES, WAVES, CARDS,
                   startRun, startWave, spawnEnemy, openDraft, newSkill,
                   castSlot, skillStats, step, rollCards, updateRay, endRay, render,
                   drawWorld, drawShip, drawHUD, drawFx, drawParticles, drawNums, Particles,
                   drawTopBar, drawHealthPanel, drawSkillBar, drawSky, drawClouds, drawGasBags,
                   drawScreenFx, drawEnemy, drawBoiler, drawPlayer, drawTelegraphs, drawCursor,
                   drawStage, buildStage, drawFields, drawBolts, drawProp, SOLID_PROPS,
                   jump(w){ startRun(); S.wave = w - 1; S.interT = 0.05; } };

</script>
