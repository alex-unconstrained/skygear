    if (f.life <= 0) S.fields.splice(i, 1);
  }
}

function updateFx(dt){
  for (let i = S.fx.length - 1; i >= 0; i--){
    const f = S.fx[i];
    if (f.delay > 0){ f.delay -= dt; continue; }
    if (f.kind === 'delayPop' && !f.popped){
      f.popped = true;
      pGibs(f.x, f.y, 12, PAL.brass, '#FFD36B');
      pSmoke(f.x, f.y, 6, 'rgba(150,140,125,0.5)', 90);
      addTrauma(0.2); SFX.death();
    }
    f.t += dt;
    if (f.t >= f.life) S.fx.splice(i, 1);
  }
  for (let i = S.nums.length - 1; i >= 0; i--){
    const n = S.nums[i];
    n.t += dt;
    n.x += n.vx * dt; n.y += n.vy * dt;
    n.vy += 190 * dt; n.vx *= Math.pow(0.15, dt);
    if (n.t >= n.life) S.nums.splice(i, 1);
  }
}

/* ---------------------------------------------------------------------------
   SYSTEMS — waves
--------------------------------------------------------------------------- */
// batch = [t, type, count] or [t, type, count, lane] where lane is 0..2,
// 'all' (that count into EVERY lane) or 'rail' (climbs a side rail amidships)
function buildQueue(w){
  const def = WAVES[w-1], q = [];
  for (const b of def.batches){
    const lanes = !PRESET.lanes ? [undefined]
      : b[3] === 'all' ? [0, 1, 2]
      : b[3] === undefined ? [undefined] : [b[3]];
    for (const ln of lanes)
      for (let i = 0; i < b[2]; i++)
        q.push({ t: b[0] + i * 0.22, type: b[1], lane: ln });
  }
  q.sort((a,b) => a.t - b.t);
  return q;
}
function countLive(){ let n = 0; for (const e of S.enemies) if (!e.dead) n++; return n; }
function pendingCount(){ return S.queue.length + countLive(); }

function startWave(n){
  S.wave = n;
  if (PRESET.lanes && S.hulk){
    const isPush = !!(WAVES[n-1] && WAVES[n-1].push);
    if (isPush){
      // A fresh vessel grapples on for every push. Without this the hulk was
      // spawned once at run start and never reset, so breaking it on wave 4
      // left it permanently dead — wave 8 then satisfied its "ends when their
      // hulk does" condition on the first frame and completed in 3 seconds,
      // and wave 12 lost its push half entirely. Each one is a little tougher
      // than the last, but only a little: the first one already reads as long.
      const idx = WAVES.slice(0, n).filter(w => w.push).length - 1;
      spawnHulk(1 + idx * 0.20);
      S.hulk.vulnerable = true;
      S.banner = { kind:'push', n, t:0, life: 3.0 };
      Hints.fire('push');
      SFX.hulkGrapple();
      S.crewT = 0.5;            // send a wave with the horn, not 14s after it
    } else {
      S.hulk.vulnerable = false;
    }
  }
  SFX.waveStart();
  S.queue = buildQueue(n);
  S.waveT = 0; S.loopT = 0; S.loopIdx = 0;
  S.phase = 'fight';
  S.bossSpawned = false;
  S.banner = { kind:'wave', n, t:0, life: 2.4 };
  if (WAVES[n-1].boss) S.banner = { kind:'boss', n, t:0, life: 3.0 };
}

function waveComplete(){
  S.phase = 'clear';
  S.interT = 1.7;
  S.slowmo = TUNING.feel.waveClearSlowmoTime;
  S.stats.waves = S.wave;
  S.banner = { kind:'clear', n:S.wave, t:0, life: 2.2 };
  SFX.waveClear();
  pGold(S.player.x, S.player.y, 30);
  pGold(S.boiler.x, S.boiler.y, 24);
  S.player.hp = Math.min(S.player.maxHp, S.player.hp + TUNING.player.regenPerWave);
  S.bolts.length = 0;
  // slots open up as the run escalates
  if (S.wave >= 2 && S.unlockedSlots < 3){ S.unlockedSlots = 3; Hints.fire('slot'); }
  if (S.wave >= 5 && S.unlockedSlots < 4){ S.unlockedSlots = 4; Hints.fire('slot'); }
}

function updateWave(dt){
  if (S.winSeq > 0){
    S.winSeq -= dt;
    S.slowmo = Math.max(S.slowmo, 0.2);
    S.killT -= dt;
    if (S.killT <= 0){
      S.killT = 0.09;
      const alive = S.enemies.filter(e => !e.dead);
      if (alive.length) killEnemy(pick(alive), rnd(TAU));
    }
    if (S.winSeq <= 0) endGame(true, 'Twelve waves repelled. The deck is yours.', 'DECK HELD');
    return;
  }

  if (S.phase === 'fight'){
    S.waveT += dt;
    const def = WAVES[S.wave-1];
    let live = countLive();
    while (S.queue.length && S.queue[0].t <= S.waveT && live < TUNING.maxLiveEnemies){
      const nx = S.queue.shift();
      spawnEnemy(nx.type, null, nx.lane);
      live++;
      if (S.enemies[S.enemies.length-1].type === 'BOSS') S.bossSpawned = true;
    }
    // A push wave ends when their hulk dies, not when the deck clears, so it
    // MUST keep feeding — this was gated on the boss and stalled wave 4 dead.
    const loopLive = def.loop && (
      def.boss ? (S.bossSpawned && S.bossRef)
      : def.push ? (S.hulk && !S.hulk.dead)
      : true);
    if (loopLive){
      S.loopT += dt;
      if (S.loopT >= def.loop.every){
        S.loopT = 0;
        const set = def.loop.sets[S.loopIdx % def.loop.sets.length];
        S.loopIdx++;
        for (let i = 0; i < set[1]; i++)
          S.queue.push({ t: S.waveT + i*0.25, type: set[0],
                         lane: PRESET.lanes ? rndi(0, LANE_N) : undefined });
        S.queue.sort((a,b) => a.t - b.t);
      }
    }
    if (def.boss){
      if (S.bossSpawned && !S.bossRef){ S.winSeq = 2.3; S.killT = 0; S.stats.waves = 12; }
    } else if (def.push && PRESET.lanes){
      // a push wave ends when their hulk does, not when the deck is clear
      if (S.hulk && S.hulk.dead){ S.hulk.vulnerable = false; waveComplete(); }
    } else if (S.queue.length === 0 && live === 0){
      waveComplete();
    }
  } else if (S.phase === 'clear'){
    S.interT -= dt;
    if (S.interT <= 0) openDraft();
  } else if (S.phase === 'ready'){
    S.interT -= dt;
    if (S.interT <= 0) startWave(S.wave + 1);
  }
}

/* ---------------------------------------------------------------------------
   SYSTEMS — the draft
--------------------------------------------------------------------------- */
function rollCards(n){
  const avail = CARDS.filter(c => { try { return c.can(S); } catch(e){ return false; } });
  const out = [], used = {};
  for (let k = 0; k < n; k++){
    let pool = avail.filter(c => !used[c.id]);
    if (!pool.length) pool = avail;
    if (!pool.length) break;
    let total = 0;
    const ws = pool.map(c => { const w = Math.max(0.01, c.weight(S)); total += w; return w; });
    let r = Math.random() * total, idx = pool.length - 1;
    for (let i = 0; i < pool.length; i++){ r -= ws[i]; if (r <= 0){ idx = i; break; } }
    const c = pool[idx];
    used[c.id] = true;
    const inst = c.make(S);
    inst.rarity = c.rarity; inst.id = c.id;
    out.push(inst);
  }
  return out;
}
/* Three skills for one empty slot. The player picks WHICH, never WHETHER.
   Before this, a new skill was a card competing against upgrades — and losing,
   correctly: every upgrade card targets a random FILLED slot, so with one skill
   100% of upgrades landed on it and taking a second halved that while handing
   you something unupgraded. Passing was the dominant line, and a whole run
   could be played with a single ability out of a 24-combination matrix. */
function rollSkillCards(slot, n, opening){
  const have = filledSlots(S).map(i => S.slots[i].shape);
  // never offer the shape she already swings automatically — a Cleave in a slot
  // beside the auto-attacking Cleave reads as a duplicate, not a choice
  if (S.basic) have.push(S.basic.shape);
  const shapes = SHAPE_KEYS.filter(k => have.indexOf(k) < 0);
  const pool = (shapes.length >= n ? shapes : SHAPE_KEYS).slice();
  // one option deliberately matches the element you have most of, so committing
  // to a colour across several shapes is an available build rather than a
  // consolation prize
  const counts = {};
  for (const i of filledSlots(S)) counts[S.slots[i].element] = (counts[S.slots[i].element] || 0) + 1;
  const fav = ELEMENT_KEYS.slice().sort((a, b) => (counts[b] || 0) - (counts[a] || 0))[0];
  // The opening draft is the whole pitch in ten seconds, so its three cards are
  // three different shapes AND three different elements. Two Frost options
  // would read as "pick a weapon"; one Frost, one Ember and one Arc reads as
  // "these are two axes", which is the thing the game is about and the thing
  // it has never said out loud.
  const elemPool = opening ? shuffle(ELEMENT_KEYS.slice()) : null;
  // Passives explain themselves badly with nothing to compare them to, so the
  // opening draft offers actives only.
  const openPool = opening ? pool.filter(k => !SHAPES[k].passive) : pool;
  const use = openPool.length >= n ? openPool : pool;
  const out = [];
  for (let k = 0; k < n && use.length; k++){
    const shape = use.splice(rndi(0, use.length), 1)[0];
    const element = opening ? elemPool[k % elemPool.length]
                            : ((k === 0 && counts[fav]) ? fav : pick(ELEMENT_KEYS));
    const sk = newSkill(shape, element);
    out.push({ id:'skillpick', rarity: (!opening && k === 0 && counts[fav]) ? 'rare' : 'common',
               title: skillName(sk).toUpperCase(), slot: slot, skill: sk,
               text: SHAPES[shape].desc + ', ' + ELEMENTS[element].blurb + '.',
               apply: (S) => { S.slots[slot] = sk; noteEquipped(sk); } });
  }
  // Shuffle: the themed option is generated first, and leaving it first would
  // mean anyone who habitually takes the left-hand card ends up mono-element by
  // accident rather than by choosing it.
  for (let i = out.length - 1; i > 0; i--){
    const j = rndi(0, i + 1);
    const t = out[i]; out[i] = out[j]; out[j] = t;
  }
  return out;
}

/* ---------------------------------------------------------------------------
   CARD PREVIEW — before → after

   "Burn deals +50% damage" is a sentence about a modifier, not about the game:
   it does not say what the number is now, what it becomes, or whether that is
   worth more than "+2 pierce". So every card is applied to a copy of the state
   and the two are diffed. Nothing is hand-authored per card — a card added
   later gets a preview for free, and a preview can never disagree with what the
   card actually does, because it IS what the card does.

   The copy is narrow on purpose: cards only ever touch the mod block, the
   skills in the slots, and the two health pools. Cloning the whole of S would
   mean cloning the enemy list every time a card is hovered.
--------------------------------------------------------------------------- */
function cloneSkill(sk){
  return sk ? { shape: sk.shape, element: sk.element, cdLeft: sk.cdLeft,
                casts: sk.casts, mods: Object.assign({}, sk.mods) } : null;
}
function saveForPreview(){
  return {
    mods: JSON.parse(JSON.stringify(S.mods)),
    slots: S.slots.map(cloneSkill),
    basic: cloneSkill(S.basic),
    unlocked: S.unlockedSlots,
    pmax: S.player.maxHp, php: S.player.hp,
    bmax: S.boiler.maxHp, bhp: S.boiler.hp,
  };
}
function restoreFromPreview(sav){
  S.mods = sav.mods;
  for (let i = 0; i < 4; i++) S.slots[i] = sav.slots[i];
  S.basic = sav.basic;
  S.unlockedSlots = sav.unlocked;
  S.player.maxHp = sav.pmax; S.player.hp = sav.php;
  S.boiler.maxHp = sav.bmax; S.boiler.hp = sav.bhp;
}

/* One flat vector of everything a player could notice. Per-slot entries are
   keyed by slot so a card that upgrades slot 3 does not read as a change to
   slot 1. */
function previewVector(){
  const v = {};
  const add = (tag, sk) => {
    if (!sk) return;
    const st = skillStats(sk);
    v[tag + ' damage'] = { n: st.dmg * (st.multi > 1 ? st.multi * 0.7 : 1), d: 0 };
    if (!SHAPES[sk.shape].passive) v[tag + ' cooldown'] = { n: st.cd, d: 2, unit: 's', lower: true };
    const reach = st.range || st.len || st.radius || 0;
    if (reach) v[tag + ' reach'] = { n: reach, d: 0 };
    if (st.pierce) v[tag + ' pierce'] = { n: st.pierce, d: 0 };
    if (st.jumps) v[tag + ' jumps'] = { n: st.jumps, d: 0 };
  };
  // Labelled by the key that fires it, not by an index. "slot1 cooldown"
  // makes the player count buttons; "LMB cooldown" is the thing they press.
  for (let i = 0; i < 4; i++) if (S.slots[i]) add(bindLabel(BINDS[i]), S.slots[i]);
  const M = S.mods;
  v['captain HP']   = { n: S.player.maxHp, d: 0 };
  v['Boiler HP']    = { n: S.boiler.maxHp, d: 0 };
  v['crit chance']  = { n: M.critChance * 100, d: 0, unit: '%' };
  v['move speed']   = { n: M.moveMult * 100, d: 0, unit: '%' };
  v['dash charges'] = { n: M.dashCharges, d: 0 };
  v['dash cooldown'] = { n: Math.max(0.30, (FEEL.dashCd || TUNING.player.dashCd) - M.dashCdBonus),
                         d: 2, unit: 's', lower: true };
  v['burn damage']  = { n: M.burnDmg * 100, d: 0, unit: '%' };
  v['burn time']    = { n: 3 + M.burnDur, d: 0, unit: 's' };
  v['frost slow']   = { n: M.slowAmt * 100, d: 0, unit: '%' };
  v['damage to slowed'] = { n: M.slowDmg * 100, d: 0, unit: '%' };
  v['stun chance']  = { n: M.stunChance * 100, d: 0, unit: '%' };
  v['knockback']    = { n: M.knockMult * 100, d: 0, unit: '%' };
  v['Boiler armour'] = { n: M.boilerDR * 100, d: 0, unit: '%' };
  v['dash damage']  = { n: M.dashDamage, d: 0 };
  v['lifesteal']    = { n: M.lifesteal * 100, d: 0, unit: '%' };
  v['scrap chance'] = { n: M.scrapChance * 100, d: 0, unit: '%' };
  v['residue']      = { n: M.residue, d: 0 };
  v['scald']        = { n: M.scald * 8, d: 0 };
  for (const el of ELEMENT_KEYS){
    v[ELEMENTS[el].name + ' damage'] = { n: M.elemDmg[el] * 100, d: 0, unit: '%' };
    v[ELEMENTS[el].name + ' cooldown'] = { n: M.elemCd[el] * 100, d: 0, unit: '%', lower: true };
  }
  return v;
}

const PREVIEW_MAX = 3;
function previewCard(card){
  if (!card || !card.apply) return [];
  const sav = saveForPreview();
  let before, after;
  try {
    before = previewVector();
    card.apply(S);
    after = previewVector();
  } catch (e){
    restoreFromPreview(sav);
    return [];
  }
  restoreFromPreview(sav);
  const out = [];
  for (const k in after){
    const a = after[k], b = before[k];
    // A stat that did not exist before is a new capability, not a change; the
    // card's own text covers those, and listing "slot2 damage — → 40" reads as
    // a bug.
    if (!b || Math.abs(a.n - b.n) < 0.005) continue;
    const fmt = (x) => x.toFixed(a.d) + (a.unit || '');
    out.push({ label: k, from: fmt(b.n), to: fmt(a.n),
               better: a.lower ? a.n < b.n : a.n > b.n });
  }
  // Most-changed first, so a card with six small effects still leads with its
  // biggest one.
  out.sort((p, q) => Math.abs(parseFloat(q.to) - parseFloat(q.from)) /
                     Math.max(1, Math.abs(parseFloat(q.from))) -
                     Math.abs(parseFloat(p.to) - parseFloat(p.from)) /
                     Math.max(1, Math.abs(parseFloat(p.from))));
  return out.slice(0, PREVIEW_MAX);
}

function openDraft(kind){
  S.mode = 'draft';
  const opening = kind === 'opening';
  const empty = emptyUnlocked(S);
  const skillDraft = opening || empty.length > 0;
  const slot = opening ? 0 : (skillDraft ? empty[0] : -1);
  const cards = skillDraft ? rollSkillCards(slot, 3, opening) : rollCards(3);
  // Computed once, when the draft opens, not per frame while hovering: each
  // preview applies the card to a copy of the state and diffing three cards
  // sixty times a second to draw the same three rows would be silly.
  for (const c of cards) c.preview = previewCard(c);
  S.draft = { cards, hover: -1, t: 0, chosen: -1, chooseT: 0,
              kind: opening ? 'opening' : skillDraft ? 'skill' : 'upgrade', slot };
  Hints.fire('draft');
  SFX.cardDeal();
}
function pickCard(i){
  if (!S.draft || S.draft.chosen >= 0) return;
  const c = S.draft.cards[i];
  if (!c) return;
  S.draft.chosen = i; S.draft.chooseT = 0.45;
  c.apply(S);
  S.stats.cards.push(c.title);
  Hints.did('draft');
  SFX.cardPick();
}
function closeDraft(){
  const wasOpening = S.draft && S.draft.kind === 'opening';
  S.draft = null;
  S.mode = 'play';
  S.phase = 'ready';
  // The opening draft happens before the first wave rather than between two,
  // so it gets a longer beat: the player has just been handed a weapon and has
  // not yet seen the deck.
  S.interT = wasOpening ? 2.2 : 0.9;
  if (wasOpening) Hints.fire('boarder');
}

/* ---------------------------------------------------------------------------
   SYSTEMS — run lifecycle
--------------------------------------------------------------------------- */
/* A passive holds a slot and has no button, which is the one thing about them
   that has to be said out loud. Checked on equip rather than on draw, so it
   fires the moment the card is taken and not the next time the HUD redraws. */
function noteEquipped(sk){
  if (sk && SHAPES[sk.shape] && SHAPES[sk.shape].passive) Hints.fire('passive');
}

function startRun(){
  // Seed FIRST. resetGame lays out the lanes, the turrets and the boarding
  // hulk, and all three draw from the gameplay stream — seeding after them
  // would make the seed reproduce the waves but not the map.
  S.seed = nextRunSeed();
  Rng.set(S.seed);
  resetGame();
  Hints.reset();
  // Restart from the pause menu can be pressed with the settings panel open.
  S.overlay = null;
  S.mode = 'play';
  S.phase = 'ready';
  S.interT = 1.0;
  S.winSeq = 0; S.killT = 0;
  S.wave = 0;
  S.endT = 0;
  S.result = null;
  S.copyToast = null;
  Sound.unlock();
  // Every run before v10 opened with the same Frost Mortar, handed over
  // without comment. Choosing between three shapes AND three elements in the
  // first ten seconds is the fastest way to say what this game is, and it
  // reuses the draft the player will meet again after every wave — so the
  // first thing they learn is the thing they will keep doing.
  if (PRESET.openingDraft) openDraft('opening');
}
function endGame(win, reason, title){
  if (S.mode === 'gameover' || S.mode === 'victory') return;
  S.mode = win ? 'victory' : 'gameover';
  S.endReason = reason;
  S.endTitle = title || (win ? 'DECK HELD' : 'BOARDED');
  S.endT = 0;
  S.player.ray = null;
  endRay();
  // The record is built and stored here, not on the results screen, so the
  // screen renders a value rather than computing one every frame — and so a
  // run still counts if the player closes the tab before reading it.
  S.result = RunLog.record(buildRunRecord(win));
  if (win){ SFX.victory(); for (let i=0;i<8;i++) pGold(vrnd(300,1100), vrnd(250,700), 20); }
  else { SFX.defeat(); addTrauma(0.8); S.flashRed = 0.7 * Settings.flashScale(); }
}

/* ---------------------------------------------------------------------------
   SYSTEMS — the fixed 60Hz simulation step
--------------------------------------------------------------------------- */
function step(dt){
  S.t += dt;
  Hash.build(S.enemies);
  updatePlayer(dt);
  for (let i = 0; i < S.enemies.length; i++) updateEnemy(S.enemies[i], dt);
  separate(dt);
  for (let i = S.enemies.length - 1; i >= 0; i--) if (S.enemies[i].dead) S.enemies.splice(i, 1);
  updateSentries(dt);
  updateLanes(dt);
  updateBolts(dt);
  updatePickups(dt);
  updateFields(dt);
  updateFx(dt);
  Particles.step(dt);
  updateWave(dt);

  // ambient life on deck: idle steam from the vents. Visual stream — its call
  // count changes with the VFX setting, and the run must not.
  if (vrnd() < dt * 1.6 * (typeof Settings !== 'undefined' ? Settings.get('vfx') : 1)){
    const v = vpick(PROPS.filter(p => p.t === 'vent' || p.t === 'lantern'));
    if (v) pSmoke(v.x, v.y, 1, 'rgba(220,215,210,0.35)', 22);
  }
  S.boiler.flash = Math.max(0, S.boiler.flash - dt);
  S.boiler.shake = Math.max(0, S.boiler.shake - dt * 1.6);
  S.boiler.gauge += dt;
  if (S.stats.comboT > 0){
    S.stats.comboT -= dt;
    if (S.stats.comboT <= 0) S.stats.combo = 0;
  }
}

/* ---------------------------------------------------------------------------
   SYSTEMS — real-time updates (run even while the sim is frozen)
--------------------------------------------------------------------------- */
function updateUI(rt){
  S.rt += rt;
  CAM.step(rt);
  // rolling frame-time readout, toggled with F3
  S.ftBuf[S.ftIdx++ % S.ftBuf.length] = rt;
  if (S.ftIdx > 1e9) S.ftIdx = 0;
  // Trauma-based screen shake. Visual stream, and halved under reduced motion.
  S.trauma = Math.max(0, S.trauma - TUNING.feel.traumaDecay * rt);
  const amp = S.trauma * S.trauma * TUNING.feel.shakeMax * Settings.shakeScale();
  const a = vrnd(TAU);
  S.shakeX = Math.cos(a) * amp; S.shakeY = Math.sin(a) * amp;
  S.shakeR = (vrnd(-1,1)) * S.trauma * S.trauma * 0.018 * Settings.shakeScale();

  S.flashWhite = Math.max(0, S.flashWhite - rt * 3.2);
  S.flashRed   = Math.max(0, S.flashRed   - rt * 2.4);
  S.intro  = Math.max(0, S.intro - rt * 0.7);
  if (S.mode === 'play'){ Hints.update(rt); updateLaneAlerts(rt); }
  if (S.banner){
    S.banner.t += rt;
    if (S.banner.t >= S.banner.life) S.banner = null;
  }
  if (S.mode === 'draft' && S.draft){
    S.draft.t += rt;
    if (S.draft.chosen >= 0){
      S.draft.chooseT -= rt;
      if (S.draft.chooseT <= 0) closeDraft();
    }
  }
  if (typeof Ambience !== 'undefined'){ Ambience.update(rt); Music.update(); }
  if (S.mode === 'gameover' || S.mode === 'victory') S.endT += rt;
  if (S.mode === 'title') S.titleT = (S.titleT || 0) + rt;
}

/* ---------------------------------------------------------------------------
   SYSTEMS — top-level input handling per mode
--------------------------------------------------------------------------- */
function handleModeInput(){
  // An overlay owns the keyboard while it is up. Without this, rebinding a key
  // to Q would quit to the title on the very press that bound it, and typing
  // in the settings screen would nudge the camera pitch.
  if (S.overlay){
    if (S.overlay.kind === 'binds' && S.overlay.listen){
      // Capture the next key. Escape cancels rather than binding, because a
      // player who has changed their mind has exactly one key they will reach
      // for and it must not become the binding.
      for (const k of Input.pressed){
        if (k === 'escape'){ S.overlay.listen = null; break; }
        if (k === 'tab' || k === 'f3') continue;
        const keys = Object.assign({}, Settings.get('keys') || {});
        // A key can only do one thing. Taking it from whatever held it before
        // is better than two actions on one key, which is unrecoverable
        // without a reset.
        for (const other of BINDS) if (keys[other] === k) delete keys[other];
        keys[S.overlay.listen] = k;
        Settings.set('keys', keys);
        S.overlay.listen = null;
        SFX.uiClick();
        break;
      }
      Input.pressed.clear();
      return;
    }
    if (keyHit('escape')) closeOverlay();
    return;
  }
  if (keyHit('f3')) S.showFps = !S.showFps;
  // nudge the camera bake live — one degree a press
  if (keyHit('[') || keyHit(']')){
    CAM.pitch = clamp(CAM.pitch + (keyHit(']') ? 1 : -1) * (Math.PI / 180), 0.35, 1.35);
    CAM.recompute();
    if (!CAM.follow) buildDeck();
    S.showFps = true;
    S.volToast = 0;
  }
  if (keyHit('m')){ Sound.toggleMute(); S.volToast = 1.6; }
  if (keyHit('-') || keyHit('_')){ Sound.setVol(Sound.vol - 0.1); S.volToast = 1.6; }
  if (keyHit('=') || keyHit('+')){ Sound.setVol(Sound.vol + 0.1); S.volToast = 1.6; }
  S.volToast = Math.max(0, (S.volToast || 0) - 0.016);

  if (S.mode === 'title'){
    // The title screen has real buttons now, so a bare click starts nothing —
    // it would fire whichever button happened to be under the cursor as well.
    if (keyHit('r')) startRun();
  } else if (S.mode === 'play'){
    if (keyHit('escape') || keyHit('p')){ S.mode = 'pause'; endRay(); }
  } else if (S.mode === 'pause'){
    if (keyHit('escape') || keyHit('p')) S.mode = 'play';
  } else if (S.mode === 'draft'){
    updateDraftHover();
    if (S.draft && S.draft.chosen < 0){
      if (keyHit('1')) pickCard(0);
      if (keyHit('2')) pickCard(1);
      if (keyHit('3')) pickCard(2);
      if (Input.clicked && S.draft.hover >= 0) pickCard(S.draft.hover);
    }
  } else if (S.mode === 'gameover' || S.mode === 'victory'){
    // The buttons on the results screen own the mouse now, so a bare click no
    // longer restarts: clicking Copy Run Report and being thrown into a new run
    // is exactly the kind of thing that makes a screen feel hostile.
    if (S.endT > 0.6){
      if (keyHit('r')) startRun();
      if (keyHit('c') && S.result) copyText(runReportText(S.result));
    }
  }
}

/* ---------------------------------------------------------------------------
   7. BOOT — fixed timestep with an accumulator, render decoupled
--------------------------------------------------------------------------- */
const DT = 1 / FEEL.simHz;
let lastT = 0, acc = 0;
S.rt = 0; S.titleT = 0; S.winSeq = 0; S.killT = 0; S.endT = 0; S.phase = 'idle';
S.endReason = ''; S.endTitle = ''; S.bossSpawned = false; S.stopUntil = 0;
S.ftBuf = new Float32Array(90); S.ftIdx = 0; S.showFps = false; S.loopIdx = 0; S.volToast = 0;

function frame(now){
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let real = (now - lastT) / 1000;
  lastT = now;
  if (real > 0.1) real = 0.1;

  handleModeInput();

  let ran = 0;
  if (S.mode === 'play'){
    if (S.hitStop > 0){
      S.hitStop -= real;                       // freezes the sim, not the frame
    } else {
      let scale = 1;
      if (S.slowmo > 0){ S.slowmo -= real; scale = TUNING.feel.waveClearSlowmo; }
      acc += real * scale;
      while (acc >= DT && ran < 10){ step(DT); acc -= DT; ran++; }
      if (acc > DT * 10) acc = 0;
    }
  } else {
    acc = 0;
  }

  updateUI(real);
  render(real);

  if (ran > 0 || S.mode !== 'play') Input.pressed.clear();
  Input.clicked = false;
  Input.rightClicked = false;
}


/* ============================================================================
   PERSISTENCE — settings, first-run prompts, and the run log
   ----------------------------------------------------------------------------
   One key in localStorage holding one JSON object. Several keys would be
   tidier to read in devtools and worse everywhere else: a partial write leaves
   the settings and the run history disagreeing about which version of the game
   wrote them, and clearing "just the hints" becomes three call sites.

   Every access is wrapped. localStorage throws rather than returns null in a
   few real situations — Safari private browsing, a file:// origin, storage
   disabled by policy — and none of them are a reason for the game not to run.
   If storage is unavailable the game keeps working with defaults and simply
   forgets between sessions.
============================================================================ */
const Store = {
  KEY: 'skygear.v10',
  data: null,
  ok: true,

  load(){
    if (this.data) return this.data;
    this.data = {};
    try {
      const raw = window.localStorage.getItem(this.KEY);
      if (raw) this.data = JSON.parse(raw) || {};
    } catch (e){ this.ok = false; }
    return this.data;
  },
  save(){
    if (!this.ok) return;
    try { window.localStorage.setItem(this.KEY, JSON.stringify(this.data)); }
    catch (e){ this.ok = false; }
  },
  get(k, dflt){
    const d = this.load();
    return (k in d) ? d[k] : dflt;
  },
  set(k, v){ this.load()[k] = v; this.save(); return v; },
  clear(){
    this.data = {};
    try { window.localStorage.removeItem(this.KEY); } catch (e){}
  },
};

/* ---------------------------------------------------------------------------
   SETTINGS
   Defaults are chosen so that a stranger who never opens this menu gets the
   right experience: full volume, full effects, and reduced motion already on if
   their operating system says they want it.
--------------------------------------------------------------------------- */
const SETTING_DEFAULTS = {
  volMaster: 0.85,
  volMusic: 0.55,
  volSfx: 1.0,
  volUi: 0.85,
  muted: false,
  vfx: 1,                 // 1 full · 0.5 fewer · 0.25 fewest
  reducedMotion: null,    // null = follow the OS; true/false = the player chose
  hudScale: 1,            // multiplies the resolution-derived scale
  hints: true,            // contextual first-run prompts
  seen: {},               // which prompts have fired
  keys: null,             // remaps, { action: 'key' }
};

const Settings = {
  v: null,

  init(){
    this.v = Object.assign({}, SETTING_DEFAULTS, Store.get('settings', {}));
    // seen/keys are objects; a stale shape from an older build must not throw
    if (!this.v.seen || typeof this.v.seen !== 'object') this.v.seen = {};
    return this;
  },
  get(k){ return this.v ? this.v[k] : SETTING_DEFAULTS[k]; },
  set(k, val){
    this.v[k] = val;
    Store.set('settings', this.v);
    this.apply(k);
    return val;
  },
  reset(){
    this.v = Object.assign({}, SETTING_DEFAULTS);
    this.v.seen = {};
    Store.set('settings', this.v);
    this.applyAll();
  },

  /* The OS preference is the default, not the law: a player who explicitly
     turns motion back on keeps it on even though their system asks for less. */
  motionReduced(){
    if (this.v.reducedMotion !== null) return !!this.v.reducedMotion;
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e){ return false; }
  },
  // Trauma shake, full-screen flashes and hit-stop all read these rather than
  // testing the flag themselves, so there is one place to change the strength.
  shakeScale(){ return this.motionReduced() ? 0.5 : 1; },
  flashScale(){ return this.motionReduced() ? 0 : 1; },
  stopScale(){ return this.motionReduced() ? 0.5 : 1; },

  apply(k){
    if (k === undefined || /^vol|^muted/.test(k)) this.applyAudio();
  },
  applyAll(){ this.applyAudio(); },
  applyAudio(){
    if (typeof Sound === 'undefined') return;
    Sound.muted = !!this.v.muted;
    Sound.vol = this.v.volMaster;
    if (Sound.master) Sound.master.gain.value = this.v.muted ? 0 : this.v.volMaster;
    if (Sound.bus){
      Sound.bus.music.gain.value = this.v.volMusic;
      Sound.bus.sfx.gain.value   = this.v.volSfx;
      Sound.bus.ui.gain.value    = this.v.volUi;
      Sound.bus.voice.gain.value = this.v.volSfx;
    }
  },

  /* First-run prompts. `fire` is idempotent per id and per player, so a call
     site can simply say "this just happened" every time it happens. */
  hintSeen(id){ return !!this.v.seen[id]; },
  markSeen(id){ this.v.seen[id] = 1; Store.set('settings', this.v); },
  forgetHints(){ this.v.seen = {}; Store.set('settings', this.v); },
};
Settings.init();

/* ---------------------------------------------------------------------------
   FIRST-RUN PROMPTS

   The old tutorial was a five-row control panel that appeared on wave 1 and
   faded on a timer whether or not it had been read, and a permanent
   "DEFEND THE BOILER" arrow. Both are the same mistake: teaching everything
   before anything has happened, at a moment when the player is busy.

   These fire at the moment the thing they explain first occurs, say one
   sentence, and are dismissed by doing the thing rather than by a timer. Each
   one fires once per player, ever — the game is twelve waves long and a prompt
   the second time is noise.

   `fire` is idempotent, so a call site can simply announce that something
   happened, every time it happens, without tracking whether it is the first.
--------------------------------------------------------------------------- */
const HINTS = {
  boarder:  { text: 'Boarders are climbing the rails. She swings on her own — get her close.',
              key: 'W A S D', hold: 6 },
  dash:     { text: 'Dash goes through anything and cannot be hit while it lasts. Use it constantly.',
              key: 'SPACE', hold: 7 },
  draft:    { text: 'Pick a weapon. Every skill is a SHAPE crossed with an ELEMENT.',
              key: '1 · 2 · 3', hold: 8 },
  slot:     { text: 'A new slot is open. A second element opens combinations the first cannot reach.',
              key: null, hold: 6 },
  passive:  { text: 'That one has no button — it works on its own while it holds the slot.',
              key: null, hold: 6 },
  push:     { text: 'They have grappled a hulk to the hull. Break it, or they keep coming.',
              key: null, hold: 7 },
  boiler:   { text: 'The Boiler is under half. It does not heal. Hold the lanes, not the Boiler.',
              key: null, hold: 7 },
  crossing: { text: 'The gaps in the cargo runs are the only way between lanes. Learn where they are.',
              key: null, hold: 6 },
};

const Hints = {
  live: null,     // { id, t, hold }
  queue: [],

  /* Announce that something happened. Shows the prompt if this player has never
     seen it and prompts are on. Safe to call every frame. */
  fire(id){
    if (!Settings.get('hints') || !HINTS[id]) return;
    if (Settings.hintSeen(id)) return;
    if (this.live && this.live.id === id) return;
    if (this.queue.indexOf(id) >= 0) return;
    // Marked seen on FIRING, not on dismissal. A player who dies with a prompt
    // on screen has still had it; showing it again next run is the behaviour
    // that makes tutorials feel like they are nagging.
    Settings.markSeen(id);
    if (this.live) this.queue.push(id);
    else this.live = { id, t: 0, hold: HINTS[id].hold };
  },
  /* The player did the thing. Dismiss it early — that is the reward. */
  did(id){
    if (this.live && this.live.id === id) this.dismiss();
  },
  dismiss(){
    this.live = null;
    const next = this.queue.shift();
    if (next) this.live = { id: next, t: 0, hold: HINTS[next].hold };
  },
  update(rt){
    if (!this.live) return;
    this.live.t += rt;
    if (this.live.t >= this.live.hold) this.dismiss();
  },
  reset(){ this.live = null; this.queue.length = 0; },
};

/* ---------------------------------------------------------------------------
   RUN LOG
   The last ten runs and a personal best, kept locally. No account, no server,
   nothing leaves the machine — which is also why the run report is a block of
   text the player copies themselves rather than anything that gets sent.
--------------------------------------------------------------------------- */
const RunLog = {
  MAX: 10,

  all(){
    const a = Store.get('runs', []);
    return Array.isArray(a) ? a : [];
  },
  best(){
    let b = null;
    for (const r of this.all()) if (!b || this.better(r, b)) b = r;
    return b;
  },
  /* Furthest wave first, then kills. Duration is deliberately not a tiebreak:
     rewarding a faster run would push toward skipping the draft, and the draft
     is the game. */
  better(a, b){
    if (!b) return true;
    if (a.won !== b.won) return !!a.won;
    if (a.wave !== b.wave) return a.wave > b.wave;
    return a.kills > b.kills;
  },

  record(run){
    const prev = this.best();
    run.pb = this.better(run, prev);
    const list = this.all();
    list.unshift(run);
    Store.set('runs', list.slice(0, this.MAX));
    return run;
  },
};

function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

/* Build the record of a finished run. Reads the live state rather than being
   handed a summary, so it cannot drift from what the results screen shows. */
function buildRunRecord(win){
  const build = [];
  if (S.basic) build.push(skillName(S.basic) + ' (auto)');
  for (let i = 0; i < 4; i++) if (S.slots[i]) build.push(skillName(S.slots[i]));
  return {
    v: PRESET.name,
    build: PRESET.build || 'dev',
    won: !!win,
    title: S.endTitle,
    cause: S.endReason,
    wave: win ? TUNING.totalWaves : Math.max(0, S.wave - 1),
    waves: TUNING.totalWaves,
    time: S.t,
    kills: S.stats.kills,
    damage: Math.round(S.stats.damage),
    chain: S.stats.bestCombo,
    dashes: S.stats.dashes,
    seed: seedText(S.seed),
    loadout: build,
    cards: S.stats.cards.slice(),
  };
}

/* One block of text a player can paste into a message. Everything needed to
   reproduce and to argue about is in it: the build id, the seed, the cause of
   death and the whole draft. */
function runReportText(r){
  const L = [];
  L.push('SKYGEAR ' + r.v + ' · build ' + r.build);
  L.push((r.title || (r.won ? 'DECK HELD' : 'BOARDED')) + ' — ' + (r.cause || ''));
  L.push('wave ' + r.wave + '/' + r.waves + ' · ' + fmtDuration(r.time) + ' · seed ' + r.seed);
  L.push('kills ' + r.kills + ' · damage ' + r.damage.toLocaleString() +
         ' · best chain ' + r.chain + ' · dashes ' + r.dashes);
  L.push('build: ' + (r.loadout.length ? r.loadout.join('  /  ') : '—'));
  if (r.cards.length) L.push('draft: ' + r.cards.join(', '));
  L.push('replay: ' + location.origin + location.pathname + '?seed=' + r.seed);
  return L.join('\n');
}

/* Clipboard, with a fallback. navigator.clipboard is unavailable on insecure
   origins, which includes the http://127.0.0.1 the game is developed on and
   any playtester served over plain http — exactly the people most likely to be
   asked for a run report. */
function copyText(text){
  const legacy = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e){ return false; }
  };
  try {
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(
        () => { S.copyToast = { t: 0, ok: true }; },
        () => { S.copyToast = { t: 0, ok: legacy() }; });
      return true;
    }
  } catch (e){}
  const ok = legacy();
  S.copyToast = { t: 0, ok };
  return ok;
}

   Everything here is additive. The procedural synth in `Sound`/`SFX` remains

/* 2 ------------------------------------------------------------------------ */
const AudioBank = {
  buf: {}, enabled: false, base: 'audio/', ext: '.ogg',
  ready: 0, total: 0, pending: 0,

  init(){
    const q = (typeof location !== 'undefined' && location.search) || '';
    this.enabled = !/[?&]audio=0/.test(q) && window.SKYGEAR_USE_AUDIO !== false;
    // Only what src/ingest-audio.py actually found in the repo. Guessing per
    // manifest entry would mean a request and a 404 for every cue nobody has
    // made yet; an undelivered cue should cost nothing and simply keep its
    // procedural voice.
    this.delivered = (typeof AUDIO_DELIVERED !== 'undefined') ? AUDIO_DELIVERED : {};
    this.total = Object.keys(this.delivered).length;
  },

  // Deferred until the AudioContext exists — decodeAudioData needs it, and the
  // context cannot be created before a user gesture.
  start(){
    if (!this.enabled || this.started || !Sound.ready) return;
    this.started = true;
    for (const k in this.delivered) if (!AUDIO_MANIFEST[k] || !AUDIO_MANIFEST[k].lazy) this.fetch(k);
  },

  fetch(k){
    const m = AUDIO_MANIFEST[k], d = this.delivered[k];
    if (!m || !d || this.buf[k] !== undefined) return;
    this.buf[k] = null;                       // claim the slot; null = in flight
    const ext = d.ext || this.ext;
    const names = d.n > 1
      ? Array.from({ length: d.n }, (_, i) => m.file + '_' + (i + 1))
      : [m.file];
    const got = [];
    let left = names.length;
    names.forEach((n, i) => {
      fetch(this.base + n + ext)
        .then(r => (r.ok ? r.arrayBuffer() : Promise.reject()))
        .then(b => new Promise((res, rej) => Sound.ctx.decodeAudioData(b, res, rej)))
        .then(dec => { got[i] = dec; })
        .catch(() => {})                      // absent or undecodable: stay procedural
        .then(() => {
          if (--left) return;
          const list = got.filter(Boolean);
          if (list.length){ this.buf[k] = list; this.ready++; }
          else this.buf[k] = false;           // false = tried and failed, do not retry
        });
    });
  },

  get(k){
    const b = this.buf[k];
    if (b && b.length) return b[(Math.random() * b.length) | 0];
    if (b === undefined && this.delivered[k]) this.fetch(k);
    return null;
  },
  has(k){ const b = this.buf[k]; return !!(b && b.length); },
};
AudioBank.init();

/* 3 ------------------------------------------------------------------------ */
/* Buses sit between the cues and the existing master gain, so mute and the
   volume keys keep working untouched and each family gets its own trim. */
const _soundUnlock = Sound.unlock.bind(Sound);
Sound.unlock = function(){
  _soundUnlock();
  if (!this.ready || this.bus) return;
  const c = this.ctx, mk = (v) => { const g = c.createGain(); g.gain.value = v; g.connect(this.master); return g; };
  this.bus = { music: mk(0.55), sfx: mk(1.0), ui: mk(0.85), voice: mk(1.0) };
  this.duckT = 0;
  // The buses do not exist until the first gesture, so stored volumes have had
  // nowhere to land until now. Push them in the moment the graph appears —
  // otherwise a player who turned the music down last session gets one loud
  // bar of it before the settings screen is ever opened.
  Settings.applyAudio();
  AudioBank.start();
  Music.onUnlock();
};
Settings.applyAudio();   // master gain and mute, which do exist before unlock
Sound.dest = function(name){
  return (this.bus && this.bus[name || 'sfx']) || this.master;
};

/* Belt and braces on suspension. visibilitychange and focus cover the normal
   case, but browsers suspend for reasons beyond tab switching and a resume()
   issued too close to a suspend() can be swallowed. Since a suspended context
   fails silently — every cue still reports success while producing nothing —
   the loop checks once a second rather than trusting any single event. */
Sound._wakeT = 0;
Sound.keepAwake = function(){
  if (!this.ctx) return;
  // NOT ctx.currentTime — that clock stops while the context is suspended, so
  // using it to decide when to un-suspend can never fire. Wall clock only.
  const now = performance.now();
  if (now - this._wakeT < 1000) return;
  this._wakeT = now;
  if (this.ctx.state === 'suspended') this.ctx.resume();
};

/* Music ducks under the big moments, and only those — per-hit ducking pumps. */
Sound.duck = function(db, secs){
  if (!this.bus) return;
  const g = this.bus.music.gain, c = this.ctx, t = c.currentTime;
  const base = 0.55, to = base * Math.pow(10, -Math.abs(db) / 20);
  g.cancelScheduledValues(t);
  g.setValueAtTime(g.value, t);
  g.linearRampToValueAtTime(to, t + 0.05);
  g.linearRampToValueAtTime(base, t + 0.05 + (secs || 0.25));
};

/* 4 ------------------------------------------------------------------------ */
const _voices = {};        // key -> array of {node, t}
const _lastAt = {};        // key -> last start time, for the retrigger floor

/* Pan and attenuate from the camera focus. A lane you cannot see must still be
   audible — that is the entire reason positional audio is here — so distance
   rolls off to a floor, never to zero, and pan never goes fully hard. */
function _place(x, y){
  const fx = (typeof CAM !== 'undefined' && CAM.focusX !== undefined)
    ? CAM.focusX : TUNING.deck.cx;
  const fy = (typeof CAM !== 'undefined' && CAM.focusY !== undefined)
    ? CAM.focusY : TUNING.deck.cy;
  const half = Math.max(1, TUNING.world.w * 0.5);
  const pan = clamp((x - fx) / half, -1, 1) * 0.7;
  const d = Math.hypot(x - fx, y - fy);
  const gain = d <= 600 ? 1 : Math.max(0.35, 1 - (d - 600) / 1000 * 0.65);
  return { pan, gain };
}

Sound.sample = function(key, opt){
  if (!this.ready || this.muted) return false;
  const m = AUDIO_MANIFEST[key];
  const buf = AudioBank.get(key);
  if (!m || !buf) return false;
  opt = opt || {};
  const c = this.ctx, now = c.currentTime;

  if (m.gap && _lastAt[key] !== undefined && now - _lastAt[key] < m.gap) return true;
  _lastAt[key] = now;

  const live = _voices[key] || (_voices[key] = []);
  for (let i = live.length - 1; i >= 0; i--) if (live[i].done) live.splice(i, 1);
  const cap = opt.loop ? 1 : (m.max || 2);
  while (live.length >= cap){
    const old = live.shift();
    try { old.src.stop(); } catch (e) {}
  }

  const src = c.createBufferSource();
  src.buffer = buf;
  if (m.vary) src.detune.value = (Math.random() * 2 - 1) * m.vary * 1200;
  if (m.loop || opt.loop){
    src.loop = true;
    if (m.loopStart !== undefined){ src.loopStart = m.loopStart; src.loopEnd = m.loopEnd; }
  }
  const g = c.createGain();
  // three factors: the caller's, the cue's designed weight, and the ingest's
  // delivery correction for masters that arrived at inconsistent levels
  const d = AudioBank.delivered[key];
  g.gain.value = (opt.gain === undefined ? 1 : opt.gain)
               * (m.gain === undefined ? 1 : m.gain)
               * ((d && d.g) || 1);
  let node = src;
  if (opt.x !== undefined && c.createStereoPanner){
    const p = _place(opt.x, opt.y);
    const pan = c.createStereoPanner();
    pan.pan.value = p.pan;
    g.gain.value *= p.gain;
    node.connect(pan); node = pan;
  }
  node.connect(g);
  g.connect(this.dest(opt.bus || m.bus));
  const rec = { src, g, done: false };
  src.onended = () => { rec.done = true; };
  src.start(0);
  live.push(rec);
  return rec;
};

/* Sustained cues: ambience, the beam, the boiler alarm. Idempotent both ways. */
const _loops = {};
Sound.startLoop = function(key, gain){
  if (_loops[key] || !AudioBank.has(key)) return;
  const rec = this.sample(key, { loop: true, gain: gain === undefined ? 1 : gain });
  if (rec) _loops[key] = rec;
};
Sound.stopLoop = function(key){
  const rec = _loops[key];
  if (!rec) return;
  delete _loops[key];
  try {
    const t = this.ctx.currentTime;
    rec.g.gain.setValueAtTime(rec.g.gain.value, t);
    rec.g.gain.linearRampToValueAtTime(0.0001, t + 0.25);
    rec.src.stop(t + 0.3);
  } catch (e) {}
};

/* 5 ------------------------------------------------------------------------ */
/* Every named cue becomes: play the sample if it loaded, otherwise run exactly
   the synth that has always been there. Call sites are untouched — all 20 of
   them keep their names and signatures — which is what makes the fallback
   structural rather than something anyone has to remember. */
function _wrapCue(obj, name, key){
  const synth = obj[name].bind(obj);
  obj[name] = function(opt){
    if (Sound.sample(key, opt)) return;
    synth(opt);
  };
}

/* A cast is its shape crossed with its element, in sound as in code: one body,
   one tail, layered. Six bodies and four tails cover all twenty-four casts. */
const SHAPE_CUE = {
  CLOSEHIT:'shape_cleave', LINE_BURST:'shape_lance', CONE:'shape_gale',
  RANGED_AOE:'shape_mortar', CHAIN:'shape_whip', RAY:'shape_beam_start',
};
SFX.cast = function(shape, element, x, y){
  const at = (x === undefined) ? {} : { x, y };
  const body = SHAPE_CUE[shape];
  const played = body ? Sound.sample(body, at) : false;
  SFX.fire[element](at);            // the tail, or its synth if absent
  if (!played && body) return;      // synth already covered it via fire[]
};

    if (Sound.sample(key, opt)) return;

  };
}
