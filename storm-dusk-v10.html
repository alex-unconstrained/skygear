function drawCrewBillboard(c){
  entityShadow(c.x, c.y, c.r * 1.1, 0.45);
  const front = Math.sin(c.facing) > -0.15;
  const bob = Math.sin(c.anim * 6) * 2.5;
  const swinging = c.state === 'windup' || c.state === 'recover';
  drawBillboard(crewSprite(front ? 'front' : 'back', swinging && front), c.x, c.y, 96,
                { mirror: Math.cos(c.facing) > 0, lift: bob, flash: c.flash > 0 });
  if (c.hp < c.maxHp){
    const top = CAM.project(c.x, c.y, 112);
    const w = 26 * top.k, h = 4 * top.k;
    ctx.fillStyle = 'rgba(13,11,18,0.8)';
    rr(top.x - w/2 - 1.5, top.y - 1.5, w + 3, h + 3, 2); ctx.fill();
    ctx.fillStyle = PAL.teal;
    rr(top.x - w/2, top.y, w * clamp(c.hp/c.maxHp, 0, 1), h, 2); ctx.fill();
  }
}

/* --- their hulk, grappled to the bow -------------------------------------- */
function hulkSprite(){
  const H = S.hulk;
  const art = Assets.get(H && H.dead ? 'prop_hulk_wreck'
                       : H && H.vulnerable ? 'prop_hulk_open' : 'prop_hulk_sealed');
  if (art) return art;
  return cachedSprite('hulk', 900, 520, (c2, w, h) => {
    c2.save();
    c2.translate(w / 2, h * 0.96);
    c2.scale(h / 470, h / 470);
    c2.lineJoin = 'round'; c2.lineCap = 'round';
    // hull
    ctx.beginPath();
    ctx.moveTo(-400, 0); ctx.quadraticCurveTo(-330, -230, 0, -270);
    ctx.quadraticCurveTo(330, -230, 400, 0);
    ctx.closePath();
    fillStroke(C('#241C28'), ink(), 9);
    // ribs
    ctx.strokeStyle = hexToRgba(PAL.iron, 0.7); ctx.lineWidth = 8;
    for (let i = -3; i <= 3; i++){
      ctx.beginPath();
      ctx.moveTo(i * 92, -12); ctx.lineTo(i * 76, -218 + Math.abs(i) * 26); ctx.stroke();
    }
    // boarding ramps clawing onto our deck
    for (const s of [-1, 0, 1]){
      ctx.save(); ctx.translate(s * 250, -6); ctx.rotate(s * 0.06);
      plate(0, 20, 120, 54, 6, '#3A3038');
      ctx.strokeStyle = C(PAL.iron); ctx.lineWidth = 6;
      for (let i = -1; i <= 1; i++){
        ctx.beginPath(); ctx.moveTo(-52, 20 + i * 16); ctx.lineTo(52, 20 + i * 16); ctx.stroke();
      }
      ctx.restore();
    }
    // furnace maw
    ctx.beginPath();
    ctx.moveTo(-120, -80); ctx.lineTo(120, -80);
    ctx.lineTo(90, -196); ctx.lineTo(-90, -196); ctx.closePath();
    fillStroke(C('#4A1C08'), ink(), 8);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    drawGlow(0, -140, 210, PAL.fire, 0.75); ctx.restore();
    ctx.fillStyle = PAL.fire;
    ctx.beginPath();
    ctx.moveTo(-104, -90); ctx.lineTo(104, -90);
    ctx.lineTo(80, -186); ctx.lineTo(-80, -186); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C(PAL.ink); ctx.lineWidth = 10;
    for (let i = 0; i < 3; i++){
      ctx.beginPath(); ctx.moveTo(-100 + i * 4, -110 - i * 30);
      ctx.lineTo(100 - i * 4, -110 - i * 30); ctx.stroke();
    }
    // gantries + lamps
    for (const s of [-1, 1]){
      ctx.save(); ctx.translate(s * 300, -130);
      plate(0, 0, 60, 90, 10, '#3A3038');
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      drawGlow(0, -20, 60, PAL.danger, 0.7); ctx.restore();
      circ(0, -20, 13); fillStroke(PAL.danger, ink(), 6);
      ctx.restore();
    }
    c2.restore();
    applyTwoSourceLight(c2, w, h);
  });
}
function drawHulk(){
  const H = S.hulk;
  if (!H || H.dead) return;
  const p = CAM.project(H.x, H.y, 0);
  const img = hulkSprite();
  const hpx = 560 * p.k, wpx = hpx * (img.width / img.height);
  ctx.save();
  if (H.flash > 0){
    ctx.drawImage(img, p.x - wpx/2, p.y - hpx * 0.96, wpx, hpx);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(H.flash / 0.1, 0, 1) * 0.5;
    ctx.drawImage(tintVersion(img, '#FFD9A0'), p.x - wpx/2, p.y - hpx * 0.96, wpx, hpx);
  } else {
    ctx.drawImage(img, p.x - wpx/2, p.y - hpx * 0.96, wpx, hpx);
  }
  ctx.restore();
  // sealed vs open plating — the whole push/hold read depends on this
  if (H.vulnerable){
    const q = CAM.project(H.x, H.y, 260);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(q.x, q.y, 150 * q.k, PAL.fireCore, 0.30 + Math.sin(S.rt * 6) * 0.12);
    ctx.restore();
  }
  if (rnd() < 0.3) pSmoke(H.x + rnd(-200, 200), H.y + 40, 1, 'rgba(40,36,48,0.5)', 60);
}

/* --- lane status: the minimap equivalent ----------------------------------
   Three lanes, and the decision the player makes over and over is which one to
   be in. The v9 readout answered it with a headcount and a coloured dot, which
   is the wrong question twice: a lane with nine boarders at the rail is safer
   than a lane with one at the Boiler, and a red dot is invisible to about one
   man in twelve.

   So: depth is a position on the bar, count is a number, heavy boarders get a
   filled marker rather than a darker one, your crew get their own tick, and
   every colour is carried by a shape as well. Nothing here is colour alone.
--------------------------------------------------------------------------- */
function drawLaneStatus(){
  if (!PRESET.lanes) return;
  const HS = hudScale();
  const w = 244 * HS, rowH = 46 * HS;
  const x = View.w - w - 18 * HS;
  const y = (S.showFps ? 96 : 22) * HS;
  brassPanel(x, y, w, 30 * HS + LANE_N * rowH, 9 * HS, 0.92);
  setFont(Math.round(11 * HS), 800, true);
  textOut('LANES', x + w / 2, y + 15 * HS, PAL.brass);
  // Which end of the bar is which. Without this the bar is an abstraction.
  setFont(Math.round(8.5 * HS), 700, false);
  textOut('BOW', x + 16 * HS, y + 15 * HS, '#5A5366', null, 0, 'left');
  textOut('BOILER', x + w - 16 * HS, y + 15 * HS, '#5A5366', null, 0, 'right');

  const here = laneOf(S.player.x);
  const marks = crossingMarks();
  for (let i = 0; i < LANE_N; i++){
    const t = laneThreat(i);
    const ry = y + 30 * HS + i * rowH;
    // you are here — a bracket as well as a wash, so it survives greyscale
    if (S.player.y < BASE_Y && here === i){
      ctx.fillStyle = hexToRgba(PAL.teal, 0.12);
      rr(x + 6 * HS, ry, w - 12 * HS, rowH - 4 * HS, 5); ctx.fill();
      ctx.fillStyle = PAL.teal;
      rr(x + 6 * HS, ry + 4 * HS, 3 * HS, rowH - 12 * HS, 1.5 * HS); ctx.fill();
    }
    setFont(Math.round(10.5 * HS), 800, true);
    textOut(LANES[i].name, x + 16 * HS, ry + 13 * HS,
            here === i ? PAL.teal : '#9C93A8', null, 0, 'left');

    // headcount, and a filled square when something armoured is in there
    if (t.count){
      setFont(Math.round(10 * HS), 800, true);
      const col = t.critical ? PAL.danger : '#9C93A8';
      textOut(t.count + '', x + w - 16 * HS, ry + 13 * HS, col, null, 0, 'right');
      if (t.heavy){
        ctx.fillStyle = col;
        const hx = x + w - 34 * HS;
        ctx.fillRect(hx - 4 * HS, ry + 9 * HS, 8 * HS, 8 * HS);
      }
    }
    // crew holding the lane, as ticks
    for (let c = 0; c < Math.min(4, t.crew); c++){
      ctx.fillStyle = hexToRgba(PAL.teal, 0.85);
      ctx.fillRect(x + 62 * HS + c * 6 * HS, ry + 9 * HS, 2.5 * HS, 8 * HS);
    }

    const bx = x + 16 * HS, bw = w - 32 * HS, by = ry + 26 * HS, bh = 7 * HS;
    ctx.fillStyle = '#0B0910'; rr(bx, by, bw, bh, 3); ctx.fill();
    // the crossings, as notches in the track — the same two gaps that are
    // painted on the deck, in the same relative place
    for (const m of marks){
      ctx.fillStyle = 'rgba(143,166,201,0.5)';
      ctx.fillRect(bx + bw * m - 1 * HS, by - 3 * HS, 2 * HS, bh + 6 * HS);
    }
    // the cannon, as a segment of the track it actually gates
    if (t.turret){
      ctx.fillStyle = hexToRgba(t.turretFrac > 0.4 ? PAL.teal : PAL.dangerIn, 0.6);
      rr(bx, by, bw * clamp(t.turretFrac, 0, 1) * 0.32, bh, 3); ctx.fill();
    } else {
      // A gap in the track, plus the words. A lane with no cannon is the single
      // most important fact on this panel and it used to be red text alone.
      ctx.strokeStyle = PAL.danger; ctx.lineWidth = 1.6 * HS;
      ctx.setLineDash([3 * HS, 3 * HS]);
      ctx.beginPath();
      ctx.moveTo(bx, by + bh / 2); ctx.lineTo(bx + bw * 0.32, by + bh / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      setFont(Math.round(8.5 * HS), 800, true);
      textOut('NO CANNON', x + w - 16 * HS, ry + 39 * HS, PAL.danger, null, 0, 'right');
    }
    // the deepest boarder — a triangle pointing at the Boiler, filled when
    // critical, hollow when not
    if (t.count){
      const px = bx + bw * clamp(t.prog, 0, 1);
      const cy = by + bh / 2, s2 = 5.5 * HS;
      ctx.beginPath();
      ctx.moveTo(px + s2, cy);
      ctx.lineTo(px - s2, cy - s2);
      ctx.lineTo(px - s2, cy + s2);
      ctx.closePath();
      // Outlined in ink first. Against the dark track a mid-value orange
      // triangle is nearly the same value as the track itself — checked on a
      // greyscale capture, where the whole readout went flat.
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3.4 * HS; ctx.stroke();
      if (t.critical){ ctx.fillStyle = PAL.danger; ctx.fill(); }
      else { ctx.fillStyle = PAL.base; ctx.fill();
             ctx.strokeStyle = PAL.dangerIn; ctx.lineWidth = 2 * HS; ctx.stroke(); }
    }
  }

  // The push, when there is one. It belongs on this panel because it is the
  // reason to leave a lane you would otherwise hold.
  if (S.hulk && !S.hulk.dead && S.hulk.vulnerable){
    const py = y + 30 * HS + LANE_N * rowH - 2 * HS;
    setFont(Math.round(9.5 * HS), 800, true);
    textOut('PUSH — HULK OPEN AT THE BOW', x + w / 2, py + 6 * HS,
            PAL.fireCore, PAL.ink, 3);
  }
}

/* One alert, and only when a lane crosses into critical. A HUD that shouts
   every time a number changes is a HUD nobody reads; this fires on the edge,
   not on the state, and holds its tongue for a while afterwards. */
const LANE_ALERT = { lane: -1, t: 0, cool: 0, was: [false, false, false] };
function updateLaneAlerts(rt){
  if (!PRESET.lanes || S.mode !== 'play') return;
  LANE_ALERT.t = Math.max(0, LANE_ALERT.t - rt);
  LANE_ALERT.cool = Math.max(0, LANE_ALERT.cool - rt);
  for (let i = 0; i < LANE_N; i++){
    const crit = laneThreat(i).critical;
    if (crit && !LANE_ALERT.was[i] && LANE_ALERT.cool <= 0){
      LANE_ALERT.lane = i; LANE_ALERT.t = 2.4; LANE_ALERT.cool = 7;
      SFX.laneCritical();
    }
    LANE_ALERT.was[i] = crit;
  }
}
function drawLaneAlert(){
  if (LANE_ALERT.t <= 0 || LANE_ALERT.lane < 0) return;
  const HS = hudScale();
  const a = Math.min(1, LANE_ALERT.t / 0.4) * Math.min(1, (2.4 - LANE_ALERT.t) / 0.18 + 0.2);
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  setFont(Math.round(20 * HS), 900, true);
  const name = LANES[LANE_ALERT.lane].name;
  textOut(name + '  LANE  BREAKING', View.w / 2, View.h * 0.30, PAL.danger, PAL.ink, 6);
  // an arrow toward the lane, so the words are not the only carrier
  const dir = LANE_ALERT.lane === 0 ? -1 : LANE_ALERT.lane === LANE_N - 1 ? 1 : 0;
  if (dir){
    const ax = View.w / 2 + dir * (ctx.measureText(name + '  LANE  BREAKING').width / 2 + 26 * HS);
    ctx.fillStyle = PAL.danger;
    ctx.beginPath();
    ctx.moveTo(ax + dir * 10 * HS, View.h * 0.30);
    ctx.lineTo(ax - dir * 6 * HS, View.h * 0.30 - 9 * HS);
    ctx.lineTo(ax - dir * 6 * HS, View.h * 0.30 + 9 * HS);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

// hulk health, when it is the thing you are supposed to be breaking
function drawHulkBar(){
  if (!PRESET.lanes || !S.hulk || S.hulk.dead || !S.hulk.vulnerable) return;
  const HS = hudScale();
  const w = Math.min(View.w * 0.5, 620 * HS), h = 18 * HS;
  const x = (View.w - w) / 2, y = 132 * HS;
  rr(x - 4, y - 4, w + 8, h + 8, 6);
  ctx.fillStyle = 'rgba(13,11,18,0.9)'; ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4; ctx.stroke();
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, PAL.fireCore); g.addColorStop(1, PAL.fire);
  rr(x, y, w * clamp(S.hulk.hp / S.hulk.maxHp, 0, 1), h, 4);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = PAL.brass; ctx.lineWidth = 2; rr(x, y, w, h, 4); ctx.stroke();
  setFont(Math.round(12 * HS), 800, true);
  textOut('BOARDING HULK — PLATING OPEN', View.w / 2, y - 12 * HS, PAL.fireCore, PAL.ink, 4);
}


/* ---------------------------------------------------------------------------
   SKILL VFX — the shapes live on the ground, so they are projected onto it.
   Saturated pops off the dark base (§1.2).
--------------------------------------------------------------------------- */
function jitterAt(i, seed){
  const n = Math.sin(i * 127.1 + seed * 311.7) * 43758.5453;
  return (n - Math.floor(n)) * 2 - 1;
}

/* The aura is not an effect that fires — it is a state you are in, so it draws
   every frame from the slot rather than from the fx list. Kept faint: it is on
   screen permanently and anything punchy here becomes wallpaper within a wave. */
function drawAuraFields(){
  const P = S.player;
  if (P.hp <= 0) return;
  for (let i = 0; i < 4; i++){
    const sk = S.slots[i];
    if (!sk || SHAPES[sk.shape].kind !== 'aura') continue;
    const st = skillStats(sk), E = ELEMENTS[sk.element];
    const puls = 0.82 + Math.sin(S.t * 2.4) * 0.18;
    groundDisc(P.x, P.y, st.radius, E.color, 0.055 * puls);
    groundRing(P.x, P.y, st.radius, E.color, 3, 0.34 * puls);
    groundRing(P.x, P.y, st.radius * 0.82, E.glow, 1.5, 0.16 * puls);
  }
}

function drawSentries(){
  for (const s of S.sentries){
    const E = ELEMENTS[s.element];
    const p = CAM.project(s.x, s.y, 0);
    const fade = clamp(s.t / 1.2, 0, 1);      // warns before it expires
    ctx.save();
    ctx.globalAlpha = fade;
    groundRing(s.x, s.y, 34, E.color, 2.5, 0.5);
    const top = CAM.project(s.x, s.y, 46);
    // squat tripod + barrel, drawn straight so it reads at any camera angle
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 6 * p.k;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(top.x, top.y); ctx.stroke();
    ctx.strokeStyle = PAL.brass; ctx.lineWidth = 3.4 * p.k;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(top.x, top.y); ctx.stroke();
    const bl = 26 * top.k;
    ctx.strokeStyle = E.color; ctx.lineWidth = 5 * top.k; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(top.x, top.y);
    ctx.lineTo(top.x + Math.cos(s.ang) * bl, top.y + Math.sin(s.ang) * bl * 0.6);
    ctx.stroke();
    circ(top.x, top.y, 6 * top.k); ctx.fillStyle = PAL.iron; ctx.fill();
    if (s.fire > 0){
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      drawGlow(top.x, top.y, 26 * top.k, E.glow, s.fire / 0.12);
      ctx.restore();
    }
    ctx.restore();
  }
}

function drawGroundFx(){
  drawAuraFields();
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const f of S.fx){
    if (f.delay > 0) continue;
    const k = clamp(f.t / f.life, 0, 1), inv = 1 - k, e = easeOut(k);

    if (f.kind === 'arc'){
      const R = f.r * (0.6 + 0.44 * e), R0 = R * (0.4 + 0.2 * e);
      const half = f.arc/2 * (0.3 + 0.7 * e);
      groundWedgePath(f.x, f.y, R0, R, f.a - half, f.a + half);
      ctx.globalAlpha = inv * 0.55; ctx.fillStyle = f.col; ctx.fill();
      ctx.globalAlpha = inv * 0.95;
      ctx.strokeStyle = f.glow; ctx.lineWidth = 3; ctx.stroke();
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      groundWedgePath(f.x, f.y, R0, R, f.a - half, f.a + half);
      ctx.globalAlpha = inv * 0.5; ctx.fillStyle = f.glow; ctx.fill();
      ctx.restore();

    } else if (f.kind === 'cone'){
      const R = f.r * (0.35 + 0.75 * e);
      groundWedgePath(f.x, f.y, 8, R, f.a - f.arc/2, f.a + f.arc/2);
      ctx.globalAlpha = inv * 0.42; ctx.fillStyle = f.col; ctx.fill();
      ctx.globalAlpha = inv * 0.85; ctx.strokeStyle = f.glow; ctx.lineWidth = 3; ctx.stroke();
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      groundWedgePath(f.x, f.y, R * 0.5, R, f.a - f.arc/2, f.a + f.arc/2);
      ctx.globalAlpha = inv * 0.45; ctx.fillStyle = f.glow; ctx.fill();
      ctx.restore();

    } else if (f.kind === 'line'){
      groundBandPath(f.x, f.y, f.a, f.len, f.w * (0.7 + 0.5 * inv), 0);
      ctx.globalAlpha = inv * 0.5; ctx.fillStyle = f.col; ctx.fill();
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      groundBandPath(f.x, f.y, f.a, f.len, f.w * 0.34, 0);
      ctx.globalAlpha = inv * 0.9; ctx.fillStyle = f.glow; ctx.fill();
      ctx.restore();

    } else if (f.kind === 'aoe'){
      const R = f.r * (0.45 + 0.55 * e);
      groundDisc(f.x, f.y, R, f.col, inv * 0.30);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = groundEllipsePath(f.x, f.y, R * 0.7);
      const rg = ctx.createRadialGradient(g.p.x, g.p.y, 1, g.p.x, g.p.y, Math.max(1, g.rx));
      rg.addColorStop(0, hexToRgba('#FFFFFF', Math.max(0, 1 - k * 2.4)));
      rg.addColorStop(0.4, hexToRgba(f.glow || f.col, inv * 0.7));
      rg.addColorStop(1, hexToRgba(f.col, 0));
      ctx.fillStyle = rg; ctx.fill();
      ctx.restore();
      groundRing(f.x, f.y, f.r * (0.55 + 0.45 * e), f.col, 8 * inv + 3, inv * 0.95);
      groundRing(f.x, f.y, f.r * (0.55 + 0.45 * e), f.glow || '#FFF', 3 * inv + 1, inv * 0.7);
      const gg = groundEllipsePath(f.x, f.y, R);
      ctx.save();
      ctx.globalAlpha = inv * 0.4; ctx.strokeStyle = f.glow || f.col; ctx.lineWidth = 2.4 * gg.p.k;
      for (let i = 0; i < 8; i++){
        const a = i / 8 * TAU + (f.x + f.y) * 0.01;
        ctx.beginPath();
        ctx.moveTo(gg.p.x + Math.cos(a) * gg.rx * 0.35, gg.p.y + Math.sin(a) * gg.ry * 0.35);
        ctx.lineTo(gg.p.x + Math.cos(a) * gg.rx * 1.05, gg.p.y + Math.sin(a) * gg.ry * 1.05);
        ctx.stroke();
      }
      ctx.restore();

    } else if (f.kind === 'pop' || f.kind === 'fizzle'){
      groundRing(f.x, f.y, (f.r || 20) * (0.4 + 1.3 * e), f.col,
                 5 * inv + 1, inv * (f.kind === 'pop' ? 0.8 : 0.35));

    } else if (f.kind === 'swing'){
      groundWedgePath(f.x, f.y, f.r * 0.55, f.r * 0.95, f.a - f.arc/2, f.a + f.arc/2);
      ctx.globalAlpha = inv * 0.4; ctx.fillStyle = '#D8D2E4'; ctx.fill();
    }
  }
  ctx.restore();
}

// chain arcs, muzzle flashes and the sustained ray live above the deck
function drawAirFx(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const f of S.fx){
    if (f.delay > 0) continue;
    const k = clamp(f.t / f.life, 0, 1), inv = 1 - k;
    if (f.kind === 'chain'){
      const seed = Math.floor(f.t * 34);
      const pts = f.pts.map(p => CAM.project(p.x, p.y, 56));
      for (let pass = 0; pass < 2; pass++){
        ctx.globalAlpha = inv * (pass ? 0.95 : 0.32);
        ctx.strokeStyle = pass ? (f.glow || '#FFF') : f.col;
        ctx.lineWidth = pass ? (3.4 * inv + 1.4) : (14 * inv + 5);
        ctx.beginPath();
        for (let s = 0; s < pts.length - 1; s++){
          const a = pts[s], b = pts[s+1];
          const dx = b.x - a.x, dy = b.y - a.y;
          const L = Math.hypot(dx, dy) || 1;
          const nx = -dy / L, ny = dx / L;
          ctx.moveTo(a.x, a.y);
          for (let i = 1; i <= 5; i++){
            const t = i / 5;
            const amp = (i === 5 ? 0 : 12 * inv);
            const j = jitterAt(s * 11 + i, seed) * amp;
            ctx.lineTo(a.x + dx * t + nx * j, a.y + dy * t + ny * j);
          }
        }
        ctx.stroke();
      }
      ctx.globalAlpha = inv;
      for (let i = 1; i < pts.length; i++)
        drawGlow(pts[i].x, pts[i].y, 24 * inv + 6, f.glow || '#FFFFFF', 1);

    } else if (f.kind === 'muzzle'){
      const q = CAM.project(f.x, f.y, 70);
      ctx.globalAlpha = inv;
      drawGlow(q.x, q.y, (26 * inv + 8) * q.k, f.glow || f.col, 1);
      drawGlow(q.x, q.y, (12 * inv + 4) * q.k, '#FFFFFF', 0.9);
      const im = Assets.get('fx_impact');
      if (im){
        const s = (70 * inv + 26) * q.k;
        ctx.drawImage(im, q.x - s/2, q.y - s/2, s, s);
      }

    } else if (f.kind === 'gear'){
      const q = CAM.project(f.x, f.y, 60);
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(f.t * 6); ctx.scale(q.k, q.k);
      ctx.globalAlpha = inv * 0.9;
      ctx.strokeStyle = PAL.brassLite; ctx.lineWidth = 5 * inv + 2;
      const R = 30 + 40 * easeOut(k);
      circ(0, 0, R); ctx.stroke();
      for (let i = 0; i < 8; i++){
        const a = i / 8 * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R);
        ctx.lineTo(Math.cos(a) * (R + 10), Math.sin(a) * (R + 10)); ctx.stroke();
      }
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawRay(){
  const R = S.player.ray;
  if (!R) return;
  const sk = S.slots[R.slot];
  if (!sk) return;
  const st = skillStats(sk), E = ELEMENTS[sk.element];
  const P = S.player, a = P.aim;
  const pulse = 0.85 + Math.sin(S.rt * 40) * 0.15;
  // scorch band on the deck
  groundBandPath(P.x, P.y, a, R.len, st.width * 1.1, 12);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.35; ctx.fillStyle = E.color; ctx.fill();
  // the beam itself, at chest height
  const A = CAM.project(P.x + Math.cos(a) * 16, P.y + Math.sin(a) * 16, 62);
  const B = CAM.project(P.x + Math.cos(a) * R.len, P.y + Math.sin(a) * R.len, 62);
  const wA = st.width * 0.5 * pulse * A.k, wB = st.width * 0.5 * pulse * B.k;
  const nx = -(B.y - A.y), ny = (B.x - A.x);
  const L = Math.hypot(nx, ny) || 1;
  const ux = nx / L, uy = ny / L;
  const quad = (sa, sb, col, al) => {
    ctx.globalAlpha = al;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(A.x + ux*sa, A.y + uy*sa); ctx.lineTo(B.x + ux*sb, B.y + uy*sb);
    ctx.lineTo(B.x - ux*sb, B.y - uy*sb); ctx.lineTo(A.x - ux*sa, A.y - uy*sa);
    ctx.closePath(); ctx.fill();
  };
  quad(wA, wB, E.color, 0.6);
  quad(wA * 0.44, wB * 0.44, E.glow, 0.75);
  quad(wA * 0.16, wB * 0.16, '#FFFFFF', 0.85);
  ctx.globalAlpha = 1;
  drawGlow(A.x, A.y, 30 * A.k, E.glow, 0.9);
  drawGlow(B.x, B.y, 44 * B.k * pulse, E.glow, 1);
  drawGlow(B.x, B.y, 20 * B.k * pulse, '#FFFFFF', 0.9);
  ctx.restore();
}

/* --- particles & floating numbers, both billboarded ---------------------- */
function drawParticles(){
  const pool = Particles.pool;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of pool){
    if (!p.live || !p.add) continue;
    const k = p.life / p.max;
    const gy = p.gy === undefined ? p.y : p.gy;
    const q = CAM.project(p.x, gy, Math.max(0, gy - p.y));
    ctx.globalAlpha = clamp(k, 0, 1);
    if (p.kind === 'spark'){
      ctx.strokeStyle = p.col; ctx.lineWidth = p.size * k * q.k;
      ctx.beginPath();
      ctx.moveTo(q.x, q.y);
      ctx.lineTo(q.x - p.vx * 0.014 * p.w * q.k, q.y - p.vy * 0.014 * p.w * q.k);
      ctx.stroke();
    } else {
      ctx.fillStyle = p.col; circ(q.x, q.y, p.size * k * q.k); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  const smoke = Assets.get('fx_smoke');
  for (const p of pool){
    if (!p.live || p.add) continue;
    const k = p.life / p.max;
    const gy = p.gy === undefined ? p.y : p.gy;
    const q = CAM.project(p.x, gy, Math.max(0, gy - p.y));
    if (p.kind === 'shard'){
      ctx.save();
      ctx.globalAlpha = clamp(k * 1.4, 0, 1);
      ctx.translate(q.x, q.y); ctx.rotate(p.rot); ctx.scale(q.k, q.k);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.7);
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.6;
      ctx.strokeRect(-p.size/2, -p.size/2, p.size, p.size * 0.7);
      ctx.restore();
    } else if (p.kind === 'smoke'){
      const r = p.size * (1.6 - k * 0.6) * q.k;
      ctx.globalAlpha = clamp(k * 0.7, 0, 1);
      if (smoke) ctx.drawImage(smoke, q.x - r, q.y - r, r * 2, r * 2);
      else { ctx.fillStyle = p.col; circ(q.x, q.y, r); ctx.fill(); }
    } else {
      ctx.globalAlpha = clamp(k, 0, 1);
      ctx.fillStyle = p.col; circ(q.x, q.y, p.size * k * q.k); ctx.fill();
    }
  }
  ctx.restore();
}

function drawNums(){
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.lineJoin = 'round';
  let lastPx = -1;
  for (const n of S.nums){
    const k = n.t / n.life;
    const pop = n.crit ? (1 + Math.max(0, 0.5 - k * 4)) : 1;
    const gy = n.gy === undefined ? n.y : n.gy;
    const q = CAM.project(n.x, gy, Math.max(0, gy - n.y) + 40);
    ctx.globalAlpha = k < 0.7 ? 1 : (1 - (k - 0.7) / 0.3);
    const px = Math.max(8, Math.round(n.size * pop * q.k));
    if (px !== lastPx){ setFont(px, 800, true); lastPx = px; }
    // §2.9 — crit numbers are yellow with a bang
    const txt = n.crit ? n.text + '!!' : n.text;
    ctx.strokeStyle = PAL.ink; ctx.strokeText(txt, q.x, q.y);
    ctx.fillStyle = n.crit ? PAL.crit : n.col;
    ctx.fillText(txt, q.x, q.y);
  }
  ctx.restore();
}


/* ---------------------------------------------------------------------------
   HUD — brass gauge plate over the dark base (§4.7)
--------------------------------------------------------------------------- */
/* Derived from the viewport, then multiplied by the player's own preference.
   Deriving it alone is not enough: 1366x768 is a common laptop panel and the
   HUD it produces is legible at arm's length and not from a sofa. */
function hudScale(){
  const fit = clamp(Math.min(View.w / 1400, View.h / 860), 0.6, 1.4);
  return fit * (Settings.get('hudScale') || 1);
}

function brassPanel(x, y, w, h, r, alpha){
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  rr(x, y, w, h, r);
  ctx.fillStyle = 'rgba(20,18,27,0.92)'; ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 5; ctx.stroke();
  rr(x + 3, y + 3, w - 6, h - 6, Math.max(2, r - 3));
  ctx.strokeStyle = hexToRgba(PAL.brass, 0.85); ctx.lineWidth = 2.2; ctx.stroke();
  ctx.fillStyle = PAL.brass;
  const pd = 9;
  for (const p of [[x+pd,y+pd],[x+w-pd,y+pd],[x+pd,y+h-pd],[x+w-pd,y+h-pd]]){
    ctx.beginPath(); ctx.arc(p[0], p[1], 2.6, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function gaugeRing(cx, cy, r, col, teeth){
  const asset = Assets.get('ui_gauge');
  if (asset){ ctx.drawImage(asset, cx - r * 1.22, cy - r * 1.22, r * 2.44, r * 2.44); return; }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = col; ctx.lineWidth = 2.6;
  circ(0, 0, r * 1.1); ctx.stroke();
  ctx.lineWidth = 2;
  for (let i = 0; i < (teeth || 16); i++){
    const a = i / (teeth || 16) * TAU;
    const l = i % 4 === 0 ? 0.2 : 0.11;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 1.1, Math.sin(a) * r * 1.1);
    ctx.lineTo(Math.cos(a) * r * (1.1 + l), Math.sin(a) * r * (1.1 + l));
    ctx.stroke();
  }
  ctx.restore();
}

const SKILL_ICON_ASSET = {
  CLOSEHIT:'ui_icon_slash', LINE_BURST:'ui_icon_hook', CONE:'ui_icon_cone',
  RANGED_AOE:'ui_icon_aoe', CHAIN:'ui_icon_ult', RAY:'ui_icon_turret',
  AURA:'ui_icon_field', PULSE:'ui_icon_pulse', SENTRY:'ui_icon_sentry',
};
function paintGlyph(shape, r, col, glow){
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.shadowColor = glow; ctx.shadowBlur = 12;
  if (shape === 'CLOSEHIT'){
    ctx.lineWidth = r * 0.30;
    ctx.beginPath(); ctx.arc(-r*0.35, 0, r * 0.82, -1.15, 1.15); ctx.stroke();
    ctx.strokeStyle = glow; ctx.lineWidth = r * 0.15;
    ctx.beginPath(); ctx.arc(-r*0.35, 0, r * 0.82, -0.95, 0.95); ctx.stroke();
  } else if (shape === 'LINE_BURST'){
    ctx.lineWidth = r * 0.28;
    ctx.beginPath(); ctx.moveTo(-r*0.9, 0); ctx.lineTo(r*0.42, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.92, 0); ctx.lineTo(r*0.30, -r*0.46); ctx.lineTo(r*0.30, r*0.46);
    ctx.closePath(); ctx.fill();
  } else if (shape === 'CONE'){
    ctx.beginPath(); ctx.moveTo(-r*0.85, 0); ctx.arc(-r*0.85, 0, r * 1.6, -0.6, 0.6);
    ctx.closePath(); ctx.globalAlpha = 0.4; ctx.fill();
    ctx.globalAlpha = 1; ctx.lineWidth = r * 0.16; ctx.stroke();
  } else if (shape === 'RANGED_AOE'){
    ctx.lineWidth = r * 0.19;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.76, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.32; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = glow; ctx.lineWidth = r * 0.16;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0, TAU); ctx.stroke();
  } else if (shape === 'CHAIN'){
    ctx.lineWidth = r * 0.2;
    ctx.beginPath();
    ctx.moveTo(-r*0.95, r*0.4); ctx.lineTo(-r*0.25, -r*0.5);
    ctx.lineTo(r*0.15, r*0.25); ctx.lineTo(r*0.95, -r*0.55);
    ctx.stroke();
    ctx.strokeStyle = glow; ctx.lineWidth = r * 0.08; ctx.stroke();
  } else if (shape === 'AURA'){
    // a field: concentric rings, nothing pointed — it has no direction
    ctx.lineWidth = r * 0.15;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.92, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.30;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.92, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = glow; ctx.lineWidth = r * 0.11;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.56, 0, TAU); ctx.stroke();
    ctx.fillStyle = glow; circ(0, 0, r * 0.16); ctx.fill();
  } else if (shape === 'PULSE'){
    // a detonation: a filled core throwing three expanding arcs outward
    ctx.fillStyle = col; circ(0, 0, r * 0.30); ctx.fill();
    ctx.lineWidth = r * 0.13;
    for (let i = 0; i < 3; i++){
      ctx.globalAlpha = 0.85 - i * 0.22;
      ctx.beginPath(); ctx.arc(0, 0, r * (0.52 + i * 0.22), -0.85, 0.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, r * (0.52 + i * 0.22), Math.PI - 0.85, Math.PI + 0.85); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (shape === 'SENTRY'){
    // a planted gun: a base, a post and a barrel that clearly points
    ctx.lineWidth = r * 0.17;
    ctx.beginPath(); ctx.moveTo(-r*0.62, r*0.72); ctx.lineTo(r*0.62, r*0.72); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r*0.34, r*0.72); ctx.lineTo(0, r*0.06);
    ctx.lineTo(r*0.34, r*0.72); ctx.stroke();
    ctx.fillStyle = col; circ(0, -r*0.10, r * 0.30); ctx.fill();
    ctx.strokeStyle = glow; ctx.lineWidth = r * 0.20;
    ctx.beginPath(); ctx.moveTo(0, -r*0.10); ctx.lineTo(r*0.92, -r*0.40); ctx.stroke();
  } else {
    // RAY — a sustained beam: a wide soft body with a bright core and an emitter
    ctx.globalAlpha = 0.5; ctx.lineWidth = r * 0.42;
    ctx.beginPath(); ctx.moveTo(-r*0.8, 0); ctx.lineTo(r*0.95, 0); ctx.stroke();
    ctx.globalAlpha = 1; ctx.strokeStyle = glow; ctx.lineWidth = r * 0.16;
    ctx.beginPath(); ctx.moveTo(-r*0.8, 0); ctx.lineTo(r*0.95, 0); ctx.stroke();
    ctx.fillStyle = col; circ(-r*0.82, 0, r * 0.26); ctx.fill();
  }
}
function drawShapeGlyph(shape, cx, cy, r, col, glow){
  const a = Assets.get(SKILL_ICON_ASSET[shape]);
  if (a){ ctx.drawImage(a, cx - r * 1.5, cy - r * 1.5, r * 3, r * 3); return; }
  r = Math.max(1, Math.round(r));
  const half = Math.ceil(r * 1.9 + 18);
  const cn = cachedSprite('g|'+shape+'|'+r+'|'+col, half*2, half*2, (c2, w, h) => {
    c2.translate(w/2, h/2);
    paintGlyph(shape, r, col, glow);
  });
  ctx.drawImage(cn, cx - half, cy - half);
}

/* Read through bindLabel every time rather than captured once: a rebind has
   to reach the HUD, and a constant computed at load never will. */
const SLOT_KEYS = new Proxy({}, { get: (_, i) => bindLabel(BINDS[Number(i)]) });
const SLOT_UNLOCK_WAVE = [1, 1, 3, 6];

/* The auto-attack has no key, but it still needs to be legible: you should be
   able to see it swinging and know it is doing work without a slot of its own. */
function drawAutoPip(x, y, size){
  const AA = FEEL.autoAttack;
  const B = S.basic;
  if (!AA && !B) return;
  const P = S.player, r = size * 0.34;
  // v6: the basic is a real skill, so the pip shows that skill — its glyph, its
  // element colour, its actual cooldown. The player asked what their auto-attack
  // was; the HUD should answer without them having to guess.
  if (B){
    const E = ELEMENTS[B.element], st = skillStats(B);
    ctx.save();
    ctx.translate(x, y);
    circ(0, 0, r); ctx.fillStyle = PAL.base; ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4; ctx.stroke();
    gaugeRing(0, 0, r, hexToRgba(PAL.brass, 0.55), 12);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    drawGlow(0, 0, r * 1.5, E.color, P.atkTarget ? 0.26 : 0.12);
    ctx.restore();
    drawShapeGlyph(B.shape, 0, -1, r * 0.82, E.color, E.glow);
    const frac = clamp(B.cdLeft / Math.max(0.001, st.cd), 0, 1);
    if (frac > 0){
      ctx.save(); circ(0, 0, r - 2); ctx.clip();
      ctx.globalAlpha = 0.7; ctx.fillStyle = '#0B0910';
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.arc(0, 0, r * 2, -Math.PI/2, -Math.PI/2 + TAU * frac);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    if (P.atkSwing > 0){
      ctx.globalAlpha = P.atkSwing / 0.18;
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3;
      circ(0, 0, r + 5); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    const hs = size / 78;
    setFont(Math.round(9.5 * hs), 800, true);
    textOut('AUTO', 0, r + 12 * hs, P.atkTarget ? PAL.bone : '#6E667A');
    setFont(Math.round(8.5 * hs), 700, true);
    textOut(skillName(B).toUpperCase(), 0, r + 24 * hs, hexToRgba(E.color, 0.85));
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.translate(x, y);
  circ(0, 0, r); ctx.fillStyle = PAL.base; ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4; ctx.stroke();
  gaugeRing(0, 0, r, hexToRgba(PAL.brass, 0.55), 12);
  // sabre glyph
  ctx.strokeStyle = P.atkTarget ? '#E8E2D2' : '#6E667A';
  ctx.lineWidth = r * 0.20; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-r*0.30, 0, r*0.72, -1.1, 1.1); ctx.stroke();
  // cadence sweep
  const frac = clamp(P.atkCd / AA.cd, 0, 1);
  if (frac > 0){
    ctx.save(); circ(0, 0, r - 2); ctx.clip();
    ctx.globalAlpha = 0.7; ctx.fillStyle = '#0B0910';
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.arc(0, 0, r * 2, -Math.PI/2, -Math.PI/2 + TAU * frac);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  if (P.atkSwing > 0){
    ctx.globalAlpha = P.atkSwing / 0.18;
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3;
    circ(0, 0, r + 5); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  setFont(Math.round(9.5 * (size/78)), 800, true);
  textOut('AUTO', 0, r + 12 * (size/78), P.atkTarget ? PAL.bone : '#6E667A');
  ctx.restore();
}

function drawSkillBar(){
  const HS = hudScale();
  const size = 78 * HS, gap = 14 * HS;
  const total = size * 4 + gap * 3;
  const x0 = (View.w - total) / 2;
  const y0 = View.h - size - 46 * HS;

  drawAutoPip(x0 - 48 * HS, y0 + size * 0.5, size);
  const frame = Assets.get('ui_frame');
  if (frame) ctx.drawImage(frame, x0 - 40*HS, y0 - 26*HS, total + 80*HS, size + 72*HS);
  else brassPanel(x0 - 16*HS, y0 - 14*HS, total + 32*HS, size + 46*HS, 12*HS, 0.94);

  for (let i = 0; i < 4; i++){
    const x = x0 + i * (size + gap), y = y0;
    const sk = S.slots[i];
    const locked = i >= S.unlockedSlots;
    ctx.save();
    ctx.translate(x + size/2, y + size/2);
    circ(0, 0, size * 0.46);
    ctx.fillStyle = locked ? 'rgba(13,11,18,0.95)' : PAL.base;
    fillStroke(null, PAL.ink, 5);
    ctx.fillStyle = locked ? 'rgba(13,11,18,0.95)' : PAL.base; ctx.fill();
    gaugeRing(0, 0, size * 0.46, locked ? '#3A3440' : hexToRgba(PAL.brass, 0.9), 16);

    const passive = sk && SHAPES[sk.shape].passive;
    if (locked){
      ctx.strokeStyle = '#4A4450'; ctx.lineWidth = 4;
      rr(-size*0.16, -size*0.05, size*0.32, size*0.24, 4); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -size*0.05, size*0.12, Math.PI, 0); ctx.stroke();
      setFont(Math.round(12*HS), 700, true);
      textOut('WAVE ' + SLOT_UNLOCK_WAVE[i], 0, size*0.32, '#6E667A');
    } else if (!sk){
      setFont(Math.round(13*HS), 700, true);
      textOut('EMPTY', 0, 0, '#5E5668');
    } else {
      const E = ELEMENTS[sk.element], st = skillStats(sk);
      if (passive){
        // a steady ring instead of a keycap: nothing here is waiting on you
        gaugeRing(0, 0, size * 0.40, hexToRgba(E.color, 0.5), 10);
        setFont(Math.round(8.5*HS), 800, true);
        textOut('AUTO', 0, size * 0.30, hexToRgba(E.color, 0.85));
      }
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      drawGlow(0, 0, size * 0.5, E.color, 0.22);
      ctx.restore();
      drawShapeGlyph(sk.shape, 0, -2*HS, size * 0.28, E.color, E.glow);
      if (sk.cdLeft > 0){
        const frac = clamp(sk.cdLeft / Math.max(0.001, st.cd), 0, 1);
        ctx.save();
        circ(0, 0, size * 0.45); ctx.clip();
        ctx.globalAlpha = 0.76; ctx.fillStyle = '#0B0910';
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, size, -Math.PI/2, -Math.PI/2 + TAU * frac);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        setFont(Math.round(19*HS), 800, true);
        textOut(sk.cdLeft.toFixed(1), 0, -2*HS, PAL.bone, PAL.ink, 4);
      }
      if (S.player.ray && S.player.ray.slot === i){
        const kk = 1 - S.player.ray.t / st.maxDur;
        ctx.strokeStyle = E.glow; ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.46, -Math.PI/2, -Math.PI/2 + TAU * clamp(kk, 0, 1));
        ctx.stroke();
      }
      if (sk.readyPulse > 0){
        const kk = sk.readyPulse / 0.35;
        ctx.save();
        ctx.globalAlpha = kk * 0.9;
        ctx.strokeStyle = PAL.teal; ctx.lineWidth = 2 + 6 * kk;
        circ(0, 0, size * 0.46 + kk * 12); ctx.stroke();
        ctx.restore();
      }
      if (slotHeld(i) && sk.cdLeft <= 0){
        ctx.strokeStyle = E.glow; ctx.lineWidth = 3;
        circ(0, 0, size * 0.42); ctx.stroke();
      }
      // The element's motif, on the ring, four times. Four coloured rings are
      // four colours; four silhouettes are a vocabulary, and it is the same one
      // the cards and the ground areas use.
      for (let m = 0; m < 4; m++){
        const a = m / 4 * TAU - Math.PI / 4;
        elementMotif(sk.element, Math.cos(a) * size * 0.52, Math.sin(a) * size * 0.52,
                     3.6 * HS, E.color, true);
      }
      setFont(Math.round(11.5*HS), 700, true);
      textOut(skillName(sk).toUpperCase(), 0, size/2 + 14*HS, E.color, PAL.ink, 3.5);
    }
    setFont(Math.round(11*HS), 800, true);
    const kw = ctx.measureText(SLOT_KEYS[i]).width + 12*HS;
    rr(-kw/2, -size/2 - 12*HS, kw, 16*HS, 4*HS);
    ctx.fillStyle = PAL.ink; ctx.fill();
    ctx.strokeStyle = locked ? '#4A4450' : PAL.brass; ctx.lineWidth = 1.8; ctx.stroke();
    textOut(SLOT_KEYS[i], 0, -size/2 - 4*HS, locked ? '#6E667A' : PAL.bone);
    ctx.restore();
  }
}

function drawHealthPanel(){
  const HS = hudScale();
  const w = 262 * HS, h = 84 * HS;
  const x = 20 * HS, y = View.h - h - 20 * HS;
  brassPanel(x, y, w, h, 10*HS, 0.94);
  const P = S.player;

  const port = Assets.get('ui_portrait');
  const pr = 26 * HS;
  ctx.save();
  circ(x + 16*HS + pr, y + h/2, pr); ctx.clip();
  if (port) ctx.drawImage(port, x + 16*HS, y + h/2 - pr, pr*2, pr*2);
  else {
    ctx.fillStyle = '#241F2E'; ctx.fillRect(x + 16*HS, y + h/2 - pr, pr*2, pr*2);
    withCtxNone(() => {});
    ctx.save();
    ctx.translate(x + 16*HS + pr, y + h/2 + pr * 1.5);
    ctx.scale(pr / 62, pr / 62);
    ctx.lineJoin = 'round';
    paintHero(false, false);
    ctx.restore();
  }
  ctx.restore();
  ctx.strokeStyle = PAL.brass; ctx.lineWidth = 2.4;
  circ(x + 16*HS + pr, y + h/2, pr); ctx.stroke();

  const bx = x + 16*HS + pr*2 + 12*HS, bw = w - (bx - x) - 16*HS;
  const frac = clamp(P.hp / P.maxHp, 0, 1);
  const by = y + 22*HS, bh = 20*HS;
  rr(bx, by, bw, bh, 4*HS);
  ctx.fillStyle = '#0B0910'; ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3; ctx.stroke();
  const g = ctx.createLinearGradient(bx, by, bx, by + bh);
  g.addColorStop(0, frac > 0.3 ? '#E8542E' : '#FF7A5A');
  g.addColorStop(1, frac > 0.3 ? '#8B2418' : '#B0301A');
  rr(bx + 1, by + 1, Math.max(0, (bw - 2) * frac), bh - 2, 3*HS);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = hexToRgba(PAL.ink, 0.5); ctx.lineWidth = 2;
  const segs = Math.max(1, Math.round(P.maxHp / 20));
  for (let i = 1; i < segs; i++){
    const sx = bx + bw * (i / segs);
    ctx.beginPath(); ctx.moveTo(sx, by + 2); ctx.lineTo(sx, by + bh - 2); ctx.stroke();
  }
  setFont(Math.round(12*HS), 700, true);
  textOut('CAPTAIN', bx, y + 12*HS, '#8B8296', null, 0, 'left');
  setFont(Math.round(14*HS), 800, true);
  textOut(Math.ceil(P.hp) + ' / ' + Math.round(P.maxHp), bx + bw, y + 12*HS, PAL.bone, PAL.ink, 3, 'right');

  const py = y + h - 18*HS;
  setFont(Math.round(11*HS), 700, true);
  textOut('DASH [' + bindLabel('dash') + ']', bx, py, '#8B8296', null, 0, 'left');
  for (let i = 0; i < S.mods.dashCharges; i++){
    const px = bx + 62*HS + i * 22*HS;
    const filled = i < P.dashStock;
    ctx.beginPath(); ctx.arc(px, py, 7*HS, 0, TAU);
    ctx.fillStyle = filled ? PAL.teal : '#201C28'; ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 2.4; ctx.stroke();
    if (!filled && i === P.dashStock && P.dashCd > 0){
      const kk = 1 - clamp(P.dashCd / dashCdMax(), 0, 1);
      ctx.beginPath(); ctx.moveTo(px, py);
      ctx.arc(px, py, 7*HS, -Math.PI/2, -Math.PI/2 + TAU * kk); ctx.closePath();
      ctx.fillStyle = hexToRgba(PAL.teal, 0.45); ctx.fill();
    }
  }
}

/* One line, low on the screen, above the ability bar and out of the fight.
   Deliberately not a panel in the corner: a corner is where a player who is
   busy will never look, and this only ever appears at a moment when they are
   busy. It fades in fast and out slowly, and never covers the deck. */
function drawHints(){
  const L = Hints.live;
  if (!L) return;
  const H = HINTS[L.id];
  if (!H) return;
  const HS = hudScale();
  const inA = clamp(L.t / 0.22, 0, 1);
  const outA = clamp((L.hold - L.t) / 0.6, 0, 1);
  const a = Math.min(inA, outA);
  if (a <= 0) return;

  ctx.save();
  ctx.globalAlpha = a;
  setFont(Math.round(15.5*HS), 700, false);
  const tw = ctx.measureText(H.text).width;
  let kw = 0;
  if (H.key){
    setFont(Math.round(13*HS), 800, true);
    kw = ctx.measureText(H.key).width + 26*HS;
  }
  const pw = tw + kw + 44*HS, ph = 42*HS;
  const px = View.w/2 - pw/2, py = View.h - 152*HS;

  // The teal left edge is the same mark the tutorial prompts always use, so a
  // second one is recognisable as "the game explaining itself" and not as a
  // new piece of HUD.
  ctx.fillStyle = PAL.teal;
  rr(px, py + 7*HS, 3.5*HS, ph - 14*HS, 2*HS); ctx.fill();

function drawFps(){
  const b = S.ftBuf, n = Math.min(S.ftIdx, b.length);
  if (n < 4) return;
  let sum = 0, worst = 0;
  for (let i = 0; i < n; i++){ sum += b[i]; if (b[i] > worst) worst = b[i]; }
  const avg = sum / n;
  let live = 0, parts = 0;
  for (const e of S.enemies) if (!e.dead) live++;
  for (const p of Particles.pool) if (p.live) parts++;
  const HS = hudScale();
  ctx.save();
  const lines = [
    Math.round(1/avg) + ' fps   ' + (avg*1000).toFixed(1) + ' ms   peak ' + (worst*1000).toFixed(0) + ' ms',
    live + ' boarders   ' + parts + ' particles   art ' + Assets.set + ' · ' + Assets.ready + '/' + Assets.total,
    PRESET.name + '   pitch ' + CAM.pitch.toFixed(2) + '   ' +
      (CAM.follow ? 'follow' : 'fixed') + (PRESET.xray ? '   xray' : ''),
  ];
  setFont(Math.round(13*HS), 700, false);
  const w = Math.max(ctx.measureText(lines[0]).width, ctx.measureText(lines[1]).width) + 22*HS;
  brassPanel(View.w - w - 16*HS, 16*HS, w, 68*HS, 7*HS, 0.92);
  const cols = [1/avg > 55 ? PAL.teal : PAL.dangerIn, '#9C93A8', PAL.brass];
  lines.forEach((l, i) => textOut(l, View.w - w - 5*HS, 30*HS + i * 19*HS,
                                  cols[i], null, 0, 'left'));
  ctx.restore();
}

/* With a moving camera the Boiler can drift to the edge of frame. It is the
   thing you lose the run by ignoring, so it gets a persistent marker: a health
   pip on screen when visible, an arrow pinned to the edge when it is not. */
function drawObjectiveMarker(){
  if (!CAM.follow || !S.boiler) return;
  const B = S.boiler;
  const p = CAM.project(B.x, B.y, 150);
  const HS = hudScale();
  const m = 74 * HS;
  const onScreen = p.x > m && p.x < View.w - m && p.y > m * 1.4 && p.y < View.h - m;
  const frac = clamp(B.hp / B.maxHp, 0, 1);
  const hurt = frac < 0.5;

  ctx.save();
  if (onScreen){
    // a slim pip above the Boiler, only once it has taken a hit
    if (frac >= 0.999){ ctx.restore(); return; }
    const w = 74 * HS, h = 7 * HS;
    ctx.globalAlpha = 0.9;
    rr(p.x - w/2 - 2, p.y - 2, w + 4, h + 4, 3);
    ctx.fillStyle = 'rgba(13,11,18,0.85)'; ctx.fill();
    ctx.fillStyle = hurt ? PAL.danger : PAL.fire;
    rr(p.x - w/2, p.y, w * frac, h, 2); ctx.fill();
    ctx.restore();
    return;
  }
  // off frame: clamp to the edge and point at it
  const cx = View.w / 2, cy = View.h / 2;
  let dx = p.x - cx, dy = p.y - cy;
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  const ex = clamp(cx + dx * View.w, m, View.w - m);
  const ey = clamp(cy + dy * View.h, m * 1.4, View.h - m);
  const pulse = 0.72 + Math.sin(S.rt * (hurt ? 9 : 4)) * 0.24;
  ctx.globalAlpha = pulse;
  ctx.translate(ex, ey);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(0, 0, 44 * HS, hurt ? PAL.danger : PAL.fire, 0.55);
  ctx.globalCompositeOperation = 'source-over';
  ctx.rotate(Math.atan2(dy, dx));
  ctx.beginPath();
  ctx.moveTo(20 * HS, 0); ctx.lineTo(-8 * HS, -14 * HS); ctx.lineTo(-2 * HS, 0);
  ctx.lineTo(-8 * HS, 14 * HS); ctx.closePath();
  fillStroke(hurt ? PAL.danger : PAL.fire, PAL.ink, 4);
  ctx.rotate(-Math.atan2(dy, dx));
  setFont(Math.round(11 * HS), 800, true);
  textOut('BOILER ' + Math.round(frac * 100) + '%', 0, 28 * HS,
          hurt ? PAL.danger : PAL.bone, PAL.ink, 4);
  ctx.restore();
}

/* ============================================================================
   WIDGETS — an immediate-mode layer for the screens that have controls
   ----------------------------------------------------------------------------
   Everything before v10 was a screen you dismissed with any key, so there was
   nothing to click and no need for this. v10 has a results screen, a pause
   menu, a settings panel and a key rebinder, and those need buttons that can
   be hovered, clicked, focused and reached from the keyboard.

   Immediate mode rather than retained: a widget is a function call inside the
   draw pass, identified by where it is on screen. There is no widget tree to
   keep in step with game state, which is the whole class of bug this avoids —
   a menu can never show a stale value because there is nowhere to cache one.

   Keyboard focus is the one piece of state that has to persist between frames,
   because "which control is selected" is not derivable from the mouse. It is
   stored per screen id and reset when the screen changes, so opening settings
   and coming back does not land you on a control you cannot see.
============================================================================ */
const UI = {
  screen: null,        // id of the screen currently drawing
  focus: 0,            // index of the keyboard-focused control on this screen
  count: 0,            // controls drawn so far this frame
  lastCount: 0,        // how many the previous frame had, for wrapping
  hot: -1,             // index the mouse is over
  activated: -1,       // index activated this frame (click or Enter)
  usingKeys: false,    // hides the focus ring until the keyboard is used
  _hoverWas: -1,

  /* Call once at the top of a screen's draw. Changing screens resets focus. */
  begin(id){
    if (this.screen !== id){ this.screen = id; this.focus = 0; this.usingKeys = false; }
    this.count = 0;
    this.hot = -1;
    this.activated = -1;
    // Arrow keys and Tab move focus; Enter and Space fire it. Mouse users never
    // see any of this because the ring only appears once a key has been used.
    const dn = keyHit('arrowdown') || keyHit('s') || (keyHit('tab') && !keyDown('shift'));
    const up = keyHit('arrowup')   || keyHit('w') || (keyHit('tab') &&  keyDown('shift'));
    if (dn || up){
      this.usingKeys = true;
      const n = Math.max(1, this.lastCount);
      this.focus = ((this.focus + (dn ? 1 : -1)) % n + n) % n;
      SFX.uiHover();
    }
    this._fire = keyHit('enter') || keyHit(' ') || keyHit('space');
    this._left = keyHit('arrowleft') || keyHit('a');
    this._right = keyHit('arrowright') || keyHit('d');
  },
  end(){
    this.lastCount = this.count;
    if (this.hot !== this._hoverWas){
      if (this.hot >= 0) SFX.uiHover();
      this._hoverWas = this.hot;
    }
  },
  /* Reserve an index without drawing anything — used by controls that draw
     themselves, like the volume rows. */
  next(){ return this.count++; },

  inside(r){
    return Input.mouse.sx >= r.x && Input.mouse.sx <= r.x + r.w &&
           Input.mouse.sy >= r.y && Input.mouse.sy <= r.y + r.h;
  },
  /* Returns { hover, focused, fired } for a rect. `fired` is true on the frame
     the control is activated by either device. */
  probe(r){
    const i = this.count++;
    const hover = this.inside(r);
    if (hover){
      this.hot = i;
      // Moving the mouse takes focus back from the keyboard, so Enter always
      // fires whatever is visibly highlighted.
      if (Input.mouse.sx !== this._mx || Input.mouse.sy !== this._my){
        this.focus = i; this.usingKeys = false;
      }
    }
    const focused = this.focus === i;
    const fired = (hover && Input.clicked) || (focused && this.usingKeys && this._fire);
    if (fired) this.activated = i;
    return { i, hover, focused, fired };
  },
  frameEnd(){ this._mx = Input.mouse.sx; this._my = Input.mouse.sy; },
};

/* A button. `kind` picks the weight: 'primary' is the one thing the screen
   wants you to do, and there is never more than one on a screen. */
function uiButton(x, y, w, h, label, kind, opt){
  opt = opt || {};
  const HS = hudScale();
  const st = UI.probe({ x, y, w, h });
  const primary = kind === 'primary';
  const disabled = !!opt.disabled;
  const lit = (st.hover || (st.focused && UI.usingKeys)) && !disabled;

  const edge = disabled ? '#4A4655' : primary ? PAL.crit : PAL.brass;
  const fill = primary ? (lit ? '#3A2E14' : '#241D0F') : (lit ? '#241F30' : '#171522');

  ctx.save();
  if (lit){ ctx.shadowColor = edge; ctx.shadowBlur = 18; }
  rr(x, y, w, h, 9 * HS);
  ctx.fillStyle = fill; ctx.fill();
  ctx.restore();
  rr(x, y, w, h, 9 * HS);
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4 * HS; ctx.stroke();
  rr(x + 3 * HS, y + 3 * HS, w - 6 * HS, h - 6 * HS, 7 * HS);
  ctx.strokeStyle = edge; ctx.lineWidth = (primary ? 2.6 : 2) * HS; ctx.stroke();

  setFont(Math.round((primary ? 20 : 17) * HS), primary ? 900 : 800, true);
  textOut(label, x + w / 2, y + h / 2,
          disabled ? '#6A6478' : primary ? PAL.crit : PAL.bone, PAL.ink, 4 * HS);
  if (opt.hint){
    setFont(Math.round(11 * HS), 700, false);
    textOut(opt.hint, x + w / 2, y + h - 9 * HS, '#7E778C');
  }
  if (st.fired && !disabled) SFX.uiClick();
  return st.fired && !disabled;
}

/* A labelled row that steps through a list of choices with < >. Used for every
   setting that is not a volume: VFX level, HUD scale, reduced motion. Discrete
   steps rather than a slider because they are the values worth having and a
   slider invites hunting for a value that does not exist. */
function uiChoice(x, y, w, label, values, current, onPick){
  const HS = hudScale();
  const h = 34 * HS;
  const st = UI.probe({ x, y, w, h });
  const lit = st.hover || (st.focused && UI.usingKeys);
  let idx = Math.max(0, values.findIndex(v => v.value === current));

  setFont(Math.round(14.5 * HS), 700, false);
  textOut(label, x, y + h / 2, lit ? PAL.bone : '#A79EB4', null, 0, 'left');

  const bw = 26 * HS, vx = x + w - 190 * HS;
  const step = (d) => {
    const n = (idx + d + values.length) % values.length;
    onPick(values[n].value);
    SFX.uiClick();
  };
  // The arrows are their own hit targets; the row itself cycles forward, so a
  // click anywhere on it still does the obvious thing. Drawn as triangles
  // rather than typed as < > — the condensed display face renders those as
  // something much closer to brackets.
  const lHit = { x: vx - bw, y, w: bw, h }, rHit = { x: x + w - bw, y, w: bw, h };
  const arrow = (cx, dir) => {
    const s2 = 5 * HS;
    ctx.fillStyle = lit ? PAL.teal : '#6E667A';
    ctx.beginPath();
    ctx.moveTo(cx + dir * s2, y + h / 2 - s2);
    ctx.lineTo(cx + dir * s2, y + h / 2 + s2);
    ctx.lineTo(cx - dir * s2 * 0.9, y + h / 2);
    ctx.closePath(); ctx.fill();
  };
  arrow(lHit.x + bw / 2, 1);
  arrow(rHit.x + bw / 2, -1);
  setFont(Math.round(15 * HS), 800, true);
  textOut(values[idx].label, (vx + x + w - bw) / 2, y + h / 2, PAL.teal, PAL.ink, 3 * HS);

  if (st.hover && Input.clicked) step(UI.inside(lHit) ? -1 : 1);
  else if (st.focused && UI.usingKeys){
    if (UI._left) step(-1);
    else if (UI._right || UI._fire) step(1);
  }
  return h;
}

/* A volume row: a bar you can click or drag, with the percentage beside it.
   Dragging matters — setting a mix by clicking one point at a time is how you
   end up never touching it. */
function uiSlider(x, y, w, label, value, onSet){
  const HS = hudScale();
  const h = 34 * HS;
  const st = UI.probe({ x, y, w, h });
  const lit = st.hover || (st.focused && UI.usingKeys);

  setFont(Math.round(14.5 * HS), 700, false);
  textOut(label, x, y + h / 2, lit ? PAL.bone : '#A79EB4', null, 0, 'left');

  const bx = x + w - 232 * HS, bw = 160 * HS, by = y + h / 2 - 5 * HS, bh = 10 * HS;
  rr(bx, by, bw, bh, bh / 2);
  ctx.fillStyle = '#100E17'; ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 2 * HS; ctx.stroke();
  rr(bx, by, Math.max(bh, bw * value), bh, bh / 2);
  ctx.fillStyle = lit ? PAL.teal : '#2E9E8A'; ctx.fill();
  circ(bx + bw * value, by + bh / 2, 7 * HS);
  ctx.fillStyle = PAL.bone; ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 2.4 * HS; ctx.stroke();

  setFont(Math.round(13 * HS), 800, true);
  textOut(Math.round(value * 100) + '%', x + w - 20 * HS, y + h / 2, PAL.bone, null, 0, 'right');

  // Held, not clicked: this is the drag.
  if (st.hover && Input.buttons[0]){
    onSet(clamp((Input.mouse.sx - bx) / bw, 0, 1));
  } else if (st.focused && UI.usingKeys){
    if (UI._left) onSet(clamp(value - 0.05, 0, 1));
    else if (UI._right) onSet(clamp(value + 0.05, 0, 1));
  }
  return h;
}

/* A checkbox row. */
function uiToggle(x, y, w, label, value, onSet){
  const HS = hudScale();
  const h = 34 * HS;
  const st = UI.probe({ x, y, w, h });
  const lit = st.hover || (st.focused && UI.usingKeys);
  setFont(Math.round(14.5 * HS), 700, false);
  textOut(label, x, y + h / 2, lit ? PAL.bone : '#A79EB4', null, 0, 'left');
  const bs = 20 * HS, bx = x + w - bs - 8 * HS, by = y + h / 2 - bs / 2;
  rr(bx, by, bs, bs, 5 * HS);
  ctx.fillStyle = '#100E17'; ctx.fill();
  ctx.strokeStyle = value ? PAL.teal : '#5A5366'; ctx.lineWidth = 2.4 * HS; ctx.stroke();
  if (value){
    ctx.strokeStyle = PAL.teal; ctx.lineWidth = 3 * HS; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bx + bs * 0.24, by + bs * 0.52);
    ctx.lineTo(bx + bs * 0.44, by + bs * 0.74);
    ctx.lineTo(bx + bs * 0.78, by + bs * 0.26);
    ctx.stroke();
  }
  if (st.fired){ onSet(!value); SFX.uiClick(); }
  return h;
}

/* Section heading inside a panel. Not a control — it takes no focus index. */
function uiHeading(x, y, w, text){
  const HS = hudScale();
  setFont(Math.round(12 * HS), 800, true);
  ctx.letterSpacing = '2px';
  textOut(text, x, y + 12 * HS, PAL.brass, null, 0, 'left');
  ctx.letterSpacing = '0px';
  ctx.strokeStyle = hexToRgba(PAL.brass, 0.28); ctx.lineWidth = 1.5 * HS;
  ctx.beginPath();
  ctx.moveTo(x + ctx.measureText(text).width + 14 * HS, y + 12 * HS);
  ctx.lineTo(x + w, y + 12 * HS);
  ctx.stroke();
  return 28 * HS;
}


/* ---------------------------------------------------------------------------
   SCREENS — draft, title, pause, endings
--------------------------------------------------------------------------- */
const CARD_ICON = {
  burnDmg:'flame', burnDur:'flame', slowAmt:'frost', brittle:'frost', stun:'bolt',
  knock:'steam', scald:'steam', hp:'heart', spd:'boot', dashcd:'dash', dashdmg:'dash',
  dashchg:'dash', crit:'crit', critx:'crit', scrap:'scrap', lifesteal:'scrap',
  boilerhp:'boiler', boilerdr:'boiler', fifth:'gear', residue:'burst', autofire:'burst',
  killboom:'burst',
};
function paintCardIcon(kind, r, col, glow){
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.shadowColor = glow || col; ctx.shadowBlur = 14;
  ctx.lineWidth = r * 0.22;
  if (kind === 'flame'){
    ctx.beginPath(); ctx.moveTo(0, -r);
    ctx.bezierCurveTo(r*0.85, -r*0.2, r*0.7, r*0.75, 0, r);
    ctx.bezierCurveTo(-r*0.7, r*0.75, -r*0.85, -r*0.2, 0, -r);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = PAL.fireCore;
    ctx.beginPath(); ctx.moveTo(0, -r*0.25);
    ctx.bezierCurveTo(r*0.42, r*0.1, r*0.34, r*0.62, 0, r*0.78);
    ctx.bezierCurveTo(-r*0.34, r*0.62, -r*0.42, r*0.1, 0, -r*0.25);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'frost'){
    for (let i = 0; i < 3; i++){
      const a = i / 3 * Math.PI;
      ctx.beginPath();
      ctx.moveTo(-Math.cos(a)*r, -Math.sin(a)*r);
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); ctx.stroke();
      for (const s of [-1, 1]){
        const bx = Math.cos(a)*r*s*0.62, by = Math.sin(a)*r*s*0.62;
        ctx.beginPath(); ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(a+0.9)*r*0.32*s, by + Math.sin(a+0.9)*r*0.32*s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx, by);
        ctx.lineTo(bx + Math.cos(a-0.9)*r*0.32*s, by + Math.sin(a-0.9)*r*0.32*s); ctx.stroke();
      }
    }
  } else if (kind === 'bolt'){
    ctx.beginPath();
    ctx.moveTo(r*0.28, -r); ctx.lineTo(-r*0.5, r*0.12); ctx.lineTo(-r*0.03, r*0.12);
    ctx.lineTo(-r*0.3, r); ctx.lineTo(r*0.55, -r*0.18); ctx.lineTo(r*0.07, -r*0.18);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'steam'){
    for (let i = 0; i < 3; i++){
      const yy = -r*0.5 + i * r*0.55;
      ctx.beginPath(); ctx.moveTo(-r*0.9, yy);
      ctx.bezierCurveTo(-r*0.3, yy - r*0.4, r*0.3, yy + r*0.4, r*0.9, yy); ctx.stroke();
    }
  } else if (kind === 'heart'){
    ctx.beginPath(); ctx.moveTo(0, r*0.85);
    ctx.bezierCurveTo(-r*1.35, -r*0.1, -r*0.5, -r*1.05, 0, -r*0.35);
    ctx.bezierCurveTo(r*0.5, -r*1.05, r*1.35, -r*0.1, 0, r*0.85);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'boot'){
    ctx.beginPath();
    ctx.moveTo(-r*0.35, -r*0.9); ctx.lineTo(r*0.2, -r*0.9); ctx.lineTo(r*0.2, r*0.15);
    ctx.lineTo(r, r*0.5); ctx.lineTo(r, r*0.85); ctx.lineTo(-r*0.6, r*0.85); ctx.lineTo(-r*0.6, -r*0.55);
    ctx.closePath(); ctx.fill();
  } else if (kind === 'dash'){
    for (let i = 0; i < 3; i++){
      const ox = -r*0.75 + i * r*0.7;
      ctx.globalAlpha = 0.35 + i * 0.32;
      ctx.beginPath();
      ctx.moveTo(ox - r*0.28, -r*0.62); ctx.lineTo(ox + r*0.34, 0); ctx.lineTo(ox - r*0.28, r*0.62);
      ctx.lineWidth = r * 0.26; ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (kind === 'crit'){
    ctx.beginPath();
    for (let i = 0; i < 10; i++){
      const a = i / 10 * TAU - Math.PI/2;
      const rr2 = i % 2 ? r * 0.42 : r;
      i ? ctx.lineTo(Math.cos(a)*rr2, Math.sin(a)*rr2) : ctx.moveTo(Math.cos(a)*rr2, Math.sin(a)*rr2);
    }
    ctx.closePath(); ctx.fill();
  } else if (kind === 'scrap' || kind === 'gear'){
    ctx.beginPath(); circ(0, 0, r*0.6); ctx.lineWidth = r*0.3; ctx.stroke();
    for (let i = 0; i < 8; i++){
      const a = i / 8 * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*0.72, Math.sin(a)*r*0.72);
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); ctx.lineWidth = r*0.24; ctx.stroke();
    }
    if (kind === 'scrap'){
      ctx.fillStyle = PAL.teal;
      ctx.fillRect(-r*0.4, -r*0.12, r*0.8, r*0.24);
      ctx.fillRect(-r*0.12, -r*0.4, r*0.24, r*0.8);
    }
  } else if (kind === 'boiler'){
    ctx.beginPath(); circ(0, 0, r*0.8); ctx.lineWidth = r*0.24; ctx.stroke();
    ctx.fillStyle = PAL.fireCore; circ(0, r*0.1, r*0.34); ctx.fill();
    ctx.strokeStyle = col; ctx.lineWidth = r*0.18;
    for (const s of [-1, 1]){
      ctx.beginPath(); ctx.moveTo(s*r*0.8, -r*0.5); ctx.lineTo(s*r*1.15, -r*0.5); ctx.stroke();
    }
  } else {
    for (let i = 0; i < 8; i++){
      const a = i / 8 * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*r*0.34, Math.sin(a)*r*0.34);
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); ctx.lineWidth = r*0.2; ctx.stroke();
    }
    ctx.beginPath(); circ(0, 0, r*0.26); ctx.fill();
  }
}
function drawCardIcon(kind, cx, cy, r, col, glow){
  r = Math.max(1, Math.round(r));
  const half = Math.ceil(r * 1.8 + 18);
  const cn = cachedSprite('i|'+kind+'|'+r+'|'+col, half*2, half*2, (c2, w, h) => {
    c2.translate(w/2, h/2);
    paintCardIcon(kind, r, col, glow);
  });
  ctx.drawImage(cn, cx - half, cy - half);
}

function wrapText(text, maxW){
  const words = String(text).split(' ');
  const lines = []; let cur = '';
  for (const w of words){
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; }
    else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function dimScreen(a){ ctx.fillStyle = 'rgba(9,8,14,' + a + ')'; ctx.fillRect(0, 0, View.w, View.h); }

const RARITY_UI = {
  common:    { name:'COMMON',    edge:'#7E778C', fill:'#1C1926' },
  rare:      { name:'RARE',      edge:PAL.teal,  fill:'#12262A' },
  epic:      { name:'EPIC',      edge:PAL.relic, fill:'#211A31' },
  legendary: { name:'LEGENDARY', edge:PAL.brassLite, fill:'#2A2018' },
};
function cardRects(){
  const HS = hudScale();
  // Taller than v9's 384: the cards now carry a before -> after block above
  // the badge, and at the width three of them fit into on a 1366 laptop the
  // description was running into it. Scaled down to fit the viewport in both
  // axes, so a short window shrinks them rather than clipping them.
  const cw = 286*HS, ch = 432*HS, gap = 26*HS;
  const total = cw*3 + gap*2;
  const scale = Math.min(1, (View.w - 60) / total, (View.h - 210*HS) / ch);
  const cw2 = cw*scale, ch2 = ch*scale, gap2 = gap*scale;
  const t2 = cw2*3 + gap2*2;
  const x0 = (View.w - t2)/2, y0 = (View.h - ch2)/2 + 22*HS;
  const out = [];
  for (let i = 0; i < 3; i++) out.push({ x: x0 + i*(cw2+gap2), y: y0, w: cw2, h: ch2, s: scale });
  return out;
}
function updateDraftHover(){
  if (!S.draft) return;
  const rects = cardRects();
  S.draft.hover = -1;
  for (let i = 0; i < S.draft.cards.length; i++){
    const r = rects[i];
    if (Input.mouse.sx >= r.x && Input.mouse.sx <= r.x + r.w &&
        Input.mouse.sy >= r.y && Input.mouse.sy <= r.y + r.h){
      if (S.draft.lastHover !== i){ S.draft.lastHover = i; SFX.uiHover(); }
      S.draft.hover = i;
    }
  }
  if (S.draft.hover < 0) S.draft.lastHover = -1;
}

function drawDraft(){
  if (!S.draft) return;
  const HS = hudScale();
  dimScreen(0.74);
  const rects = cardRects();
  ctx.save();
  ctx.globalAlpha = clamp(S.draft.t / 0.35, 0, 1);
  setFont(Math.round(46*HS), 900, true);
  const opening = S.draft.kind === 'opening';
  const isSkill = opening || S.draft.kind === 'skill';
  textOut(opening ? 'CHOOSE YOUR OPENING WEAPON'
                  : isSkill ? 'ARM A NEW SLOT' : 'DRAFT AN UPGRADE',
          View.w/2, rects[0].y - 74*HS, PAL.bone, PAL.ink, 8);
  setFont(Math.round(15*HS), 700, true);
  // The opening draft is the one place the game gets to state its premise while
  // the player is looking directly at three examples of it.
  const sub = opening
    ? 'EVERY SKILL IS A SHAPE × AN ELEMENT  —  CLICK OR PRESS 1 / 2 / 3'
    : isSkill
      ? (SLOT_KEYS[S.draft.slot] || ('SLOT ' + (S.draft.slot + 1))) +
        '  —  WHICH WEAPON, NOT WHETHER'
      : 'PICK ONE  —  CLICK OR PRESS 1 / 2 / 3';
  textOut(sub, View.w/2, rects[0].y - 42*HS, PAL.teal, PAL.ink, 4);
  ctx.restore();

  for (let i = 0; i < S.draft.cards.length; i++){
    const c = S.draft.cards[i], r = rects[i];
    // A weapon card is edged in its element's colour rather than its rarity's.
    // Rarity is the wrong axis for a card whose entire point is which element
    // it is, and three identically grey cards is what made the opening choice
    // read as "pick one" instead of "pick a colour".
    const R = c.skill
      ? { name: ELEMENTS[c.skill.element].name.toUpperCase(),
          edge: ELEMENTS[c.skill.element].color,
          fill: hexToRgba(ELEMENTS[c.skill.element].color, 0.10) }
      : (RARITY_UI[c.rarity] || RARITY_UI.common);
    const hov = S.draft.hover === i, chosen = S.draft.chosen === i;
    const rejected = S.draft.chosen >= 0 && !chosen;
    const s = r.s;
    ctx.save();
    const t = clamp((S.draft.t - i * 0.07) / 0.32, 0, 1);
    ctx.globalAlpha = (rejected ? clamp(S.draft.chooseT / 0.45, 0, 1) * 0.35 : 1) * easeOut(t);
    ctx.translate(r.x + r.w/2, r.y + r.h/2 + (1 - easeOut(t)) * 50);
    const sc = (hov && !rejected ? 1.045 : 1) * (chosen ? 1 + (1 - S.draft.chooseT/0.45) * 0.10 : 1);
    ctx.scale(sc, sc);
    ctx.translate(-r.w/2, -r.h/2);
    if (hov || chosen){
      ctx.save(); ctx.shadowColor = R.edge; ctx.shadowBlur = 36;
      rr(0, 0, r.w, r.h, 14*s); ctx.fillStyle = R.fill; ctx.fill(); ctx.restore();
    }
    rr(0, 0, r.w, r.h, 14*s);
    const g = ctx.createLinearGradient(0, 0, 0, r.h);
    g.addColorStop(0, R.fill); g.addColorStop(1, '#100E17');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 6*s; ctx.stroke();
    rr(5*s, 5*s, r.w - 10*s, r.h - 10*s, 10*s);
    ctx.strokeStyle = R.edge; ctx.lineWidth = 3*s; ctx.stroke();
    ctx.fillStyle = R.edge;
    for (const p of [[17*s,17*s],[r.w-17*s,17*s],[17*s,r.h-17*s],[r.w-17*s,r.h-17*s]]){
      ctx.beginPath(); ctx.arc(p[0], p[1], 3.2*s, 0, TAU); ctx.fill();
    }
    rr(r.w/2 - 58*s, -10*s, 116*s, 24*s, 6*s);
    ctx.fillStyle = R.edge; ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3*s; ctx.stroke();
    setFont(Math.round(12*s), 800, true);
    if (c.skill){
      // The element's motif rides its own ribbon. Four coloured labels are four
      // colours; four silhouettes are learnable and survive greyscale.
      const lw = ctx.measureText(R.name).width;
      textOut(R.name, r.w/2 + 8*s, 2*s, PAL.ink);
      elementMotif(c.skill.element, r.w/2 - lw/2 - 3*s, 2*s, 6*s, PAL.ink, true);
    } else {
      textOut(R.name, r.w/2, 2*s, PAL.ink);
    }

    const iconY = 84*s;
    gaugeRing(r.w/2, iconY, 40*s, hexToRgba(PAL.brass, 0.55), 16);
    // A skill card draws its OWN shape and element. It used to look up whatever
    // was already in the target slot — which is null for every skill draft,
    // since a skill draft only ever fires for an EMPTY slot — so every weapon
    // card in the game fell through to the generic gear icon. The one screen
    // whose whole job is to show that a skill is a shape crossed with an
    // element was showing neither.
    if (c.skill){
      const E = ELEMENTS[c.skill.element];
      drawShapeGlyph(c.skill.shape, r.w/2, iconY, 25*s, E.color, E.glow);
      setFont(Math.round(10.5*s), 800, true);
      textOut(SHAPES[c.skill.shape].passive ? 'AUTO — NO BUTTON'
                                            : (SLOT_KEYS[c.slot] || ('SLOT ' + (c.slot + 1))),
              r.w/2, iconY + 56*s, E.color, PAL.ink, 3);
    } else if (c.slot !== undefined && S.slots[c.slot]){
      const sk = S.slots[c.slot], E = ELEMENTS[sk.element];
      drawShapeGlyph(sk.shape, r.w/2, iconY, 25*s, E.color, E.glow);
      setFont(Math.round(11*s), 700, true);
      textOut('SLOT ' + (c.slot + 1), r.w/2, iconY + 56*s, E.color, PAL.ink, 3);
    } else {
      const ic = CARD_ICON[c.id] || 'gear';
      const tint = { flame:PAL.fire, frost:PAL.teal, bolt:PAL.tesla, steam:'#C9B6E8',
                     heart:'#E8542E', boot:'#9C93A8', dash:PAL.teal, crit:PAL.crit,
                     scrap:PAL.teal, boiler:PAL.brassLite, burst:PAL.fire }[ic] || R.edge;
      drawCardIcon(ic, r.w/2, iconY, 25*s, tint, '#FFFFFF');
    }
    setFont(Math.round(25*s), 900, true);
    const tl = wrapText(c.title, r.w - 40*s);
    tl.forEach((ln, j) => textOut(ln, r.w/2, 174*s + j*27*s, PAL.bone, PAL.ink, 5*s));
    ctx.strokeStyle = hexToRgba(PAL.brass, 0.5); ctx.lineWidth = 2*s;
    ctx.beginPath();
    ctx.moveTo(34*s, 174*s + tl.length*27*s + 6*s);
    ctx.lineTo(r.w - 34*s, 174*s + tl.length*27*s + 6*s); ctx.stroke();
    setFont(Math.round(15.5*s), 600, false);
    let ty = 174*s + tl.length*27*s + 32*s;
    wrapText(c.text, r.w - 46*s).forEach((ln, j) =>
      textOut(ln, r.w/2, ty + j*22*s, '#B8B0C4'));
    ty += wrapText(c.text, r.w - 46*s).length * 22*s + 10*s;

    // Before → after, anchored to the bottom of the card rather than flowing
    // after the prose. Flowing put a three-row preview under a three-line
    // description straight through the card's number badge — and how many rows
    // a card has is not something the layout should have to know.
    // The prose says what the card does; these say what it is worth. Without
    // them "+2 pierce" and "burn +50%" are two sentences with no way to compare
    // them, which is how a draft becomes a coin toss.
    if (c.preview && c.preview.length){
      ty = r.h - 104*s - (c.preview.length - 1) * 18*s;
      for (const p of c.preview){
        setFont(Math.round(11*s), 700, false);
        textOut(p.label, 24*s, ty, '#7E778C', null, 0, 'left');
        setFont(Math.round(12.5*s), 800, true);
        const tw = ctx.measureText(p.to).width;
        textOut(p.to, r.w - 24*s, ty, p.better ? PAL.teal : PAL.dangerIn, PAL.ink, 3*s, 'right');
        setFont(Math.round(11.5*s), 700, false);
        const aw = ctx.measureText(' → ').width;
        textOut('→', r.w - 26*s - tw - aw/2, ty, '#5A5366');
        textOut(p.from, r.w - 26*s - tw - aw, ty, '#6E667A', null, 0, 'right');
        ty += 18*s;
      }
    }

    // Whether it is something you press. A passive in a slot is the single
    // thing new players misread, and the card is where to say so.
    if (c.skill){
      const passive = SHAPES[c.skill.shape].passive;
      setFont(Math.round(10.5*s), 800, true);
      const tag = passive ? 'AUTO' : 'ACTIVE';
      const tw = ctx.measureText(tag).width + 16*s;
      rr(r.w/2 - tw/2, r.h - 78*s, tw, 18*s, 4*s);
      ctx.fillStyle = passive ? hexToRgba(PAL.relic, 0.22) : hexToRgba(PAL.teal, 0.16);
      ctx.fill();
      ctx.strokeStyle = passive ? PAL.relic : PAL.teal; ctx.lineWidth = 1.4*s; ctx.stroke();
      textOut(tag, r.w/2, r.h - 69*s, passive ? PAL.relic : PAL.teal);
    }

    rr(r.w/2 - 20*s, r.h - 44*s, 40*s, 30*s, 6*s);
    ctx.fillStyle = '#0B0910'; ctx.fill();
    ctx.strokeStyle = R.edge; ctx.lineWidth = 2.4*s; ctx.stroke();
    setFont(Math.round(17*s), 800, true);
    textOut((i + 1) + '', r.w/2, r.h - 29*s, R.edge);
    ctx.restore();
  }
}

function drawTitle(){
  const HS = hudScale();
  dimScreen(0.5);
  const t = S.titleT;
  ctx.save();
  ctx.translate(View.w/2, View.h * 0.245);
  ctx.translate(0, Math.sin(t * 1.3) * 4);
  ctx.save(); ctx.globalAlpha = 0.4;
  for (let i = 0; i < 3; i++){
    const rr2 = [96, 62, 44][i] * HS;
    ctx.save();
    ctx.translate([-250, 258, 300][i] * HS, [12, -22, 34][i] * HS);
    ctx.rotate(t * (i % 2 ? -0.35 : 0.28));
    ctx.strokeStyle = PAL.brass; ctx.lineWidth = 7*HS;
    circ(0, 0, rr2); ctx.stroke();
    circ(0, 0, rr2 * 0.42); ctx.stroke();
    for (let j = 0; j < 12; j++){
      const a = j / 12 * TAU;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*rr2, Math.sin(a)*rr2);
      ctx.lineTo(Math.cos(a)*rr2*1.16, Math.sin(a)*rr2*1.16); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
  setFont(Math.round(116*HS), 900, true);
  ctx.letterSpacing = '10px';
  ctx.save(); ctx.shadowColor = PAL.teal; ctx.shadowBlur = 26;
  textOut('SKYGEAR', 0, 0, PAL.brassLite, PAL.ink, 16);
  ctx.restore();
  ctx.letterSpacing = '0px';
  setFont(Math.round(18*HS), 700, true);
  textOut('S T O R M - D U S K   ·   1 0 , 0 0 0   F E E T', 0, 74*HS, PAL.moon, PAL.ink, 5);
  ctx.restore();

  // The promise, in one line, above the fold. A title screen that opens with a
  // four-column control reference is telling a stranger how before it has told
  // them what — and the controls are two of them anyway, since the captain
  // attacks by herself.
  setFont(Math.round(17*HS), 600, false);
  textOut('Twelve waves board your airship. Keep the Boiler alive.',
          View.w/2, View.h * 0.40, '#C6BFD2');
  setFont(Math.round(14*HS), 700, false);
  // Counted, not written down. This read "24 combinations" for three versions
  // after passives took the roster to eight draftable shapes.
  textOut('Every skill is a SHAPE × an ELEMENT — ' + comboCount() +
          ' combinations, and the draft after each wave rewrites them.',
          View.w/2, View.h * 0.40 + 26*HS, '#7E778C');

  const bw = 300*HS, bh = 62*HS, gap = 12*HS;
  let by = View.h * 0.53;
  if (uiButton(View.w/2 - bw/2, by, bw, bh, 'START RUN', 'primary')) startRun();
  by += bh + gap;
  const half = (bw - gap) / 2;
  if (uiButton(View.w/2 - bw/2, by, half, 46*HS, 'HOW TO PLAY')) openHowTo();
  if (uiButton(View.w/2 + gap/2, by, half, 46*HS, 'SETTINGS')) openSettings('title');
  by += 46*HS + gap;

  const best = RunLog.best();
  if (best){
    setFont(Math.round(12.5*HS), 700, false);
    textOut('your best: wave ' + best.wave + ' of ' + best.waves + ' · ' +
            best.kills + ' boarders · ' + fmtDuration(best.time),
            View.w/2, by + 16*HS, '#6E667A');
  }
  if (FORCED_SEED !== null){
    setFont(Math.round(12*HS), 800, true);
    textOut('FIXED SEED ' + seedText(FORCED_SEED), View.w/2, by + 38*HS, PAL.teal, PAL.ink, 3);
  }

  // Build stamp. The site is served with a ten-minute cache, so "is this the
  // change I just shipped?" needs an answer that does not depend on trusting
  // the browser. Also reports how much painted art actually resolved.
  setFont(Math.round(11*HS), 700, false);
  const art = Assets.enabled ? (Assets.ready + '/' + Assets.total + ' art')
                             : 'procedural';
  textOut(PRESET.name + ' · ' + (PRESET.build || 'dev') + ' · ' + art,
          View.w - 14*HS, View.h - 12*HS, '#5A5366', null, 0, 'right');
}

/* Derived, never written down. The title said "24 combinations" for three
   versions after passives took the roster to nine shapes, because it was a
   string. Cleave is the fixed basic and is excluded from drafts, so it is the
   draftable shapes that count. */
function comboCount(){
  return (SHAPE_KEYS.length - (FEEL.basic ? 1 : 0)) * ELEMENT_KEYS.length;
}

/* ---------------------------------------------------------------------------
   OVERLAYS — settings, how to play, key binding
   These are not modes. Making them modes would mean every piece of code that
   asks "are we playing?" has to learn two more answers, and the pause menu and
   the title screen would each need their own copy of the settings panel.
   They are a layer on top of whatever is already there, and they remember
   where they were opened from so Back goes somewhere sensible.
--------------------------------------------------------------------------- */
function openSettings(from){ S.overlay = { kind:'settings', from, t:0 }; SFX.uiClick(); }
function openHowTo(from){ S.overlay = { kind:'howto', from: from || 'title', t:0 }; SFX.uiClick(); }
function openBinds(){ S.overlay = { kind:'binds', from:'settings', t:0, listen:null }; SFX.uiClick(); }
function closeOverlay(){
  const o = S.overlay;
  if (!o) return;
  // Back from the rebinder returns to settings, not to the game underneath it.
  if (o.from === 'settings') S.overlay = { kind:'settings', from:'pause-or-title', t:0 };
  else S.overlay = null;
  SFX.uiClick();
}

function drawPause(){
  const HS = hudScale();
  dimScreen(0.72);
  UI.begin('pause');
  setFont(Math.round(58*HS), 900, true);
  textOut('PAUSED', View.w/2, View.h * 0.17, PAL.bone, PAL.ink, 10);

  const bw = 280*HS, bh = 52*HS, gap = 10*HS;
  let by = View.h * 0.25;
  if (uiButton(View.w/2 - bw/2, by, bw, bh, 'RESUME', 'primary', { hint: 'ESC' })) S.mode = 'play';
  by += bh + gap;
  const half = (bw - gap) / 2;
  if (uiButton(View.w/2 - bw/2, by, half, 42*HS, 'SETTINGS')) openSettings('pause');
  if (uiButton(View.w/2 + gap/2, by, half, 42*HS, 'HOW TO PLAY')) openHowTo('pause');
  by += 42*HS + gap;
  if (uiButton(View.w/2 - bw/2, by, half, 42*HS, 'RESTART RUN')) startRun();
  if (uiButton(View.w/2 + gap/2, by, half, 42*HS, 'QUIT TO TITLE')){ S.mode = 'title'; S.overlay = null; }
  by += 42*HS + 26*HS;

  // The loadout, with its real numbers. This is the only place in the game a
  // player can read what their build actually does without being shot at.
  const rows = [];
  if (S.basic) rows.push([S.basic, 'AUTO']);
  for (let i = 0; i < 4; i++) if (S.slots[i]) rows.push([S.slots[i], SLOT_KEYS[i]]);
  if (rows.length){
    const pw = Math.min(View.w - 60, 720*HS), ph = 40*HS + rows.length * 44*HS;
    const px = (View.w - pw)/2;
    brassPanel(px, by, pw, ph, 12*HS, 0.95);
    setFont(Math.round(13*HS), 800, true);
    textOut('LOADOUT', px + pw/2, by + 19*HS, PAL.brass);
    rows.forEach((row, i) => {
      const sk = row[0], E = ELEMENTS[sk.element], st = skillStats(sk);
      const y = by + 48*HS + i * 44*HS;
      drawShapeGlyph(sk.shape, px + 30*HS, y + 6*HS, 13*HS, E.color, E.glow);
      setFont(Math.round(15*HS), 800, true);
      textOut(skillName(sk).toUpperCase(), px + 52*HS, y, E.color, PAL.ink, 3, 'left');
      setFont(Math.round(12.5*HS), 600, false);
      textOut(SHAPES[sk.shape].desc + '  ·  ' + ELEMENTS[sk.element].blurb,
              px + 52*HS, y + 18*HS, '#9C93A8', null, 0, 'left');
      setFont(Math.round(12*HS), 800, true);
      textOut(row[1], px + pw - 26*HS, y, PAL.bone, null, 0, 'right');
      setFont(Math.round(11.5*HS), 700, false);
      textOut(SHAPES[sk.shape].passive ? 'no button' : st.cd.toFixed(2) + 's cooldown',
              px + pw - 26*HS, y + 18*HS, '#7E778C', null, 0, 'right');
    });
  }
  UI.end();
}

/* One scrollless panel that fits on a 1366x768 laptop, because that is the
   machine the acceptance criteria name. Nothing here is behind a submenu
   except rebinding, which needs a whole screen to itself. */
function drawSettings(){
  const HS = hudScale();
  dimScreen(0.82);
  UI.begin('settings');
  setFont(Math.round(40*HS), 900, true);
  textOut('SETTINGS', View.w/2, View.h * 0.10, PAL.bone, PAL.ink, 8);

  const pw = Math.min(View.w - 48, 700*HS);

  // Height from content, not from a fraction of the viewport: a panel sized to
  // the window has to be sized for the tallest window, and on every other one
  // it is mostly empty. 5 sound rows, 3 display rows, 2 button rows, three
  // headings and the padding around them.
  const ph = 38*HS + (28*HS + 5*34*HS + 10*HS)
                   + (28*HS + 3*34*HS + 10*HS)
                   + (28*HS + 34*HS + 8*HS + 34*HS);
  brassPanel(px, y, pw, ph, 12*HS, 0.96);
  y += 18*HS;

  y += uiHeading(ix, y, iw, 'SOUND');

                v => { Settings.set('volMaster', v); Sound.vol = v; });

  y += uiSlider(ix, y, iw, 'Effects', Settings.get('volSfx'), v => Settings.set('volSfx', v));

  y += uiHeading(ix, y, iw, 'DISPLAY');

    { value: 0.5,  label: 'FEWER' },
    { value: 0.25, label: 'FEWEST' },

  // player who has never opened this menu is already in it.
  y += uiChoice(ix, y, iw, 'Reduced motion', [
    { value: null,  label: Settings.motionReduced() ? 'SYSTEM (ON)' : 'SYSTEM (OFF)' },
    { value: true,  label: 'ON' },

  if (uiButton(ix + iw * 0.52, y, iw * 0.48, bh, 'RESET EVERYTHING')){ Settings.reset(); Hints.reset(); }

  const byy = View.h * 0.10 + 40*HS + ph + 18*HS;
