/* Ambience. Two beds under everything — the largest atmosphere gain per byte,
   and until the files land these are a filtered-noise stand-in that still
   beats silence. Driven from Ambience.update() each frame. */
const Ambience = {
  on: false, t: 0,
  update(dt){
    const want = S.mode === 'play' || S.mode === 'draft';
    if (want && !this.on){
      this.on = true;
      Sound.startLoop('amb_storm', 0.22);
      Sound.startLoop('amb_ship', 0.18);
    } else if (!want && this.on){
      this.on = false;
      Sound.stopLoop('amb_storm'); Sound.stopLoop('amb_ship');
    }
    // procedural stand-in: an occasional gust, only when no bed is loaded
    if (this.on && !AudioBank.has('amb_storm')){
      this.t -= dt;
      if (this.t <= 0){
        this.t = 2.2 + Math.random() * 2.6;
        Sound.noise({ dur:1.8, ff0:220, ff1:520, q:0.5, gain:0.035, filter:'bandpass', bus:'sfx' });
      }
    }
    // the Boiler's alarm, tied to the actual threshold
    const crit = S.boiler && S.boiler.hp / S.boiler.maxHp < 0.25 && want;
    if (crit && !this._crit){ this._crit = true; Sound.startLoop('boiler_critical', 0.5); }
    else if (!crit && this._crit){ this._crit = false; Sound.stopLoop('boiler_critical'); }
  },
};

/* 7 ------------------------------------------------------------------------ */
/* The director. Picks a track from game state, crossfades over 2s. Dormant and
   harmless until the files exist — every call is a no-op without a buffer. */
const Music = {
  cur: null, node: null, gain: null,

  onUnlock(){ this.want(); },

  trackFor(){
    if (S.mode === 'title') return 'm_title';
    if (S.mode === 'victory') return 'm_victory';
    if (S.mode === 'gameover') return 'm_defeat';
    const def = WAVES[S.wave - 1];
    if (def && def.boss) return 'm_boss';
    if (def && def.push && S.hulk && !S.hulk.dead && S.hulk.vulnerable) return 'm_push';
    if (S.wave >= 9) return 'm_combat3';
    if (S.wave >= 5) return 'm_combat2';
    return 'm_combat1';
  },

  /* With a partial score, asking for a track that does not exist must not mean
     silence. Each state falls back along a chain to whatever has been
     delivered, so a single combat loop covers the whole game and every new
     track slots into its own tier without any other change. */
  resolve(k){
    const chain = {
      m_combat3: ['m_combat3', 'm_combat2', 'm_combat1'],
      m_combat2: ['m_combat2', 'm_combat1', 'm_combat3'],
      m_combat1: ['m_combat1', 'm_combat2', 'm_combat3'],
      m_push:    ['m_push', 'm_combat3', 'm_combat2', 'm_combat1'],
      m_boss:    ['m_boss', 'm_push', 'm_combat3', 'm_combat2', 'm_combat1'],
      m_title:   ['m_title', 'm_combat1'],
    }[k] || [k];
    for (const c of chain){ if (AudioBank.get(c)) return c; }
    return chain[0];
  },

  want(){
    const k = this.resolve(this.trackFor());
    if (k === this.cur) return;
    const buf = AudioBank.get(k);          // triggers the lazy fetch
    // Do NOT record the intent here. Setting cur to a track that has not
    // finished downloading makes the next call think it is already playing, so
    // the moment the buffer arrives it is skipped and the music never starts.
    // Leave cur alone and let the next frame retry; get() will not re-fetch.
    if (!buf) return;
    this.cur = k;
    const c = Sound.ctx, t = c.currentTime, XF = 2.0;
    if (this.gain){
      const og = this.gain, on = this.node;
      og.gain.cancelScheduledValues(t);
      og.gain.setValueAtTime(og.gain.value, t);
      og.gain.linearRampToValueAtTime(0.0001, t + XF);
      try { on.stop(t + XF + 0.1); } catch (e) {}
    }
    const m = AUDIO_MANIFEST[k];
    if (m.loop && m.loopStart !== undefined){
      // crossfade-looped: scheduled in passes rather than handed to src.loop
      this.loopSpec = { key: k, buf, start: m.loopStart, end: m.loopEnd };
      const bus = c.createGain();
      bus.gain.setValueAtTime(0.0001, t);
      bus.gain.linearRampToValueAtTime(1, t + XF);
      bus.connect(Sound.dest('music'));
      this.gain = bus; this.node = null;
      this.nextAt = t;
      this.schedule(t);
      return;
    }
    this.loopSpec = null;
    const rec = Sound.sample(k, { gain: 0.0001 });
    if (!rec) { this.gain = null; this.node = null; return; }
    this.gain = rec.g; this.node = rec.src;
    rec.g.gain.setValueAtTime(0.0001, t);
    rec.g.gain.linearRampToValueAtTime(1, t + XF);
  },

  update(){
    if (!Sound.ready) return;
    Sound.keepAwake();
    this.want();
    this.reloop();
  },

  /* Web Audio's own looping is a hard splice, which on generated music lands as
     an audible cut — and these tracks are not authored to loop. So each pass is
     scheduled as its own source with a crossfade over the join: the next one
     starts before the current ends and they trade gain. Costs one extra voice
     for the length of the fade and makes any track loop acceptably, which
     matters with six more still to come. */
  XF: 2.0,

  reloop(){
    if (!this.loopSpec || !this.gain) return;
    const c = Sound.ctx;
    if (c.currentTime < this.nextAt - 0.5) return;
    this.schedule(this.nextAt);
  },

  schedule(at){
    const { key, buf, start, end } = this.loopSpec;
    const c = Sound.ctx, XF = this.XF, len = end - start;
    const src = c.createBufferSource();
    src.buffer = buf;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(1, at + XF);
    g.gain.setValueAtTime(1, at + len - XF);
    g.gain.linearRampToValueAtTime(0.0001, at + len);
    src.connect(g); g.connect(Sound.dest('music'));
    src.start(at, start, len + XF);
    src.stop(at + len + 0.05);
    this.nextAt = at + len - XF;
  },
};


/* ============================================================================
   LANES — the MOBA restructure (v4)

   Inert unless PRESET.lanes is true, so v2/v3 are untouched by any of it.

   Topology, straight out of League:
     · the enemy boarding hulk is grappled to the BOW and spawns down 3 lanes
     · cargo walls hard-separate the lanes for most of the deck
     · one deck cannon per lane gates it — boarders must break it to pass
     · your crew spawn at the base and push UP their lane
     · the Boiler sits at the STERN, behind everything, and is what you lose by
     · the base (the rear of the deck) is open across all three lanes, and one
       mid-deck cross-passage lets you rotate. Boarders and crew never use them:
       they are lane-locked, so committing to a lane means something.
============================================================================ */
const LANE_N = 3;
const LANES = [];
const LANE_WALLS = [];       // {x0,x1,y0,y1} solid cargo runs between lanes
let BASE_Y = 0, LANE_TOP = 0, CROSS_Y0 = 0, CROSS_Y1 = 0, FWD_Y0 = 0, FWD_Y1 = 0;

function initLanes(){
  if (!PRESET.lanes) return;
  const D = TUNING.deck;
  const left = D.cx - D.w / 2, right = D.cx + D.w / 2;
  const top = D.cy - D.h / 2, bot = D.cy + D.h / 2;
  LANE_TOP = top + 150;                 // boarders enter here
  BASE_Y   = bot - 430;                 // rear of the deck is open across lanes
  CROSS_Y0 = top + D.h * 0.44;          // mid-deck rotation passage
  CROSS_Y1 = CROSS_Y0 + 210;
  // A second passage well forward. With only the mid-deck one, a captain who
  // committed to the bow of a lane had to walk the length of the deck to answer
  // a push two lanes over — the front line was three separate fights that never
  // talked to each other. Enemies and crew are still lane-clamped, so this is
  // the player's rotation, not a leak in the lane structure.
  FWD_Y0 = LANE_TOP + 200;
  FWD_Y1 = FWD_Y0 + 190;

  const laneW = D.w / LANE_N;
  LANES.length = 0;
  for (let i = 0; i < LANE_N; i++){
    LANES.push({
      id: i,
      cx: left + laneW * (i + 0.5),
      halfW: laneW * 0.5 - 66,          // walls eat the rest
      name: ['PORT', 'CENTRE', 'STARBOARD'][i],
    });
  }
  LANE_WALLS.length = 0;
  for (let i = 1; i < LANE_N; i++){
    const wx = left + laneW * i;
    // split each wall so a cross-passage opens amidships
    // Runs start at the boarding line, not the deck's far edge: modules placed
    // out there hung over the bow with no deck behind them. It also opens the
    // bow strip as a third crossing, which is the player's alone — enemies and
    // crew are lane-clamped either way.
    LANE_WALLS.push({ x0: wx - 60, x1: wx + 60, y0: LANE_TOP + 10, y1: FWD_Y0 });
    LANE_WALLS.push({ x0: wx - 60, x1: wx + 60, y0: FWD_Y1,   y1: CROSS_Y0 });
    LANE_WALLS.push({ x0: wx - 60, x1: wx + 60, y0: CROSS_Y1, y1: BASE_Y });
  }
}

function laneOf(x){
  let best = 0, bd = Infinity;
  for (const L of LANES){ const d = Math.abs(x - L.cx); if (d < bd){ bd = d; best = L.id; } }
  return best;
}
// keep a lane-locked mover inside its own lane while it is north of the base
function clampToLane(o, lane, r){
  if (!PRESET.lanes || o.y > BASE_Y) return;
  const L = LANES[lane];
  if (!L) return;
  const lo = L.cx - L.halfW + r, hi = L.cx + L.halfW - r;
  if (o.x < lo){ o.x = lo; if (o.vx) o.vx *= 0.4; }
  if (o.x > hi){ o.x = hi; if (o.vx) o.vx *= 0.4; }
}
// the captain is not lane-locked, but the cargo walls are solid to everyone
function pushOutWalls(o, r){
  if (!PRESET.lanes) return;
  for (const w of LANE_WALLS){
    if (o.x < w.x0 - r || o.x > w.x1 + r || o.y < w.y0 - r || o.y > w.y1 + r) continue;
    // shortest push out of the box
    const dl = (o.x - (w.x0 - r)), dr = ((w.x1 + r) - o.x);
    const du = (o.y - (w.y0 - r)), dd = ((w.y1 + r) - o.y);
    const m = Math.min(dl, dr, du, dd);
    if (m === dl){ o.x = w.x0 - r; if (o.vx) o.vx = 0; }
    else if (m === dr){ o.x = w.x1 + r; if (o.vx) o.vx = 0; }
    else if (m === du){ o.y = w.y0 - r; if (o.vy) o.vy = 0; }
    else { o.y = w.y1 + r; if (o.vy) o.vy = 0; }
  }
}

/* --- tuning ---------------------------------------------------------------- */
/* Tuned down hard after the first v5 pass: the allies were doing the work.
   Crew were arriving 9-at-a-time every 7.5s (~36 alive across a wave) at 52 HP
   and 9 damage, and three cannons added ~68 dps between them. The lanes held
   themselves and there was nothing to decide. */
const LANE_TUNING = {
  turret: { hp: 480, range: 400, dmg: 15, cd: 1.45, r: 34 },   // ~10 dps each
  crew:   { hp: 34, dmg: 5, siege: 22, speed: 118, r: 15, reach: 52,
            windup: 0.40, recover: 0.5, every: 14, pushEvery: 9, perWave: 2 },
            // 6 per 14s. `siege` is what they do to the hulk: minions are
            // supposed to break a nexus, and on the first push wave they walked
            // to the bow and stood there while the player did all of it.
  hulk:   { hp: 1500, r: 190 },                                 // was 3200 and unkillable
};

/* --- turrets --------------------------------------------------------------- */
function spawnTurrets(){
  S.turrets = [];
  if (!PRESET.lanes) return;
  const T = LANE_TUNING.turret;
  for (const L of LANES){
    S.turrets.push({ lane: L.id, x: L.cx, y: BASE_Y - 210, hp: T.hp, maxHp: T.hp,
                     cd: rnd(0, T.cd), r: T.r, ang: -Math.PI/2, flash: 0, dead: false,
                     fireFx: 0 });
  }
}
function updateTurrets(dt){
  if (!PRESET.lanes) return;
  const T = LANE_TUNING.turret;
  for (const t of S.turrets){
    if (t.flash > 0) t.flash -= dt;
    if (t.fireFx > 0) t.fireFx -= dt;
    if (t.dead) continue;
    t.cd -= dt;
    // shoot the boarder nearest the Boiler in this lane
    let best = null, bestY = -Infinity;
    for (const e of S.enemies){
      if (e.dead || e.state === 'climb' || e.lane !== t.lane) continue;
      if (dist2(t.x, t.y, e.x, e.y) > T.range * T.range) continue;
      if (e.y > bestY){ bestY = e.y; best = e; }
    }
    if (!best) continue;
    t.ang = Math.atan2(best.y - t.y, best.x - t.x);
    if (t.cd <= 0){
      t.cd = T.cd;
      t.fireFx = 0.14;
      hitEnemy(best, T.dmg, { ang: t.ang, knock: 90, noCrit: true });
      SFX.cannonFire({ x: t.x, y: t.y });
      pSparks(t.x + Math.cos(t.ang) * 30, t.y + Math.sin(t.ang) * 30, 5, PAL.teal, 200, t.ang, 0.4);
    }
  }
}
function damageTurret(t, dmg){
  if (t.dead) return;
  t.hp -= dmg;
  SFX.turretHurt({ x: t.x, y: t.y });
  t.flash = 0.12;
  if (t.hp <= 0){
    t.hp = 0; t.dead = true;
    SFX.turretDown({ x: t.x, y: t.y });
    addTrauma(0.4); SFX.slam();
    pGibs(t.x, t.y, 22, PAL.brass, PAL.iron);
    pSmoke(t.x, t.y, 10, 'rgba(40,36,48,0.65)', 90);
    S.banner = { kind:'lane', text: LANES[t.lane].name + ' CANNON DOWN', t: 0, life: 2.4 };
  }
}
function turretInLane(lane){
  for (const t of S.turrets) if (t.lane === lane && !t.dead) return t;
  return null;
}

/* --- your crew ------------------------------------------------------------- */
function spawnCrewWave(){
  if (!PRESET.lanes) return;
  const C = LANE_TUNING.crew;
  for (const L of LANES){
    for (let i = 0; i < C.perWave; i++){
      S.crew.push({
        lane: L.id,
        x: L.cx + rnd(-70, 70), y: BASE_Y + 50 + i * 26,
        vx: 0, vy: 0, hp: C.hp, maxHp: C.hp, r: C.r,
        facing: -Math.PI/2, state: 'move', st: 0, anim: rnd(TAU),
        flash: 0, dead: false, atkAng: 0, target: null,
      });
    }
  }
  SFX.crewMuster();
}
function updateCrew(dt){
  if (!PRESET.lanes) return;
  const C = LANE_TUNING.crew;
  for (const c of S.crew){
    if (c.flash > 0) c.flash -= dt;
    if (c.dead) continue;
    c.anim += dt;

    // nearest boarder in my lane, ahead of me
    let tgt = null, bd = Infinity;
    for (const e of S.enemies){
      if (e.dead || e.state === 'climb' || e.lane !== c.lane) continue;
      const d = dist2(c.x, c.y, e.x, e.y);
      if (d < bd){ bd = d; tgt = e; }
    }
    const hasTgt = tgt && bd < 320 * 320;
    // with the lane clear and their plating open, go break the hulk
    const H = S.hulk;
    const siege = !hasTgt && H && !H.dead && H.vulnerable;
    let gx, gy;
    if (hasTgt){ gx = tgt.x; gy = tgt.y; }
    else if (siege){ gx = H.x + (LANES[c.lane].cx - H.x) * 0.30; gy = H.y; }
    else { gx = LANES[c.lane].cx; gy = LANE_TOP + 60; }   // else push up the lane

    if (c.state === 'move'){
      const d = dist(c.x, c.y, gx, gy);
      const a = Math.atan2(gy - c.y, gx - c.x);
      c.facing = angNorm(c.facing + clamp(angDiff(c.facing, a), -8*dt, 8*dt));
      const reach = siege ? C.reach + H.r * 0.85 : C.reach;
      if ((!hasTgt && !siege) || d > reach){
        c.vx = lerp(c.vx, Math.cos(a) * C.speed, 1 - Math.pow(0.004, dt));
        c.vy = lerp(c.vy, Math.sin(a) * C.speed, 1 - Math.pow(0.004, dt));
      } else {
        c.vx *= Math.pow(0.02, dt); c.vy *= Math.pow(0.02, dt);
        c.state = 'windup'; c.st = C.windup; c.atkAng = a;
        c.target = tgt; c.siegeing = siege && !hasTgt;
      }
    } else if (c.state === 'windup'){
      c.st -= dt;
      c.vx *= Math.pow(0.05, dt); c.vy *= Math.pow(0.05, dt);
      if (c.st <= 0){
        if (c.siegeing){
          const HH = S.hulk;
          if (HH && !HH.dead && HH.vulnerable &&
              dist(c.x, c.y, HH.x, HH.y) < C.reach + HH.r * 1.1){
            damageHulk(C.siege);
            pSparks(c.x, c.y - 20, 3, PAL.fireCore, 150, -Math.PI/2, 0.6);
          }
        } else {
          const e = c.target;
          if (e && !e.dead && dist(c.x, c.y, e.x, e.y) < C.reach + e.r){
            hitEnemy(e, C.dmg, { ang: c.atkAng, knock: 60, noCrit: true, silent: true });
            SFX.crewAttack({ x: c.x, y: c.y });
          }
        }
        c.state = 'recover'; c.st = C.recover;
      }
    } else {
      c.st -= dt;
      c.vx *= Math.pow(0.3, dt); c.vy *= Math.pow(0.3, dt);
      if (c.st <= 0) c.state = 'move';
    }

    c.x += c.vx * dt; c.y += c.vy * dt;
    const p = clampToDeck(c.x, c.y, c.r + 4); c.x = p.x; c.y = p.y;
    if (!siege) clampToLane(c, c.lane, c.r);
    pushOutWalls(c, c.r);
  }
  for (let i = S.crew.length - 1; i >= 0; i--) if (S.crew[i].dead) S.crew.splice(i, 1);
}
function hurtCrew(c, dmg, ang){
  if (c.dead) return;
  c.hp -= dmg;
  c.flash = 0.06;
  if (c.hp <= 0){
    c.dead = true;
    SFX.crewDown({ x: c.x, y: c.y });
    pGibs(c.x, c.y, 8, '#7A6E5A', PAL.iron);
    pSparks(c.x, c.y, 5, PAL.bone, 160);
  }
}

/* --- the enemy hulk (their nexus) ------------------------------------------ */
function spawnHulk(scale){
  if (!PRESET.lanes){ S.hulk = null; return; }
  const D = TUNING.deck, H = LANE_TUNING.hulk;
  const hp = Math.round(H.hp * (scale || 1));
  S.hulk = { x: D.cx, y: D.cy - D.h/2 - 130, r: H.r,
             hp: hp, maxHp: hp, flash: 0, vulnerable: false, dead: false };
}
function damageHulk(dmg){
  const H = S.hulk;
  if (!H || H.dead) return 0;
  if (!H.vulnerable) return 0;                 // plating sealed on hold waves
  H.hp -= dmg; H.flash = 0.1;
  SFX.hulkHit({ x: H.x, y: H.y });
  S.stats.damage += dmg;
  if (H.hp <= 0){
    H.hp = 0; H.dead = true;
    addTrauma(1); S.flashWhite = 0.9; SFX.hulkBreak();
    for (let i = 0; i < 10; i++)
      fx({ kind:'delayPop', x: H.x + rnd(-190,190), y: H.y + rnd(-70,70),
           life: 0.5, delay: i * 0.12, r: rnd(50,110), col: i%2 ? PAL.fire : PAL.fireCore });
  }
  return dmg;
}

/* --- lane-aware targeting -------------------------------------------------- */
// Boarders walk their lane and hit whatever is in front of them, League-style:
// crew first, then the lane's cannon, then the Boiler.
function laneEnemyTarget(e){
  const P = S.player;
  // the captain, if she is right on top of them
  if (P.hp > 0 && dist2(e.x, e.y, P.x, P.y) < 230 * 230)
    return { x: P.x, y: P.y, r: TUNING.player.radius, kind: 'player' };
  // crew in the way
  let c = null, bd = 220 * 220;
  for (const q of S.crew){
    if (q.dead || q.lane !== e.lane) continue;
    const d = dist2(e.x, e.y, q.x, q.y);
    if (d < bd){ bd = d; c = q; }
  }
  if (c) return { x: c.x, y: c.y, r: c.r, kind: 'crew', ref: c };
  // the lane's cannon gates progress
  const t = turretInLane(e.lane);
  if (t && e.y < t.y + 90) return { x: t.x, y: t.y, r: t.r, kind: 'turret', ref: t };
  return { x: S.boiler.x, y: S.boiler.y, r: S.boiler.r, kind: 'boiler' };
}
// route damage from a boarder's swing to whatever it actually hit
function laneResolveHit(e, tgtKind, ref, dmg, ang){
  if (tgtKind === 'player') hurtPlayer(dmg, ang);
  else if (tgtKind === 'crew') hurtCrew(ref, dmg, ang);
  else if (tgtKind === 'turret') damageTurret(ref, dmg);
  else hurtBoiler(dmg, Math.atan2(e.y - S.boiler.y, e.x - S.boiler.x));
}

/* --- lane status, and the hulk's wave loop --------------------------------- */
/* Everything the lane readout needs, measured in one pass.

   `prog` — the DEEPEST boarder, not the average and not the count. How far in
   the worst one has got is the number that decides where you go next; a lane
   with nine at the rail is safer than a lane with one at the Boiler.
   `heavy`  — is any of them an Armoured or the boss, which changes what you
   need to bring rather than how fast you need to get there.
   `crew`   — your own side holding it. A lane with crew in it is one you can
   leave for a few seconds and one you cannot is not. */
function laneThreat(i){
  let n = 0, nearest = -Infinity, heavy = false, crew = 0;
  for (const e of S.enemies){
    if (e.dead || e.lane !== i) continue;
    n++;
    if (e.type === 'ARMORED' || e.type === 'BOSS') heavy = true;
    if (e.y > nearest) nearest = e.y;
  }
  for (const c of S.crew) if (!c.dead && laneOf(c.x) === i && c.y < BASE_Y) crew++;
  const t = turretInLane(i);
  // 0..1, how far the lane has been pushed toward the Boiler
  const prog = nearest === -Infinity ? 0
    : clamp((nearest - LANE_TOP) / Math.max(1, S.boiler.y - LANE_TOP), 0, 1);
  return { count: n, prog, heavy, crew,
           turret: t, turretFrac: t ? t.hp / t.maxHp : 0,
           // Critical is about depth, not headcount: past the cannon line and
           // closing on the objective.
           critical: prog > 0.72 || (!t && prog > 0.45) };
}

/* Where the crossings are, as fractions down the same 0..1 axis the lane bar
   uses, so the readout can mark them in the same space as the threat pip. */
function crossingMarks(){
  const span = Math.max(1, S.boiler.y - LANE_TOP);
  return [((FWD_Y0 + FWD_Y1) / 2 - LANE_TOP) / span,
          ((CROSS_Y0 + CROSS_Y1) / 2 - LANE_TOP) / span];
}

function updateLanes(dt){
  if (!PRESET.lanes) return;
  updateTurrets(dt);
  updateCrew(dt);
  if (S.hulk && S.hulk.flash > 0) S.hulk.flash -= dt;
  // crew reinforcements arrive on a drumbeat, like minion waves. On a push the
  // drumbeat quickens — they have the length of the deck to walk before they
  // reach the hulk, and at the normal cadence the captain breaks it alone.
  const pushing = S.hulk && !S.hulk.dead && S.hulk.vulnerable;
  S.crewT -= dt;
  if (S.crewT <= 0){
    S.crewT = pushing ? LANE_TUNING.crew.pushEvery : LANE_TUNING.crew.every;
    spawnCrewWave();
  }
}


/* ============================================================================
   6. RENDER — Cinderia-style presentation layer
   ----------------------------------------------------------------------------
   Everything above this line is the ported simulation: it works on a flat
   ground plane in (x, y) where y is DEPTH. Nothing below changes gameplay.

   Per the visual spec §2, this is a canvas-2D renderer only:
     · fixed-yaw pinhole camera, pitch 0.72 rad, projecting the ground plane
     · entities are billboard sprites, depth-scaled, painter-sorted far -> near
     · ground-flat art is authored as circles and squashed to ellipses (affine)
     · the deck is code-drawn projected quads — no ground texture
     · sky / clouds / envelope are flat screen-space parallax layers
   Image assets drop in by manifest path (§2.1, §4); anything missing is drawn
   procedurally in the same style so the game is always playable.
============================================================================ */

/* ---------------------------------------------------------------------------
   CAMERA — one pinhole. project() is the only place perspective happens.
   v3 lets it track the captain; v2 pins it to the deck centre.
--------------------------------------------------------------------------- */
const CAM = {
  // Pitch is the most consequential dial in this renderer. The visual spec
  // picked 0.72 rad (41°) for the look. v3 raises it: at 41° the Boiler's own
  // billboard hid roughly a third of the deck behind it, and depth
  // foreshortening made aiming into the distance feel inconsistent.
  // NOTE: the art bakes this angle in (spec §2.1) — lock it before generating.
  // live-overridable so the camera bake can be judged in-engine:
  //   ?pitch=0.72  (spec's 41 deg)   ?pitch=0.86  (v3's 49 deg)
  //   [ and ] nudge it by 1 degree while playing; F3 shows the current value
  pitch: (function(){
    const m = /[?&]pitch=([0-9.]+)/.exec((typeof location !== 'undefined' && location.search) || '');
    return m ? clamp(parseFloat(m[1]), 0.35, 1.35) : PRESET.pitch;
  })(),
  h: 760,                // camera height above the deck, ground units
  near: 460,             // distance from the camera to its focus point
  f: 1320,               // focal length at reference scale
  cx: 700, cy: 470,      // screen principal point
  _f: 1000, _sin: 0, _cos: 0,

  // --- follow state: focusX/focusY is the ground point the camera sits behind
  follow: PRESET.follow,
  back: PRESET.camBack,
  focusX: TUNING.deck.cx,
  focusY: TUNING.world.h,
  _init: false,

  // where the captain should sit on screen, as a fraction of height
  standFrac: 0.60,

  recompute(){
    this._sin = Math.sin(this.pitch);
    this._cos = Math.cos(this.pitch);
    this._f = this.f * View.unit;
    this.cx = View.w * 0.5;
    this.cy = View.h * (this.follow ? 0.50 : 0.55);
    // Solve for the camera offset that puts the captain at `standFrac`,
    // whatever the pitch. Without this, changing pitch silently re-frames the
    // whole fight — which made an earlier camera-angle comparison meaningless,
    // because it was really comparing framing rather than the art's bake.
    if (this.follow){
      const R = (this.cy - View.h * this.standFrac) / this._f;
      const den = this._sin - R * this._cos;
      const d = Math.abs(den) < 1e-4 ? this.near + 200
              : this.h * (R * this._sin + this._cos) / den;
      this.back = clamp(d - this.near, -260, 900);
    }
  },

  // Where the camera wants to sit, given the captain.
  //
  // The leash is against the DECK, not against the Boiler. An earlier version
  // clamped to keep the objective framed and it could shove the captain off the
  // top of the screen at the bow — losing yourself is far worse than losing
  // sight of the Boiler, which has an edge marker for exactly this reason.
  target(){
    const D = TUNING.deck, P = S.player;
    if (!this.follow || !P) return { x: D.cx, y: TUNING.world.h };
    const halfW = D.w * 0.22;                    // slack, not a hard rail
    const top = D.cy - D.h / 2, bot = D.cy + D.h / 2;
    return {
      x: clamp(P.x, D.cx - halfW, D.cx + halfW),
      y: clamp(P.y + this.back, top + 300, bot + 200),
    };
  },

  step(rt){
    const t = this.target();
    if (!this._init){ this.focusX = t.x; this.focusY = t.y; this._init = true; return; }
    const k = 1 - Math.exp(-rt / FEEL.camTau);   // frame-rate independent
    this.focusX += (t.x - this.focusX) * k;
    this.focusY += (t.y - this.focusY) * k;
  },

  // ground depth in front of the camera for a world y (small y = far)
  depth(y){ return this.near + (this.focusY - y); },

  // (x, y ground, hgt above deck) -> screen. k is the billboard scale factor.
  // x is measured from the ship's centreline, so the camera looks straight
  // down the keel no matter where the deck sits in world coordinates.
  project(x, y, hgt){
    const dy = (hgt || 0) - this.h;
    const dz = this.depth(y);
    const Yc =  dy * this._cos + dz * this._sin;
    const Zc = -dy * this._sin + dz * this._cos;
    const z  = Zc < 1 ? 1 : Zc;
    const k  = this._f / z;
    return { x: this.cx + (x - this.focusX) * k, y: this.cy - Yc * k, k, z };
  },

  // vertical squash for ground-flat circles at this depth (see spec §2.5)
  squash(y){
    const dz = this.depth(y);
    const Zc = this.h * this._sin + dz * this._cos;
    return this.h / (Zc < 1 ? 1 : Zc);
  },

  // screen -> ground plane (y = 0). Used for aiming.
  unproject(sx, sy){
    const X = (sx - this.cx) / this._f;
    const Y = -(sy - this.cy) / this._f;
    // solve for depth dz where the ray meets the deck (hgt = 0)
    //   Yc = -h*cos + dz*sin ,  Zc = h*sin + dz*cos ,  Y = Yc/Zc
    const den = (this._sin - Y * this._cos);
    let dz;
    if (Math.abs(den) < 1e-5) dz = 1e6;
    else dz = (Y * this.h * this._sin + this.h * this._cos) / den;
    if (dz < 40) dz = 40;
    const Zc = this.h * this._sin + dz * this._cos;
    return { x: X * Zc + this.focusX, y: this.focusY - (dz - this.near) };
  },

  horizonY(){ return this.cy - this._f * (this._sin / this._cos); },
};

// screen-space y for sorting: draw far first
function depthKey(y){ return -y; }

/* Ground-flat circle -> screen ellipse. The only correct way to lay art on the
   deck when the renderer has no perspective warp. */
function groundEllipsePath(x, y, r){
  const p = CAM.project(x, y, 0);
  const rx = r * p.k;
  const ry = rx * CAM.squash(y);
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, Math.max(0.2, rx), Math.max(0.2, ry), 0, 0, TAU);
  return { p, rx, ry };
}
function groundRing(x, y, r, stroke, lw, alpha){
  const g = groundEllipsePath(x, y, r);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.strokeStyle = stroke; ctx.lineWidth = lw * g.p.k;
  ctx.stroke();
  ctx.globalAlpha = 1;
  return g;
}
function groundDisc(x, y, r, fill, alpha){
  const g = groundEllipsePath(x, y, r);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = fill; ctx.fill();
  ctx.globalAlpha = 1;
  return g;
}

/* --- whose area is this? -----------------------------------------------------
   Red for "this will hurt you" and teal for "this is yours" is the whole system
   in v9, and it fails for the one in twelve men who cannot separate those two
   hues, in a greyscale screenshot, and on a washed-out laptop panel in daylight
   — which is most of the machines this build is aimed at.

   So the edge carries it as well. A hostile area has a BROKEN rim with teeth
   pointing outward: it is reaching for you, and the gaps make it read as
   unfinished and unsafe. A player area has a CONTINUOUS rim with ticks pointing
   inward: closed, contained, yours. Both still get their colour; the colour is
   just no longer the only thing carrying it.

   Everything that marks ground goes through one of these two. --------------- */
function hostileRing(x, y, r, col, lw, alpha, teeth){
  const g = groundEllipsePath(x, y, r);
  const a = alpha === undefined ? 1 : alpha;
  const n = teeth || 14;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = col;
  ctx.lineWidth = lw * g.p.k;
  // broken rim: draw every other arc segment
  for (let i = 0; i < n; i++){
    const a0 = i / n * TAU, a1 = a0 + (TAU / n) * 0.58;
    ctx.beginPath();
    ctx.ellipse(g.p.x, g.p.y, g.rx, g.ry, 0, a0, a1);
    ctx.stroke();
  }
  // teeth, outward
  ctx.lineWidth = Math.max(1, lw * 0.8) * g.p.k;
  for (let i = 0; i < n; i++){
    const t = (i + 0.29) / n * TAU;
    const cxp = Math.cos(t), syp = Math.sin(t);
    ctx.beginPath();
    ctx.moveTo(g.p.x + cxp * g.rx, g.p.y + syp * g.ry);
    ctx.lineTo(g.p.x + cxp * g.rx * 1.14, g.p.y + syp * g.ry * 1.14);
    ctx.stroke();
  }
  ctx.restore();
  return g;
}
function playerRing(x, y, r, col, lw, alpha, ticks){
  const g = groundEllipsePath(x, y, r);
  const a = alpha === undefined ? 1 : alpha;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = col;
  ctx.lineWidth = lw * g.p.k;
  ctx.beginPath();
  ctx.ellipse(g.p.x, g.p.y, g.rx, g.ry, 0, 0, TAU);
  ctx.stroke();
  ctx.lineWidth = Math.max(1, lw * 0.6) * g.p.k;
  const n = ticks || 12;
  for (let i = 0; i < n; i++){
    const t = i / n * TAU;
    const cxp = Math.cos(t), syp = Math.sin(t);
    ctx.beginPath();
    ctx.moveTo(g.p.x + cxp * g.rx, g.p.y + syp * g.ry);
    ctx.lineTo(g.p.x + cxp * g.rx * 0.86, g.p.y + syp * g.ry * 0.86);
    ctx.stroke();
  }
  ctx.restore();
  return g;
}

/* --- element motifs ----------------------------------------------------------
   The four elements are four colours, and the same argument applies: a build is
   supposed to be readable as "three Frost and one Ember" at a glance, and a
   glance at four coloured circles is not that for everyone. Each element gets a
   silhouette it keeps everywhere — on cards, on the HUD ring, on its own areas
   — so the vocabulary is learnable and survives greyscale.

     EMBER  upward triangle   — rising, a flame
     FROST  diamond           — a crystal, four flat faces
     ARC    zigzag chevron    — a discharge
     STEAM  circle            — pressure, no direction
--------------------------------------------------------------------------- */
function elementMotif(el, cx, cy, r, col, filled){
  ctx.save();
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.lineWidth = Math.max(1, r * 0.34);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  if (el === 'EMBER'){
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r * 0.92, cy + r * 0.72);
    ctx.lineTo(cx - r * 0.92, cy + r * 0.72); ctx.closePath();
  } else if (el === 'FROST'){
    ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy);
    ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy); ctx.closePath();
  } else if (el === 'ARC'){
    ctx.moveTo(cx - r, cy + r * 0.55); ctx.lineTo(cx - r * 0.15, cy - r * 0.2);
    ctx.lineTo(cx + r * 0.15, cy + r * 0.2); ctx.lineTo(cx + r, cy - r * 0.55);
    filled = false;   // a stroke, always: a filled zigzag is a blob
  } else {
    ctx.arc(cx, cy, r * 0.86, 0, TAU);
  }
  if (filled) ctx.fill(); else ctx.stroke();
  ctx.restore();
}
// A ground wedge (cone / arc telegraph) built from projected points — the
// projection of a straight ground line is straight, so a fan of segments is exact.
function groundWedgePath(x, y, r0, r1, a0, a1, steps){
  steps = steps || 14;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++){
    const a = lerp(a0, a1, i / steps);
    const p = CAM.project(x + Math.cos(a) * r1, y + Math.sin(a) * r1, 0);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  for (let i = steps; i >= 0; i--){
    const a = lerp(a0, a1, i / steps);
    const p = CAM.project(x + Math.cos(a) * r0, y + Math.sin(a) * r0, 0);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
}
// A ground quad along a line (line-burst / beam footprint)
function groundBandPath(x, y, ang, len, wid, from){
  const nx = -Math.sin(ang) * wid * 0.5, ny = Math.cos(ang) * wid * 0.5;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const x0 = x + dx * (from || 0), y0 = y + dy * (from || 0);
  const x1 = x + dx * len,         y1 = y + dy * len;
  const steps = 10;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++){
    const t = i / steps;
    const p = CAM.project(lerp(x0, x1, t) + nx, lerp(y0, y1, t) + ny, 0);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  for (let i = steps; i >= 0; i--){
    const t = i / steps;
    const p = CAM.project(lerp(x0, x1, t) - nx, lerp(y0, y1, t) - ny, 0);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
}

/* ---------------------------------------------------------------------------
   RENDER — drawing helpers
--------------------------------------------------------------------------- */
let _flash = false;
function C(c){ return _flash ? '#FFFFFF' : c; }
function ink(){ return _flash ? '#FFFFFF' : PAL.ink; }

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function fillStroke(fill, stroke, lw){
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); }
}
function ell(x, y, rx, ry, rot){
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1,rx), Math.max(0.1,ry), rot || 0, 0, TAU);
}
function circ(x, y, r){ ctx.beginPath(); ctx.arc(x, y, Math.max(0.1,r), 0, TAU); }

function hexToRgba(hex, a){
  if (hex[0] !== '#') return hex;
  let h = hex.slice(1);
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h, 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}
const _glowCache = new Map();
const GLOW_R = 64;
function glowSprite(col){
  let cn = _glowCache.get(col);
  if (cn) return cn;
  cn = document.createElement('canvas');
  cn.width = cn.height = GLOW_R * 2;
  const g2 = cn.getContext('2d');
  const gr = g2.createRadialGradient(GLOW_R, GLOW_R, 0, GLOW_R, GLOW_R, GLOW_R);
  gr.addColorStop(0,    hexToRgba(col, 1));
  gr.addColorStop(0.26, hexToRgba(col, 0.7));
  gr.addColorStop(0.6,  hexToRgba(col, 0.2));
  gr.addColorStop(1,    hexToRgba(col, 0));
  g2.fillStyle = gr; g2.fillRect(0, 0, GLOW_R*2, GLOW_R*2);
  _glowCache.set(col, cn);
  return cn;
}
function drawGlow(x, y, r, col, alpha){
  if (r <= 0) return;
  const a = alpha === undefined ? 1 : alpha;
  if (a <= 0) return;
  const prev = ctx.globalAlpha;
  ctx.globalAlpha = prev * Math.min(1, a);
  ctx.drawImage(glowSprite(col), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = prev;
}

function setFont(px, weight, condensed){
  ctx.font = (weight || 700) + ' ' + px + 'px ' +
    (condensed ? "Impact, Haettenschweiler, 'Arial Narrow', 'Franklin Gothic Bold', sans-serif"
               : "'Trebuchet MS', system-ui, sans-serif");
}
function textOut(t, x, y, fill, outline, lw, align){
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (outline){ ctx.lineWidth = lw || 5; ctx.lineJoin = 'round'; ctx.strokeStyle = outline; ctx.strokeText(t, x, y); }
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}

const _spriteCache = new Map();
function withCtx(c, fn){ const prev = ctx; ctx = c; try { fn(); } finally { ctx = prev; } }
function cachedSprite(key, w, h, draw){
  let cn = _spriteCache.get(key);
  if (cn) return cn;
  cn = document.createElement('canvas');
  cn.width = Math.max(2, Math.ceil(w)); cn.height = Math.max(2, Math.ceil(h));
  const c2 = cn.getContext('2d');
  withCtx(c2, () => draw(c2, cn.width, cn.height));
  _spriteCache.set(key, cn);
  return cn;
}

/* The two-source lighting rule from §1.2, applied as a post-pass so every
   procedurally drawn asset is lit identically and they all sit in one world:
   cool steel-blue rim from upper-left, warm lantern amber from lower-right. */
function applyTwoSourceLight(c2, w, h){
  c2.save();
  c2.globalCompositeOperation = 'source-atop';
  const cool = c2.createLinearGradient(0, 0, w * 0.9, h * 0.9);
  cool.addColorStop(0,    hexToRgba(PAL.moon, 0.60));
  cool.addColorStop(0.35, hexToRgba(PAL.moon, 0.18));
  cool.addColorStop(1,    hexToRgba(PAL.moon, 0));
  c2.fillStyle = cool; c2.fillRect(0, 0, w, h);
  const warm = c2.createLinearGradient(w, h, w * 0.15, h * 0.1);
  warm.addColorStop(0,    hexToRgba(PAL.lantern, 0.52));
  warm.addColorStop(0.42, hexToRgba(PAL.lantern, 0.14));
  warm.addColorStop(1,    hexToRgba(PAL.lantern, 0));
  c2.fillStyle = warm; c2.fillRect(0, 0, w, h);
  // just enough base darkening to keep them anchored, not enough to lose them
  const deep = c2.createLinearGradient(0, 0, 0, h);
  deep.addColorStop(0, 'rgba(13,11,18,0)');
  deep.addColorStop(1, 'rgba(13,11,18,0.18)');
  c2.fillStyle = deep; c2.fillRect(0, 0, w, h);
  c2.restore();
}

   were 28 files and 3.9 MB, more than every still in the game combined; packed

/* V5 loads production art by default; ?assets=0 is the clean procedural
   fallback. Older builds remain opt-in and can turn art on with
       skygear.html?assets=1
   or by setting window.SKYGEAR_USE_ASSETS = true before this script runs.
   (Note: browsers block file:// image reads, so serving over http is required
   once real PNGs are in place — the procedural build needs no server at all.) */
/* An image model will not crop 66 assets to a consistent frame, and the first
   four proved it: the figure's feet landed anywhere from 79.7% to 88.7% down
   the canvas. Rather than bounce them back for a re-crop, the engine measures
   each sprite's real alpha bounds on load and derives its own anchor, centre
   and figure height. Every asset then sits on the deck at the right size no
   matter how it was framed. */
function measureSprite(img){
  const N = 96;                                  // downsample; we only need bounds
  const cn = document.createElement('canvas');
  cn.width = cn.height = N;
  const c = cn.getContext('2d', { willReadFrequently: true });
  c.drawImage(img, 0, 0, N, N);
  let data;
  try { data = c.getImageData(0, 0, N, N).data; }
  catch (e) { return { anchor: 0.92, cx: 0.5, fig: 0.86 }; }   // tainted; fall back
  let top = -1, bot = -1, minX = N, maxX = -1;
  for (let y = 0; y < N; y++){
    let rowHas = false;
    for (let x = 0; x < N; x++){
      if (data[(y * N + x) * 4 + 3] > 40){
        rowHas = true;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
      }
    }
    if (rowHas){ if (top < 0) top = y; bot = y; }
  }
  if (top < 0) return { anchor: 0.92, cx: 0.5, fig: 0.86 };
  return {
    anchor: (bot + 1) / N,                       // where the feet are
    cx: ((minX + maxX + 1) / 2) / N,             // horizontal centre of the figure
    fig: Math.max(0.15, (bot - top + 1) / N),    // how much canvas the figure fills
  };
}

/* The loader.

   The game has always booted instantly — every asset has a procedural painter
   beside it, so a missing file degrades one sprite. What it did not do was
   *arrive* instantly: it fired sixty-odd image requests in one go, and the
   browser served them in manifest order over whatever bandwidth was going. On
   a 3 Mbit line that means the 2048x512 cloud plates and a currency icon
   nobody draws compete with the captain, and the thing the player is looking
   at is among the last to appear.

   So requests are issued in priority order, a few at a time, and each one swaps
   in the moment it decodes. Nothing waits for anything else, there is no
   loading screen, and the first thing to stop being a stand-in is the captain.

   The window is small on purpose. Browsers cap connections per origin anyway;
   the point of the cap here is that the queue stays a queue — with all of them
   in flight at once, priority is a suggestion. */
const Assets = {
  loaded: {}, meta: {}, animations: {}, ready: 0, total: 0,
  enabled: false, base: 'assets/',
  queue: [], inflight: 0, WINDOW: 6, requested: 0,

  init(){
    const q = (typeof location !== 'undefined' && location.search) || '';
    // Art used to be opt-in behind ?assets=1, which meant anyone opening the
    // build from the site got the procedural stand-ins and never saw a single
    // delivered asset. Painted art is the default now; ?assets=0 restores the
    // all-procedural look for comparison. Missing files still fall back
    // individually, so a part-delivered manifest degrades sprite by sprite.
    this.enabled = !/[?&]assets=0/.test(q) && (window.SKYGEAR_USE_ASSETS !== false);

    // Only assets that something actually draws are counted. The badge on the
    // title is a claim about how finished the game looks, and three icons that
    // load and are never drawn made that claim wrong in the flattering
    // direction.
    const keys = Object.keys(ASSET_MANIFEST).filter(k => !ASSET_MANIFEST[k].unused);
    const animKeys = Object.keys(ANIMATION_MANIFEST);
    this.total = keys.length + animKeys.length;
    if (!this.enabled) return;

    // ordered: everything named in ASSET_PRIORITY, then everything else
    const named = [];
    for (const tier of ASSET_PRIORITY)
      for (const k of tier) if (ASSET_MANIFEST[k] && !ASSET_MANIFEST[k].unused) named.push(k);
    const rest = keys.filter(k => named.indexOf(k) < 0);

    for (const k of named.concat(rest)) this.queue.push({ kind: 'still', key: k });
    // Strips are one request each and land behind the stills they replace,
    // because a still is what draws until its cycle decodes.
    for (const k of animKeys) this.queue.push({ kind: 'anim', key: k });
    this.pump();
  },

  pump(){
    while (this.inflight < this.WINDOW && this.queue.length){
      const job = this.queue.shift();
      this.requested++;
      this.inflight++;
      if (job.kind === 'still') this.loadStill(job.key);
      else this.loadAnimation(job.key, ANIMATION_MANIFEST[job.key]);
    }
  },
  // One slot, released exactly once whether the image arrived or 404'd. A
  // handler that forgets to release stalls the whole queue behind it.
  done(){ this.inflight--; this.pump(); },

  loadStill(k){
    const im = new Image();
    let settled = false;
    const finish = (ok) => {
      if (settled) return;
      settled = true;
      if (ok && im.naturalWidth > 0){
        this.loaded[k] = im;
        this.meta[k] = measureSprite(im);
        im.__meta = this.meta[k];
        this.ready++;
      }
      this.done();
    };
    im.onload = () => finish(true);
    im.onerror = () => finish(false);
    im.src = this.base + ASSET_MANIFEST[k].file.replace(/^assets\//, '');
  },

  /* Strips, not loose frames: one PNG per cycle, sliced on demand. The two
     delivered cycles were 28 separate files and 3.9 MB — more than every still
     in the game combined — and the full cast in that shape would have been ~270
     requests. A strip is one request and one decode.

     `frames` is left empty until the strip has loaded; `animation()` returns
     null until then and the caller draws the still, which is exactly the
     behaviour that makes a part-delivered manifest safe. */
  loadAnimation(k, spec){
    const sequence = this.animations[k] = {
      img: null, frames: null, count: spec.count, fps: spec.fps,
      ready: 0, meta: spec.meta,
    };
    const im = new Image();
    let settled = false;
    const finish = (ok) => {
      if (settled) return;
      settled = true;
      if (ok && im.naturalWidth > 0){
        sequence.img = im;
        sequence.once = !!spec.once;
        sequence.fw = Math.round(im.naturalWidth / spec.count);
        sequence.fh = im.naturalHeight;
        sequence.ready = spec.count;
        this.ready++;
      }
      this.done();
    };
    im.onload = () => finish(true);
    im.onerror = () => finish(false);
    im.src = spec.strip;
  },
  get(k){ return this.loaded[k] || null; },
  has(k){ return !!this.loaded[k]; },

  /* Returns a frame descriptor into the strip, or null if the cycle has not
     arrived. Null is the normal case for most of a session's first seconds and
     every caller already handles it by drawing the still — which is the whole
     reason stills are never deleted once a cycle exists. */
  animation(k, time){
    const seq = this.animations[k];
    if (!seq || !seq.img) return null;
    let i;
    if (seq.once){
      // Plays through and holds its last frame. `time` is seconds since the
      // action started, so a caller that keeps its own clock gets a one-shot;
      // one that passes a free-running clock would get a loop, which is why
      // every `once` caller passes an elapsed time and not S.rt.
      i = Math.floor(Math.max(0, time) * seq.fps);
      if (i >= seq.count) return null;          // finished — fall back to the still
    } else {
      i = Math.floor(Math.max(0, time) * seq.fps) % seq.count;
    }
    return { strip: seq.img, sx: i * seq.fw, width: seq.fw, height: seq.fh, __meta: seq.meta };
  },
  hasAnim(k){ const s = this.animations[k]; return !!(s && s.img); },
};
Assets.init();


/* ---------------------------------------------------------------------------
   PROCEDURAL BILLBOARD ART
   Stand-ins for the §4.1/4.2 character sheets, painted to the same rules:
   chibi proportions, thick near-black ink outline, flat colour fields, the
   standard two-source light applied as a post-pass, feet on the bottom-center
   anchor, no baked contact shadow. Drawn once into a sprite, then blitted.
--------------------------------------------------------------------------- */
const SPR = 256;              // design height for a normal character sprite
const SPR_BOSS = 460;
const OUT = 7;                // ink outline weight (~2.7% of sprite height)

// world height of each billboard, in ground units
const BILLBOARD_H = {
  hero: 128, SCRAPPER: 120, GUNNER: 118, ARMORED: 172, SWARM: 76, BOSS: 360,
};

function limb(x0, y0, x1, y1, w, col){
  ctx.lineCap = 'round';
  ctx.strokeStyle = ink(); ctx.lineWidth = w + OUT;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
}
function blob(x, y, rx, ry, col, rot){
  ell(x, y, rx, ry, rot); fillStroke(C(col), ink(), OUT);
}
function plate(x, y, w, h, r, col){
  rr(x - w/2, y - h/2, w, h, r); fillStroke(C(col), ink(), OUT);
}
function rivets(pts, col){
  ctx.fillStyle = C(col || PAL.brass);
  for (const p of pts){ circ(p[0], p[1], 3.4); ctx.fill(); }
}
function specular(x, y, rx, ry, rot, a){
  ctx.save(); ctx.globalAlpha = a === undefined ? 0.5 : a;
  ctx.fillStyle = PAL.brassLite;
  ell(x, y, rx, ry, rot || 0); ctx.fill();
  ctx.restore();
}
function emissive(x, y, r, col, core){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  drawGlow(x, y, r * 2.6, col, 0.75);
  ctx.restore();
  circ(x, y, r); fillStroke(col, ink(), OUT * 0.6);
  if (core !== false){ ctx.fillStyle = '#FFFFFF'; circ(x - r*0.2, y - r*0.2, r*0.4); ctx.fill(); }
}
