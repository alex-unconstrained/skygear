     · ground-flat art is authored as circles and squashed to ellipses (affine)
     · the deck is code-drawn projected quads — no ground texture
     · sky / clouds / envelope are flat screen-space parallax layers
   Image assets drop in by manifest path (§2.1, §4); anything missing is drawn
   procedurally in the same style so the game is always playable.
============================================================================ */

/* ---------------------------------------------------------------------------
   CAMERA — one pinhole. project() is the only place perspective happens.
   v3 lets it track the captain; v2 pins it to the deck centre.
--------------------------------------------------------------------------- */
const CAM = {
  // Pitch is the most consequential dial in this renderer. The visual spec
  // picked 0.72 rad (41°) for the look. v3 raises it: at 41° the Boiler's own
  // billboard hid roughly a third of the deck behind it, and depth
  // foreshortening made aiming into the distance feel inconsistent.
  // NOTE: the art bakes this angle in (spec §2.1) — lock it before generating.
  // live-overridable so the camera bake can be judged in-engine:
  //   ?pitch=0.72  (spec's 41 deg)   ?pitch=0.86  (v3's 49 deg)
  //   [ and ] nudge it by 1 degree while playing; F3 shows the current value
  pitch: (function(){
    const m = /[?&]pitch=([0-9.]+)/.exec((typeof location !== 'undefined' && location.search) || '');
    return m ? clamp(parseFloat(m[1]), 0.35, 1.35) : PRESET.pitch;
  })(),
  h: 760,                // camera height above the deck, ground units
  near: 460,             // distance from the camera to its focus point
  f: 1320,               // focal length at reference scale
  cx: 700, cy: 470,      // screen principal point
  _f: 1000, _sin: 0, _cos: 0,

  // --- follow state: focusX/focusY is the ground point the camera sits behind
  follow: PRESET.follow,
  back: PRESET.camBack,
  focusX: TUNING.deck.cx,
  focusY: TUNING.world.h,
  _init: false,

  // where the captain should sit on screen, as a fraction of height
  standFrac: 0.60,

  recompute(){
    this._sin = Math.sin(this.pitch);
    this._cos = Math.cos(this.pitch);
    this._f = this.f * View.unit;
    this.cx = View.w * 0.5;
    this.cy = View.h * (this.follow ? 0.50 : 0.55);
    // Solve for the camera offset that puts the captain at `standFrac`,
    // whatever the pitch. Without this, changing pitch silently re-frames the
    // whole fight — which made an earlier camera-angle comparison meaningless,
    // because it was really comparing framing rather than the art's bake.
    if (this.follow){
      const R = (this.cy - View.h * this.standFrac) / this._f;
      const den = this._sin - R * this._cos;
      const d = Math.abs(den) < 1e-4 ? this.near + 200
              : this.h * (R * this._sin + this._cos) / den;
      this.back = clamp(d - this.near, -260, 900);
    }
  },

  // Where the camera wants to sit, given the captain.
  //
  // The leash is against the DECK, not against the Boiler. An earlier version
  // clamped to keep the objective framed and it could shove the captain off the
  // top of the screen at the bow — losing yourself is far worse than losing
  // sight of the Boiler, which has an edge marker for exactly this reason.
  target(){
    const D = TUNING.deck, P = S.player;
    if (!this.follow || !P) return { x: D.cx, y: TUNING.world.h };
    const halfW = D.w * 0.22;                    // slack, not a hard rail
    const top = D.cy - D.h / 2, bot = D.cy + D.h / 2;
    return {
      x: clamp(P.x, D.cx - halfW, D.cx + halfW),
      y: clamp(P.y + this.back, top + 300, bot + 200),
    };
  },

  step(rt){
    const t = this.target();
    if (!this._init){ this.focusX = t.x; this.focusY = t.y; this._init = true; return; }
    const k = 1 - Math.exp(-rt / FEEL.camTau);   // frame-rate independent
    this.focusX += (t.x - this.focusX) * k;
    this.focusY += (t.y - this.focusY) * k;
  },

  // ground depth in front of the camera for a world y (small y = far)
  depth(y){ return this.near + (this.focusY - y); },

  // (x, y ground, hgt above deck) -> screen. k is the billboard scale factor.
  // x is measured from the ship's centreline, so the camera looks straight
  // down the keel no matter where the deck sits in world coordinates.
  project(x, y, hgt){
    const dy = (hgt || 0) - this.h;
    const dz = this.depth(y);
    const Yc =  dy * this._cos + dz * this._sin;
    const Zc = -dy * this._sin + dz * this._cos;
    const z  = Zc < 1 ? 1 : Zc;
    const k  = this._f / z;
    return { x: this.cx + (x - this.focusX) * k, y: this.cy - Yc * k, k, z };
  },

  // vertical squash for ground-flat circles at this depth (see spec §2.5)
  squash(y){
    const dz = this.depth(y);
    const Zc = this.h * this._sin + dz * this._cos;
    return this.h / (Zc < 1 ? 1 : Zc);
  },

  // screen -> ground plane (y = 0). Used for aiming.
  unproject(sx, sy){
    const X = (sx - this.cx) / this._f;
    const Y = -(sy - this.cy) / this._f;
    // solve for depth dz where the ray meets the deck (hgt = 0)
    //   Yc = -h*cos + dz*sin ,  Zc = h*sin + dz*cos ,  Y = Yc/Zc
    const den = (this._sin - Y * this._cos);
    let dz;
    if (Math.abs(den) < 1e-5) dz = 1e6;
    else dz = (Y * this.h * this._sin + this.h * this._cos) / den;
    if (dz < 40) dz = 40;
    const Zc = this.h * this._sin + dz * this._cos;
    return { x: X * Zc + this.focusX, y: this.focusY - (dz - this.near) };
  },

  horizonY(){ return this.cy - this._f * (this._sin / this._cos); },
};

// screen-space y for sorting: draw far first
function depthKey(y){ return -y; }

/* Ground-flat circle -> screen ellipse. The only correct way to lay art on the
   deck when the renderer has no perspective warp. */
function groundEllipsePath(x, y, r){
  const p = CAM.project(x, y, 0);
  const rx = r * p.k;
  const ry = rx * CAM.squash(y);
  ctx.beginPath();
  ctx.ellipse(p.x, p.y, Math.max(0.2, rx), Math.max(0.2, ry), 0, 0, TAU);
  return { p, rx, ry };
}
function groundRing(x, y, r, stroke, lw, alpha){
  const g = groundEllipsePath(x, y, r);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.strokeStyle = stroke; ctx.lineWidth = lw * g.p.k;
  ctx.stroke();
  ctx.globalAlpha = 1;
  return g;
}
function groundDisc(x, y, r, fill, alpha){
  const g = groundEllipsePath(x, y, r);
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = fill; ctx.fill();
  ctx.globalAlpha = 1;
  return g;
}
// A ground wedge (cone / arc telegraph) built from projected points — the
// projection of a straight ground line is straight, so a fan of segments is exact.
function groundWedgePath(x, y, r0, r1, a0, a1, steps){
  steps = steps || 14;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++){
    const a = lerp(a0, a1, i / steps);
    const p = CAM.project(x + Math.cos(a) * r1, y + Math.sin(a) * r1, 0);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  for (let i = steps; i >= 0; i--){
    const a = lerp(a0, a1, i / steps);
    const p = CAM.project(x + Math.cos(a) * r0, y + Math.sin(a) * r0, 0);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
}
// A ground quad along a line (line-burst / beam footprint)
function groundBandPath(x, y, ang, len, wid, from){
  const nx = -Math.sin(ang) * wid * 0.5, ny = Math.cos(ang) * wid * 0.5;
  const dx = Math.cos(ang), dy = Math.sin(ang);
  const x0 = x + dx * (from || 0), y0 = y + dy * (from || 0);
  const x1 = x + dx * len,         y1 = y + dy * len;
  const steps = 10;
  ctx.beginPath();
  for (let i = 0; i <= steps; i++){
    const t = i / steps;
    const p = CAM.project(lerp(x0, x1, t) + nx, lerp(y0, y1, t) + ny, 0);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  for (let i = steps; i >= 0; i--){
    const t = i / steps;
    const p = CAM.project(lerp(x0, x1, t) - nx, lerp(y0, y1, t) - ny, 0);
    ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
}

/* ---------------------------------------------------------------------------
   RENDER — drawing helpers
--------------------------------------------------------------------------- */
let _flash = false;
function C(c){ return _flash ? '#FFFFFF' : c; }
function ink(){ return _flash ? '#FFFFFF' : PAL.ink; }

function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function fillStroke(fill, stroke, lw){
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); }
}
function ell(x, y, rx, ry, rot){
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1,rx), Math.max(0.1,ry), rot || 0, 0, TAU);
}
function circ(x, y, r){ ctx.beginPath(); ctx.arc(x, y, Math.max(0.1,r), 0, TAU); }

function hexToRgba(hex, a){
  if (hex[0] !== '#') return hex;
  let h = hex.slice(1);
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const n = parseInt(h, 16);
  return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
}
const _glowCache = new Map();
const GLOW_R = 64;
function glowSprite(col){
  let cn = _glowCache.get(col);
  if (cn) return cn;
  cn = document.createElement('canvas');
  cn.width = cn.height = GLOW_R * 2;
  const g2 = cn.getContext('2d');
  const gr = g2.createRadialGradient(GLOW_R, GLOW_R, 0, GLOW_R, GLOW_R, GLOW_R);
  gr.addColorStop(0,    hexToRgba(col, 1));
  gr.addColorStop(0.26, hexToRgba(col, 0.7));
  gr.addColorStop(0.6,  hexToRgba(col, 0.2));
  gr.addColorStop(1,    hexToRgba(col, 0));
  g2.fillStyle = gr; g2.fillRect(0, 0, GLOW_R*2, GLOW_R*2);
  _glowCache.set(col, cn);
  return cn;
}
function drawGlow(x, y, r, col, alpha){
  if (r <= 0) return;
  const a = alpha === undefined ? 1 : alpha;
  if (a <= 0) return;
  const prev = ctx.globalAlpha;
  ctx.globalAlpha = prev * Math.min(1, a);
  ctx.drawImage(glowSprite(col), x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = prev;
}

function setFont(px, weight, condensed){
  ctx.font = (weight || 700) + ' ' + px + 'px ' +
    (condensed ? "Impact, Haettenschweiler, 'Arial Narrow', 'Franklin Gothic Bold', sans-serif"
               : "'Trebuchet MS', system-ui, sans-serif");
}
function textOut(t, x, y, fill, outline, lw, align){
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (outline){ ctx.lineWidth = lw || 5; ctx.lineJoin = 'round'; ctx.strokeStyle = outline; ctx.strokeText(t, x, y); }
  ctx.fillStyle = fill; ctx.fillText(t, x, y);
}

const _spriteCache = new Map();
function withCtx(c, fn){ const prev = ctx; ctx = c; try { fn(); } finally { ctx = prev; } }
function cachedSprite(key, w, h, draw){
  let cn = _spriteCache.get(key);
  if (cn) return cn;
  cn = document.createElement('canvas');
  cn.width = Math.max(2, Math.ceil(w)); cn.height = Math.max(2, Math.ceil(h));
  const c2 = cn.getContext('2d');
  withCtx(c2, () => draw(c2, cn.width, cn.height));
  _spriteCache.set(key, cn);
  return cn;
}

/* The two-source lighting rule from §1.2, applied as a post-pass so every
   procedurally drawn asset is lit identically and they all sit in one world:
   cool steel-blue rim from upper-left, warm lantern amber from lower-right. */
function applyTwoSourceLight(c2, w, h){
  c2.save();
  c2.globalCompositeOperation = 'source-atop';
  const cool = c2.createLinearGradient(0, 0, w * 0.9, h * 0.9);
  cool.addColorStop(0,    hexToRgba(PAL.moon, 0.60));
  cool.addColorStop(0.35, hexToRgba(PAL.moon, 0.18));
  cool.addColorStop(1,    hexToRgba(PAL.moon, 0));
  c2.fillStyle = cool; c2.fillRect(0, 0, w, h);
  const warm = c2.createLinearGradient(w, h, w * 0.15, h * 0.1);
  warm.addColorStop(0,    hexToRgba(PAL.lantern, 0.52));
  warm.addColorStop(0.42, hexToRgba(PAL.lantern, 0.14));
  warm.addColorStop(1,    hexToRgba(PAL.lantern, 0));
  c2.fillStyle = warm; c2.fillRect(0, 0, w, h);
  // just enough base darkening to keep them anchored, not enough to lose them
  const deep = c2.createLinearGradient(0, 0, 0, h);
  deep.addColorStop(0, 'rgba(13,11,18,0)');
  deep.addColorStop(1, 'rgba(13,11,18,0.18)');
  c2.fillStyle = deep; c2.fillRect(0, 0, w, h);
  c2.restore();
}

/* Loading is opt-in so that an asset-less checkout has a clean console and
   still plays: the procedural stand-ins are complete. Turn art on with
       skygear.html?assets=1
   or by setting window.SKYGEAR_USE_ASSETS = true before this script runs.
   (Note: browsers block file:// image reads, so serving over http is required
   once real PNGs are in place — the procedural build needs no server at all.) */
/* An image model will not crop 66 assets to a consistent frame, and the first
   four proved it: the figure's feet landed anywhere from 79.7% to 88.7% down
   the canvas. Rather than bounce them back for a re-crop, the engine measures
   each sprite's real alpha bounds on load and derives its own anchor, centre
   and figure height. Every asset then sits on the deck at the right size no
   matter how it was framed. */
function measureSprite(img){
  const N = 96;                                  // downsample; we only need bounds
  const cn = document.createElement('canvas');
  cn.width = cn.height = N;
  const c = cn.getContext('2d', { willReadFrequently: true });
  c.drawImage(img, 0, 0, N, N);
  let data;
  try { data = c.getImageData(0, 0, N, N).data; }
  catch (e) { return { anchor: 0.92, cx: 0.5, fig: 0.86 }; }   // tainted; fall back
  let top = -1, bot = -1, minX = N, maxX = -1;
  for (let y = 0; y < N; y++){
    let rowHas = false;
    for (let x = 0; x < N; x++){
      if (data[(y * N + x) * 4 + 3] > 40){
        rowHas = true;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
      }
    }
    if (rowHas){ if (top < 0) top = y; bot = y; }
  }
  if (top < 0) return { anchor: 0.92, cx: 0.5, fig: 0.86 };
  return {
    anchor: (bot + 1) / N,                       // where the feet are
    cx: ((minX + maxX + 1) / 2) / N,             // horizontal centre of the figure
    fig: Math.max(0.15, (bot - top + 1) / N),    // how much canvas the figure fills
  };
}

const Assets = {
  loaded: {}, meta: {}, ready: 0, total: 0, enabled: false, set: '40', base: 'assets/',

  init(){
    const q = (typeof location !== 'undefined' && location.search) || '';
    this.enabled = window.SKYGEAR_USE_ASSETS === true || /[?&]assets=1/.test(q);
    // ?art=49 swaps the whole set for the 49-degree bake, so the camera angle
    // can be judged as a MATCHED PAIR (art and engine at the same angle)
    // rather than by varying the engine against one fixed bake.
    const am = /[?&]art=([a-z0-9-]+)/i.exec(q);
    this.set = am ? am[1] : '40';
    this.base = this.set === '40' ? 'assets/' : 'assets-' + this.set + '/';
    const keys = Object.keys(ASSET_MANIFEST);
    this.total = keys.length;
    if (!this.enabled) return;
    for (const k of keys){
      const im = new Image();
      im.onload = () => {
        if (im.naturalWidth > 0){
          this.loaded[k] = im;
          this.meta[k] = measureSprite(im);
          im.__meta = this.meta[k];
          this.ready++;
        }
      };
      im.onerror = () => {};
      im.src = this.base + ASSET_MANIFEST[k].file.replace(/^assets\//, '');
    }
  },
  get(k){ return this.loaded[k] || null; },
  has(k){ return !!this.loaded[k]; },
};
Assets.init();


/* ---------------------------------------------------------------------------
   PROCEDURAL BILLBOARD ART
   Stand-ins for the §4.1/4.2 character sheets, painted to the same rules:
   chibi proportions, thick near-black ink outline, flat colour fields, the
   standard two-source light applied as a post-pass, feet on the bottom-center
   anchor, no baked contact shadow. Drawn once into a sprite, then blitted.
--------------------------------------------------------------------------- */
const SPR = 256;              // design height for a normal character sprite
const SPR_BOSS = 460;
const OUT = 7;                // ink outline weight (~2.7% of sprite height)

// world height of each billboard, in ground units
const BILLBOARD_H = {
  hero: 128, SCRAPPER: 120, GUNNER: 118, ARMORED: 172, SWARM: 76, BOSS: 360,
};

function limb(x0, y0, x1, y1, w, col){
  ctx.lineCap = 'round';
  ctx.strokeStyle = ink(); ctx.lineWidth = w + OUT;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w;

}
function blob(x, y, rx, ry, col, rot){
  ell(x, y, rx, ry, rot); fillStroke(C(col), ink(), OUT);

function plate(x, y, w, h, r, col){

function rivets(pts, col){

function specular(x, y, rx, ry, rot, a){

function emissive(x, y, r, col, core){
  ctx.save(); ctx.globalCompositeOperation = 'lighter';

/* --- sprite bake + lookup ------------------------------------------------ */
const CHAR_PAINT = {
  hero: paintHero, SCRAPPER: paintAutomaton, SWARM: paintGremlin,
  GUNNER: paintDrone, ARMORED: paintKnight, BOSS: paintColossus,
};
function charSprite(kind, view){        // view: 'front_idle' | 'back_idle' | 'front_attack'
  const key = 'char|' + kind + '|' + view;
  const boss = kind === 'BOSS';
  const H = boss ? SPR_BOSS : SPR;
  const W = Math.round(H * (boss ? 1.15 : 0.95));
  return cachedSprite(key, W, H, (c2, w, h) => {
    c2.save();
    c2.translate(w / 2, h * 0.94);
    const src = boss ? 420 : 190;                 // painter units -> sprite height
    const s = (h * 0.86) / src;
    c2.scale(s, s);
    c2.lineJoin = 'round'; c2.lineCap = 'round';
    CHAR_PAINT[kind](view === 'back_idle', view === 'front_attack');
    c2.restore();
    applyTwoSourceLight(c2, w, h);
  });
}
// asset first, procedural stand-in second
function charImage(kind, view){
  const assetKey = (kind === 'hero' ? 'hero' : kind) + '_' + view;
  return Assets.get(assetKey) || charSprite(kind, view);
}


/* ---------------------------------------------------------------------------
   ENVIRONMENT — flat screen-space parallax layers (§2.7, §4.4)
--------------------------------------------------------------------------- */
let _skyCv = null, _cloudFar = null, _cloudNear = null, _vigCv = null, _redCv = null;

function buildSky(){
  const w = Math.max(2, Math.round(View.w)), h = Math.max(2, Math.round(View.h));
  _skyCv = document.createElement('canvas'); _skyCv.width = w; _skyCv.height = h;
  const c = _skyCv.getContext('2d');
  const g = c.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0.00, '#100E1C');
  g.addColorStop(0.22, PAL.skyDeep);
  g.addColorStop(0.55, PAL.skyMid);
  g.addColorStop(0.80, '#3A3358');
  g.addColorStop(1.00, '#4A3A4E');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
  // one dramatic moonbreak, upper-left — the cool key light of the whole scene
  const mx = w * 0.24, my = h * 0.16;
  const mg = c.createRadialGradient(mx, my, 4, mx, my, Math.max(w, h) * 0.5);
  mg.addColorStop(0,    hexToRgba(PAL.moon, 0.75));
  mg.addColorStop(0.10, hexToRgba(PAL.moon, 0.28));
  mg.addColorStop(0.34, hexToRgba(PAL.moon, 0.07));
  mg.addColorStop(1,    hexToRgba(PAL.moon, 0));
  c.fillStyle = mg; c.fillRect(0, 0, w, h);
  c.fillStyle = hexToRgba('#E8EEF8', 0.9);
  c.beginPath(); c.arc(mx, my, Math.max(9, h * 0.026), 0, TAU); c.fill();
  // warm horizon ember, lower-right
  const eg = c.createRadialGradient(w * 0.86, h * 0.74, 4, w * 0.86, h * 0.74, w * 0.5);
  eg.addColorStop(0, hexToRgba(PAL.lantern, 0.20));
  eg.addColorStop(1, hexToRgba(PAL.lantern, 0));
  c.fillStyle = eg; c.fillRect(0, 0, w, h);
  // darkest at the top corners for a natural vignette
  const cg = c.createRadialGradient(w/2, h*0.55, Math.min(w,h)*0.25, w/2, h*0.55, Math.max(w,h)*0.8);
  cg.addColorStop(0, 'rgba(13,11,18,0)'); cg.addColorStop(1, 'rgba(13,11,18,0.72)');
  c.fillStyle = cg; c.fillRect(0, 0, w, h);

  const strip = (hh, tint, alpha, bold) => {
    const cn = document.createElement('canvas');
    cn.width = 1024; cn.height = hh;
    const c2 = cn.getContext('2d');
    for (let i = 0; i < (bold ? 16 : 22); i++){
      const x = (i * 137.5) % 1024, y = hh * (bold ? 0.55 : 0.6) + Math.sin(i * 2.3) * hh * 0.2;
      const s = (bold ? 90 : 58) * (0.6 + ((i * 37) % 10) / 10);
      c2.globalAlpha = alpha * (0.5 + ((i * 53) % 10) / 20);
      c2.fillStyle = tint;
      c2.beginPath();
      for (let p = 0; p < 5; p++)
        c2.ellipse(x + (p - 2) * s * 0.5, y + Math.sin(p * 1.7 + i) * s * 0.12,
                   s * (0.5 + (p % 3) * 0.22), s * 0.34, 0, 0, TAU);
      c2.fill();
    }
    return cn;
  };
  _cloudFar  = strip(160, '#3E3A5E', 0.55, false);
  _cloudNear = strip(200, '#4A3F5C', 0.6, true);

  const mk = (inner, outer, r0, r1) => {
    const cn = document.createElement('canvas'); cn.width = w; cn.height = h;
    const c2 = cn.getContext('2d');
    const vg = c2.createRadialGradient(w/2, h/2, Math.min(w,h)*r0, w/2, h/2, Math.max(w,h)*r1);
    vg.addColorStop(0, inner); vg.addColorStop(1, outer);
    c2.fillStyle = vg; c2.fillRect(0, 0, w, h);
    return cn;
  };
  _vigCv = mk('rgba(13,11,18,0)', 'rgba(13,11,18,0.66)', 0.30, 0.76);
  _redCv = mk('rgba(255,61,46,0)', 'rgba(255,61,46,1)', 0.24, 0.70);
}

function drawEnvironment(){
  const w = View.w, h = View.h;
  const sky = Assets.get('env_sky');
  if (sky) ctx.drawImage(sky, 0, 0, w, h);
  else ctx.drawImage(_skyCv, 0, 0, w, h);

  const hz = CAM.horizonY();
  // parallax cloud seas, drifting past the ship
  const band = (img, key, y, hh, spd, alpha) => {
    const a = Assets.get(key) || img;
    const tw = w * 1.6;
    let off = (S.rt * spd) % tw;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.drawImage(a, -off, y, tw, hh);
    ctx.drawImage(a, -off + tw, y, tw, hh);
    ctx.restore();
  };
  band(_cloudFar,  'env_clouds_far',  hz - h * 0.10, h * 0.20, 7,  0.75);
  band(_cloudNear, 'env_clouds_near', hz - h * 0.02, h * 0.26, 17, 0.85);

  // a distant escort, running with us
  const esc = Assets.get('env_airship');
  ctx.save();
  ctx.globalAlpha = 0.55;
  const ex = w * 0.5 + Math.sin(S.rt * 0.06) * w * 0.3, ey = hz - h * 0.09;
  if (esc) ctx.drawImage(esc, ex - 90, ey - 45, 180, 90);
  else {
    ctx.fillStyle = '#171425';
    ell(ex, ey, 76, 26, -0.06); ctx.fill();
    ell(ex + 6, ey + 22, 40, 9, -0.06); ctx.fill();
    ctx.fillStyle = PAL.lantern;
    for (let i = -2; i <= 2; i++){ circ(ex + i * 17, ey + 22, 1.8); ctx.fill(); }
  }
  ctx.restore();
}

// The bow rises at the far end of the deck; the envelope hangs over the near edge.
function drawBowPiece(){
  const bow = Assets.get('env_bow');
  const D = TUNING.deck;
  const p = CAM.project(D.cx, D.cy - D.h/2 - D.bow, 0);
  const wpx = D.w * p.k * 2.0, hpx = wpx * 0.62;
  if (bow){ ctx.drawImage(bow, p.x - wpx/2, p.y - hpx * 0.92, wpx, hpx); return; }
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.lineJoin = 'round';
  const s = p.k * 2.1;
  ctx.scale(s, s);
  // prow mass
  ctx.beginPath();
  ctx.moveTo(-150, 8); ctx.quadraticCurveTo(-96, -74, 0, -92);
  ctx.quadraticCurveTo(96, -74, 150, 8);
  ctx.quadraticCurveTo(0, 30, -150, 8);
  ctx.closePath();
  fillStroke('#221B22', PAL.ink, 5);
  ctx.strokeStyle = PAL.brass; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-132, 0); ctx.quadraticCurveTo(0, -66, 132, 0); ctx.stroke();
  // figurehead
  ctx.beginPath();
  ctx.moveTo(0, -92); ctx.quadraticCurveTo(-20, -128, 0, -150);
  ctx.quadraticCurveTo(20, -128, 0, -92); ctx.closePath();
  fillStroke(PAL.brass, PAL.ink, 5);
  // navigation lanterns
  for (const lx of [-112, 112]){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    drawGlow(lx, -14, 34, lx < 0 ? PAL.danger : PAL.copper, 0.8);
    ctx.restore();
    circ(lx, -14, 7); fillStroke(lx < 0 ? PAL.danger : PAL.copper, PAL.ink, 4);
  }
  ctx.restore();
}

function drawEnvelope(){
  const env = Assets.get('env_envelope');
  const w = View.w, h = View.h;
  if (env){ ctx.drawImage(env, 0, 0, w, h * 0.42); return; }
  ctx.save();
  // the underside of our own gas bag, filling the top of the frame
  const eh = h * 0.44;
  const g = ctx.createLinearGradient(0, -eh * 0.4, 0, eh);
  g.addColorStop(0, '#241E33'); g.addColorStop(0.6, '#1C1828'); g.addColorStop(1, 'rgba(20,18,27,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-w * 0.1, -eh);
  ctx.quadraticCurveTo(w * 0.5, eh * 1.5, w * 1.1, -eh);
  ctx.lineTo(w * 1.1, -eh * 1.2); ctx.lineTo(-w * 0.1, -eh * 1.2);
  ctx.closePath(); ctx.fill();
  // brass ribs
  ctx.strokeStyle = hexToRgba(PAL.brass, 0.5); ctx.lineWidth = 5;
  for (let i = -3; i <= 3; i++){
    const x = w * 0.5 + i * w * 0.15;
    ctx.beginPath();
    ctx.moveTo(x, -eh);
    ctx.quadraticCurveTo(x + i * 8, eh * 0.55, x + i * 16, eh * (1 - Math.abs(i) * 0.13));
    ctx.stroke();
  }
  // netting + rigging dropping toward the viewer
  ctx.strokeStyle = 'rgba(13,11,18,0.7)'; ctx.lineWidth = 3;
  for (let i = -6; i <= 6; i++){
    const x = w * 0.5 + i * w * 0.085;
    ctx.beginPath();
    ctx.moveTo(x, -eh * 0.2); ctx.lineTo(x + i * 30, eh * 1.35);
    ctx.stroke();
  }
  // netting across the canvas
  ctx.strokeStyle = 'rgba(13,11,18,0.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++){
    const y = -eh * 0.5 + i * eh * 0.34;
    ctx.beginPath();
    ctx.moveTo(-w * 0.1, y);
    ctx.quadraticCurveTo(w * 0.5, y + eh * 0.55, w * 1.1, y);
    ctx.stroke();
  }
  // storm light grazing the canvas
  const lg = ctx.createLinearGradient(0, -eh, w * 0.7, eh);
  lg.addColorStop(0, hexToRgba(PAL.moon, 0.16)); lg.addColorStop(1, hexToRgba(PAL.moon, 0));
  ctx.fillStyle = lg;
  ctx.beginPath();
  ctx.moveTo(-w * 0.1, -eh);
  ctx.quadraticCurveTo(w * 0.5, eh * 1.5, w * 1.1, -eh);
  ctx.lineTo(w * 1.1, -eh * 1.2); ctx.lineTo(-w * 0.1, -eh * 1.2);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------------------------------------------------------------------------
   THE DECK — code-drawn projected quads (§2.6). Static under a fixed camera,
   so it is baked to a screen-sized layer and rebuilt only on resize.
--------------------------------------------------------------------------- */
function deckOutline(inset){
  const D = TUNING.deck;
  const hw = D.w/2 - inset, hh = D.h/2 - inset, r = Math.max(4, D.r - inset);
  const pts = [];
  const arc = (cx, cy, a0, a1) => {
    for (let i = 0; i <= 5; i++){
      const a = lerp(a0, a1, i/5);
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
  };
  const L = D.cx - hw, R = D.cx + hw, T = D.cy - hh, B = D.cy + hh;
  // far edge: a prow that comes to a soft point
  pts.push([L + r, T]);
  for (let i = 1; i <= 8; i++){
    const t = i / 8;
    const x = lerp(L + r, R - r, t);
    const bulge = Math.sin(t * Math.PI) * (D.bow - inset * 0.6);
    pts.push([x, T - bulge]);
  }
  arc(R - r, T + r, -Math.PI/2, 0);
  pts.push([R, B - r]);
  arc(R - r, B - r, 0, Math.PI/2);
  // near edge: shallow transom
  for (let i = 1; i <= 5; i++){
    const t = i / 5;
    pts.push([lerp(R - r, L + r, t), B + Math.sin(t * Math.PI) * 26]);
  }
  arc(L + r, B - r, Math.PI/2, Math.PI);
  pts.push([L, T + r]);
  arc(L + r, T + r, Math.PI, Math.PI * 1.5);
  return pts;
}
function pathGround(pts){
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++){
    const p = CAM.project(pts[i][0], pts[i][1], 0);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  ctx.closePath();
}

let _deckCv = null, _grainCv = null;

/* The deck is code-drawn (spec §2.6) but it has to speak the same language as
   the painted assets standing on it. Flat fills read as vector next to hand-
   painted brass, so the planks get a baked grain tile, softened seams and
   irregular wear. Same idea as the two-source light pass on the sprites: one
   treatment applied everywhere so the layers agree. */
function grainTile(){
  if (_grainCv) return _grainCv;
  const N = 256;
  _grainCv = document.createElement('canvas');
  _grainCv.width = _grainCv.height = N;
  const c = _grainCv.getContext('2d');
  // long directional strokes, like brushed timber
  for (let i = 0; i < 900; i++){
    const x = Math.random() * N, y = Math.random() * N;
    const len = 12 + Math.random() * 46;
    const a = (Math.random() - 0.5) * 0.22 + Math.PI / 2;
    const dark = Math.random() < 0.55;
    c.globalAlpha = 0.018 + Math.random() * 0.05;
    c.strokeStyle = dark ? '#0D0B12' : '#8A7A6E';
    c.lineWidth = 0.6 + Math.random() * 2.2;
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    c.stroke();
  }
  // knots and scuffs
  for (let i = 0; i < 90; i++){
    c.globalAlpha = 0.03 + Math.random() * 0.06;
    c.fillStyle = Math.random() < 0.5 ? '#0D0B12' : '#6E4A2F';
    c.beginPath();
    c.ellipse(Math.random()*N, Math.random()*N, 1.5 + Math.random()*7,
              1 + Math.random()*3, Math.random()*3.14, 0, Math.PI*2);
    c.fill();
  }
  return _grainCv;
}

// With a follow camera the deck cannot be baked to a screen-space layer, so it
// is drawn live. It is ~60 path ops — trivial next to the billboard crowd.
function drawDeckLive(){
  withCtx(ctx, () => paintDeck(View.w, View.h));
}
function buildDeck(){
  const w = Math.max(2, Math.round(View.w)), h = Math.max(2, Math.round(View.h));
  _deckCv = document.createElement('canvas'); _deckCv.width = w; _deckCv.height = h;
  withCtx(_deckCv.getContext('2d'), () => paintDeck(w, h));
}
function paintDeck(w, h){
  {
    const D = TUNING.deck;
    ctx.lineJoin = 'round';
    // hull mass below the deck line, so the ship reads as a solid object in air
    ctx.save();
    pathGround(deckOutline(-30));
    ctx.translate(0, 26);
    fillStroke('#161220', PAL.ink, 9);
    ctx.restore();

    // deck surface
    pathGround(deckOutline(0));
    ctx.save();
    ctx.clip();
    ctx.fillStyle = PAL.timber;
    ctx.fillRect(0, 0, w, h);
    // planks run bow -> stern, drawn as projected quads
    const step = 46;
    for (let x = D.cx - D.w/2; x < D.cx + D.w/2; x += step){
      const v = ((Math.abs(x * 7919)) % 100) / 100;
      const a = CAM.project(x, D.cy - D.h/2 - D.bow, 0);
      const b = CAM.project(x + step, D.cy - D.h/2 - D.bow, 0);
      const c = CAM.project(x + step, D.cy + D.h/2 + 40, 0);
      const d = CAM.project(x, D.cy + D.h/2 + 40, 0);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
      ctx.closePath();
      ctx.fillStyle = v > 0.66 ? PAL.timberLite : (v > 0.33 ? PAL.timber : PAL.timberDark);
      ctx.globalAlpha = 0.55; ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = hexToRgba(PAL.ink, 0.55); ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(d.x, d.y); ctx.stroke();
      ctx.strokeStyle = hexToRgba('#8A7A6E', 0.10); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(a.x + 1.5, a.y); ctx.lineTo(d.x + 1.5, d.y); ctx.stroke();
    }
    // painterly grain over the whole deck, tiled in screen space
    const g = grainTile();
    ctx.save();
    ctx.globalAlpha = 0.5;
    const pat = ctx.createPattern(g, 'repeat');
    if (pat){ ctx.fillStyle = pat; ctx.fillRect(0, 0, w, h); }
    ctx.restore();

    // butt joints
    ctx.strokeStyle = hexToRgba(PAL.ink, 0.45); ctx.lineWidth = 1.6;
    for (let y = D.cy - D.h/2; y < D.cy + D.h/2; y += 150){
      const a = CAM.project(D.cx - D.w/2, y, 0), b = CAM.project(D.cx + D.w/2, y, 0);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    // brass inlay ring amidships, marking the Boiler's ground
    for (const r of [150, 162]){
      const g = groundEllipsePath(TUNING.boiler.x, TUNING.boiler.y, r);
      ctx.strokeStyle = hexToRgba(PAL.brass, r === 150 ? 0.30 : 0.14);
      ctx.lineWidth = (r === 150 ? 7 : 3) * g.p.k;
      ctx.stroke();
    }
    // the deck sits dark; light pools only under the lanterns
    const dark = ctx.createLinearGradient(0, CAM.horizonY(), 0, h);
    dark.addColorStop(0, 'rgba(13,11,18,0.80)');
    dark.addColorStop(0.45, 'rgba(13,11,18,0.48)');
    dark.addColorStop(1, 'rgba(13,11,18,0.64)');
    ctx.fillStyle = dark; ctx.fillRect(0, 0, w, h);
    for (const p of PROPS){
      if (p.t !== 'lantern') continue;
      const g = groundEllipsePath(p.x, p.y + 30, 210);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const rg = ctx.createRadialGradient(g.p.x, g.p.y, 1, g.p.x, g.p.y, Math.max(g.rx, 1));
      rg.addColorStop(0, hexToRgba(PAL.lantern, 0.30));
      rg.addColorStop(1, hexToRgba(PAL.lantern, 0));
      ctx.fillStyle = rg; ctx.fill();
      ctx.restore();
    }
    ctx.restore();

    // gunwale
    pathGround(deckOutline(0));
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 10; ctx.stroke();
    pathGround(deckOutline(7));
    ctx.strokeStyle = '#3A2A2E'; ctx.lineWidth = 7; ctx.stroke();
    pathGround(deckOutline(11));
    ctx.strokeStyle = hexToRgba(PAL.brass, 0.7); ctx.lineWidth = 2.6; ctx.stroke();

    // railing stanchions along both rails
    for (const side of [-1, 1]){
      const x = D.cx + side * (D.w/2 - 4);
      for (let y = D.cy - D.h/2 + 150; y < D.cy + D.h/2 - 120; y += 110){
        const b = CAM.project(x, y, 0), t = CAM.project(x, y, 34);
        ctx.strokeStyle = PAL.ink; ctx.lineWidth = 7 * b.k;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke();
        ctx.strokeStyle = PAL.brass; ctx.lineWidth = 3 * b.k;
        ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke();
      }
    }
  }
}
function onViewportChanged(){
  _spriteCache.clear();
  buildSky();
  CAM.recompute();
  if (!CAM.follow) buildDeck();   // a moving camera draws the deck live instead
}


/* ---------------------------------------------------------------------------
   BILLBOARDS — every entity is a depth-scaled sprite standing on the deck,
   drawn far -> near (painter's algorithm, §2).
--------------------------------------------------------------------------- */
const ANCHOR = 0.92;      // feet sit here in the sprite, per §2.4
const FIG = 0.86;         // fraction of sprite height the figure occupies

const _tintCache = new Map();
function tintVersion(img, col){
  let byCol = _tintCache.get(img);
  if (!byCol){ byCol = new Map(); _tintCache.set(img, byCol); }
  let cn = byCol.get(col);
  if (cn) return cn;
  cn = document.createElement('canvas');
  cn.width = img.width || img.naturalWidth; cn.height = img.height || img.naturalHeight;
  const c = cn.getContext('2d');
  c.drawImage(img, 0, 0, cn.width, cn.height);
  c.globalCompositeOperation = 'source-atop';
  c.fillStyle = col; c.fillRect(0, 0, cn.width, cn.height);
  byCol.set(col, cn);
  return cn;
}
function whiteVersion(img){ return tintVersion(img, '#FFFFFF'); }

/* ---------------------------------------------------------------------------
   OCCLUSION X-RAY
   The first playtest killed v2 on exactly this: the Boiler you are defending
   stood between you and the boarders attacking its far side, so the fight you
   most needed to see was the one you could not. Tall geometry now registers as
   an occluder, and anything hidden behind it is re-drawn on top as a flat
   silhouette. Standard for any three-quarter action game; not optional here.
--------------------------------------------------------------------------- */
const _occluders = [];      // {x0,x1,y0,y1, depth} screen rects, rebuilt per frame
const _xrayQueue = [];      // entities to re-draw as silhouettes

function resetOccluders(){ _occluders.length = 0; _xrayQueue.length = 0; }

// register a screen-space box that hides what is behind it
function addOccluder(sx, sy, w, h, groundY){
  if (!PRESET.xray) return;
  _occluders.push({ x0: sx - w * 0.5, x1: sx + w * 0.5, y0: sy - h, y1: sy, gy: groundY });
}

// is this entity's silhouette meaningfully covered by nearer, taller geometry?
function isOccluded(sx, top, w, h, groundY){
  if (!PRESET.xray || !_occluders.length) return false;
  const ax0 = sx - w * 0.30, ax1 = sx + w * 0.30;
  const ay0 = top + h * 0.12, ay1 = top + h * 0.92;
  const area = Math.max(1, (ax1 - ax0) * (ay1 - ay0));
  let covered = 0;
  for (const o of _occluders){
    if (o.gy <= groundY) continue;                 // only things NEARER can occlude
    const ox = Math.min(ax1, o.x1) - Math.max(ax0, o.x0);
    if (ox <= 0) continue;
    const oy = Math.min(ay1, o.y1) - Math.max(ay0, o.y0);
    if (oy <= 0) continue;
    covered += ox * oy;
    if (covered / area > 0.32) return true;        // a third hidden is enough
  }
  return false;
}

/* Solid silhouettes merge into one unreadable mass the moment two boarders
   overlap — which is exactly when you need to count them. So each hidden body
   is drawn as a coloured RIM around a dark interior: the outline is built from
   offset copies, then the middle is punched back out. Shapes stay countable
   even in a pile, and it never reads as a real, in-front enemy. */
const _xrayOffsets = [[-1,0],[1,0],[0,-1],[0,1]];
function drawXrayPass(){
  if (!_xrayQueue.length) return;
  ctx.save();
  for (const q of _xrayQueue){
    if (!isOccluded(q.x + q.w / 2, q.y, q.w, q.h, q.gy)) continue;
    const rim = tintVersion(q.img, q.col);
    const core = tintVersion(q.img, '#140F1A');
    // Outline width is CAPPED in screen pixels. Scaling it with the sprite made
    // a close-up boarder's rim spread ~18px in eight directions, which stacked
    // into one solid orange blob instead of an outline.
    const s = clamp(q.w * 0.012, 1.5, 4.5);
    ctx.globalAlpha = 0.42;
    for (const o of _xrayOffsets)
      ctx.drawImage(rim, q.x + o[0] * s, q.y + o[1] * s, q.w, q.h);
    ctx.globalAlpha = 0.88;
    ctx.drawImage(core, q.x, q.y, q.w, q.h);
    ctx.globalAlpha = 0.22;
    ctx.drawImage(rim, q.x, q.y, q.w, q.h);
  }
  ctx.restore();
}

function drawBillboard(img, x, y, worldH, o){
  o = o || {};
  const p = CAM.project(x, y, 0);
  // Procedural sprites are authored to a known frame; delivered art is measured
  // on load. Either way `worldH` is the height of the FIGURE, not the canvas,
  // so a generous crop never renders smaller than a tight one.
  const m = img.__meta;
  const fig = m ? m.fig : FIG, anch = m ? m.anchor : ANCHOR, cxf = m ? m.cx : 0.5;
  const hpx = (worldH / fig) * p.k * (o.scale || 1);
  const wpx = hpx * (img.width / img.height);
  const bx = p.x - wpx * cxf + (o.dx || 0);
  const by = p.y - hpx * anch - (o.lift || 0) * p.k;
  ctx.save();
  if (o.alpha !== undefined) ctx.globalAlpha = o.alpha;
  if (o.mirror){
    ctx.translate(p.x + (o.dx || 0), 0);
    ctx.scale(-1, 1);
    ctx.drawImage(o.flash ? whiteVersion(img) : img, -wpx * (1 - cxf), by, wpx, hpx);
  } else {
    ctx.drawImage(o.flash ? whiteVersion(img) : img, bx, by, wpx, hpx);
  }
  ctx.restore();
  return { p, wpx, hpx, top: by };
}

function entityShadow(x, y, r, alpha){
  const sh = Assets.get('shadow_blob');
  const g = groundEllipsePath(x, y, r);
  if (sh){
    ctx.save();
    ctx.globalAlpha = (alpha === undefined ? 0.55 : alpha);
    ctx.drawImage(sh, g.p.x - g.rx, g.p.y - g.ry, g.rx * 2, g.ry * 2);
    ctx.restore();
    return;
  }
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 0.5 : alpha;
  const rg = ctx.createRadialGradient(g.p.x, g.p.y, 0, g.p.x, g.p.y, Math.max(1, g.rx));
  rg.addColorStop(0, 'rgba(6,5,10,0.85)');
  rg.addColorStop(0.65, 'rgba(6,5,10,0.42)');
  rg.addColorStop(1, 'rgba(6,5,10,0)');
  ctx.fillStyle = rg; ctx.fill();
  ctx.restore();
}

// which of the two authored views, and do we mirror? (§2.2)
function viewFor(facing, canAttack, attacking){
  const front = Math.sin(facing) > -0.15;      // +y is toward the camera
  const mirror = Math.cos(facing) > 0;         // art faces left by default
  let view = front ? 'front_idle' : 'back_idle';
  if (attacking && canAttack) view = front ? 'front_attack' : 'back_idle';
  return { view, mirror };
}

function propSprite(t){
  const asset = Assets.get(PROP_ASSET[t]);
  if (asset) return asset;
  const tall = t === 'mast' || t === 'lantern' || t === 'crates';
  const H = tall ? 420 : 220, W = Math.round(H * (t === 'rope' ? 1.3 : (t === 'mast' ? 0.55 : 0.9)));
  return cachedSprite('prop|' + t, W, H, (c2, w, h) => {
    c2.save();
    c2.translate(w / 2, h * ANCHOR);
    const src = tall ? 360 : 130;
    const s = (h * FIG) / src;
    c2.scale(s, s);
    c2.lineJoin = 'round'; c2.lineCap = 'round';
    paintProp(t);
    c2.restore();
    applyTwoSourceLight(c2, w, h);
  });
}
// width/height of the sprite box that is actually SOLID, per prop type.
// Anything not listed here does not occlude at all.
const OCCLUDE_BOX = { mast: [0.20, 0.86], crates: [0.52, 0.66], ballista: [0.44, 0.50] };

    drawGlow(q.x, q.y, 90 * q.k, PAL.lantern, 0.5 + Math.sin(S.rt * 3 + p.x) * 0.08);
    ctx.restore();

}

function drawBoilerBillboard(){
  const B = S.boiler;
  const frac = clamp(B.hp / B.maxHp, 0, 1);
  const sh = B.shake > 0 ? B.shake * 6 : 0;
  entityShadow(B.x, B.y, B.r * 1.5, 0.62);
  // the furnace throws the deck's other warm light
  const q = CAM.project(B.x, B.y, 100);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  drawGlow(q.x, q.y, (120 + Math.sin(S.rt * 5) * 10) * q.k,
           frac > 0.35 ? PAL.fire : PAL.danger, 0.35 + 0.3 * frac);
  ctx.restore();
  // Never white-silhouette the Boiler on hit: it is scenery you read constantly,
  // and a full flash makes the thing you are defending unreadable mid-fight.
  const r = drawBillboard(boilerSprite(), B.x + rnd(-sh, sh), B.y, PRESET.boilerH, {});
  if (B.flash > 0){
    const c = CAM.project(B.x, B.y, PRESET.boilerH * 0.5);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(c.x, c.y, r.wpx * 0.42, '#FFE9C0', clamp(B.flash / 0.14, 0, 1) * 0.45);
    ctx.restore();
  }
  addOccluder(r.p.x, r.p.y, r.wpx * 0.58, r.hpx * 0.70, B.y);
  if (frac < 0.6 && rnd() < 0.12) pSmoke(B.x + rnd(-30, 30), B.y, 1, 'rgba(40,36,48,0.6)', 40);
  if (rnd() < 0.05) pSmoke(B.x - 30, B.y, 1, 'rgba(200,196,210,0.30)', 26);
}

/* --- the player ---------------------------------------------------------- */
function drawPlayerBillboard(){
  const P = S.player;
  if (P.hp <= 0) return;
  const bob = Math.sin(P.walk * 2.2) * 3;
  const inv = P.iframe > 0 && Math.floor(S.rt * 24) % 2 === 0;
  entityShadow(P.x, P.y, 34, 0.55);
  // dash afterimages
  for (const t of P.trail){
    const k = 1 - t.t / 0.32;
    const v = viewFor(t.a, false, false);
    drawBillboard(charImage('hero', v.view), t.x, t.y, BILLBOARD_H.hero,
                  { mirror: v.mirror, alpha: k * 0.32 });
  }
  const attacking = P.castFlash > 0 || !!P.ray;
  const v = viewFor(P.facing !== undefined ? P.facing : P.aim, true, attacking);
  const hi = charImage('hero', v.view);
  const hr = drawBillboard(hi, P.x, P.y, BILLBOARD_H.hero,
                { mirror: v.mirror, lift: bob, alpha: inv ? 0.55 : 1, flash: P.hurt > 0.18 });
  // no x-ray for the captain: she is drawn above everything, so she can never
  // be hidden and a silhouette of her would just be a teal blob over herself
  // a soft teal aura so the captain never gets lost in a crowd
  const q = CAM.project(P.x, P.y, 46);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  drawGlow(q.x, q.y, 62 * q.k, PAL.teal, 0.16);
  ctx.restore();
  if (P.dashStock > 0 && P.dashT <= 0)
    groundRing(P.x, P.y, 34, PAL.teal, 2.4, 0.20 + Math.sin(S.rt * 5) * 0.06);
}

/* --- enemies ------------------------------------------------------------- */
function drawEnemyBillboard(e){
  const climbing = e.state === 'climb';
  const k = climbing ? e.climb : 1;
  const attacking = e.state === 'windup' || e.swingFx > 0 ||
                    (e.type === 'BOSS' && e.state === 'active');
  const v = viewFor(e.facing, true, attacking);
  const hover = e.type === 'GUNNER' ? 26 + Math.sin(S.rt * 3 + e.anim) * 5 : 0;
  const bob = Math.sin(e.anim * (e.def.speed / 26)) * (e.type === 'SWARM' ? 4 : 2.4);

  if (!climbing) entityShadow(e.x, e.y, e.r * 1.15, 0.5 - (hover ? 0.18 : 0));
  if (e.slowT > 0) groundRing(e.x, e.y, e.r + 10, PAL.teal, 2.6, 0.5);
  if (e.accT > 0)  groundRing(e.x, e.y, e.r + 18, ELEMENTS.STEAM.color, 2.2, 0.32);

  const img = charImage(e.type, v.view);
  const r = drawBillboard(img, e.x, e.y, BILLBOARD_H[e.type] || 110, {
    mirror: v.mirror,
    lift: hover + bob,
    alpha: climbing ? 0.25 + 0.75 * k : 1,
    scale: climbing ? 0.55 + 0.45 * k : 1,
    flash: e.flash > 0,
  });
  if (!climbing && PRESET.xray){
    _xrayQueue.push({ img, col: e.type === 'BOSS' ? PAL.danger : PAL.dangerIn,
                      x: r.p.x - r.wpx/2, y: r.top, w: r.wpx, h: r.hpx, gy: e.y });
  }

  const top = CAM.project(e.x, e.y, (BILLBOARD_H[e.type] || 110) + hover + 22);
  if (e.burnStacks > 0 && !climbing){
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    drawGlow(CAM.project(e.x, e.y, 40).x, CAM.project(e.x, e.y, 40).y,
             e.r * 2.4 * CAM.project(e.x, e.y, 0).k, PAL.fire, 0.10 * e.burnStacks);
    ctx.restore();
  }
  if (e.stunT > 0){
    for (let i = 0; i < 3; i++){
      const a = S.rt * 7 + i / 3 * TAU;
      ctx.fillStyle = PAL.tesla;
      circ(top.x + Math.cos(a) * 13 * top.k, top.y + Math.sin(a) * 5 * top.k, 3.2 * top.k);
      ctx.fill();
    }
  }
  if (e.blockFlash > 0){
    const c = CAM.project(e.x, e.y, 70);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    drawGlow(c.x, c.y, 44 * c.k, PAL.brassLite, e.blockFlash / 0.18);
    ctx.restore();
  }
  if (!climbing && e.hp < e.maxHp && e.type !== 'BOSS'){
    const w = Math.max(26, e.r * 2.0) * top.k, h = 5 * top.k;
    const x = top.x - w/2, y = top.y;
    ctx.fillStyle = 'rgba(13,11,18,0.85)'; rr(x-2, y-2, w+4, h+4, 3); ctx.fill();
    ctx.fillStyle = e.hp / e.maxHp > 0.4 ? PAL.danger : PAL.dangerIn;
    rr(x, y, w * clamp(e.hp/e.maxHp, 0, 1), h, 2); ctx.fill();
  }
}

/* --- boarding markers + telegraphs (§2.9 — code-drawn, ground-projected) -- */
function groundRuneImage(key, x, y, r, alpha, tint){
  const img = Assets.get(key);
  if (!img) return false;
  const g = groundEllipsePath(x, y, r);
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.drawImage(img, g.p.x - g.rx, g.p.y - g.ry, g.rx * 2, g.ry * 2);
  ctx.restore();
  return true;
}

function drawTelegraphs(){
  ctx.save();
  ctx.lineJoin = 'round';

  for (const e of S.enemies){
    if (e.state !== 'climb') continue;
    const pulse = 0.4 + 0.35 * Math.sin(S.rt * 12);
    if (!groundRuneImage('rune_enemy', e.spawnX, e.spawnY, 40, pulse)){
      groundRing(e.spawnX, e.spawnY, 38, PAL.danger, 3, pulse);
      groundRing(e.spawnX, e.spawnY, 26, PAL.dangerIn, 2, pulse * 0.7);
    }
    const g = groundEllipsePath(e.spawnX, e.spawnY, 38);
    ctx.save();
    ctx.strokeStyle = PAL.dangerIn; ctx.lineWidth = 4 * g.p.k;
    ctx.beginPath();
    ctx.ellipse(g.p.x, g.p.y, g.rx, g.ry, 0, -Math.PI/2, -Math.PI/2 + TAU * e.climb);
    ctx.stroke();
    ctx.restore();
  }

  for (const e of S.enemies){
    if (e.dead) continue;
    const def = e.def;
    if (e.state === 'windup'){
      const total = e.type === 'BOSS'
        ? (e.boss.atk === 'slam' ? 0.9 : e.boss.atk === 'summon' ? 0.7 : 0.8)
        : def.windup;
      const kk = 1 - clamp(e.st / total, 0, 1);
      const flick = 0.34 + 0.30 * kk + Math.sin(S.rt * 26) * 0.05;

      if (e.type === 'BOSS' && e.boss.atk === 'slam'){
        if (!groundRuneImage('rune_enemy_filled', e.x, e.y, 260, flick))
          groundDisc(e.x, e.y, 260 * kk, PAL.danger, flick * 0.4);
        groundRing(e.x, e.y, 260, PAL.danger, 6, 0.9);
        groundRing(e.x, e.y, 260 * kk, PAL.dangerIn, 4, 0.8);
      } else if (e.type === 'BOSS' && e.boss.atk === 'summon'){
        groundRing(e.x, e.y, 150, PAL.danger, 6, flick);
        groundRing(e.x, e.y, 150 * (0.4 + 0.6 * kk), PAL.dangerIn, 3, flick);
      } else if (e.type === 'BOSS'){
        groundBandPath(e.x, e.y, e.atkAng, 660, 60, 0);
        ctx.fillStyle = hexToRgba(PAL.danger, flick * 0.45); ctx.fill();
        ctx.strokeStyle = PAL.danger; ctx.lineWidth = 3; ctx.stroke();
        groundBandPath(e.x, e.y, e.atkAng, 660 * kk, 60, 0);
        ctx.fillStyle = hexToRgba(PAL.dangerIn, 0.4); ctx.fill();
      } else if (def.ai === 'ranged'){
        groundBandPath(e.x, e.y, e.atkAng, def.atkRange + 70, 16, 20);
        ctx.fillStyle = hexToRgba(PAL.danger, flick * 0.55); ctx.fill();
        groundBandPath(e.x, e.y, e.atkAng, (def.atkRange + 70) * kk, 9, 20);
        ctx.fillStyle = hexToRgba(PAL.dangerIn, 0.9); ctx.fill();
      } else {
        groundWedgePath(e.x, e.y, 0, def.reach, e.atkAng - def.swing/2, e.atkAng + def.swing/2);
        ctx.fillStyle = hexToRgba(PAL.danger, flick * 0.5); ctx.fill();
        ctx.strokeStyle = hexToRgba(PAL.danger, 0.9); ctx.lineWidth = 2.5; ctx.stroke();
        groundWedgePath(e.x, e.y, def.reach * 0.72, def.reach,
                        e.atkAng - def.swing/2, e.atkAng - def.swing/2 + def.swing * kk);
        ctx.fillStyle = hexToRgba(PAL.dangerIn, 0.85); ctx.fill();
      }
    }
    if (e.type === 'BOSS' && e.state === 'active'){
      const a = e.facing;
      groundBandPath(e.x, e.y, a, 660, 56, 0);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = hexToRgba(PAL.fire, 0.55); ctx.fill();
      groundBandPath(e.x, e.y, a, 660, 20, 0);
      ctx.fillStyle = hexToRgba(PAL.fireCore, 0.9); ctx.fill();
      ctx.restore();
      const m = CAM.project(e.x + Math.cos(a) * 120, e.y + Math.sin(a) * 120, 150);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      drawGlow(m.x, m.y, 60 * m.k, PAL.fireCore, 0.9);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawAoePreview(){
  for (let i = 0; i < 4; i++){
    const sk = S.slots[i];
    if (!sk || SHAPES[sk.shape].kind !== 'aoe') continue;
    const st = skillStats(sk);
    let tx = Input.mouse.x, ty = Input.mouse.y;
    const d = dist(S.player.x, S.player.y, tx, ty);
    if (d > st.castRange){
      tx = S.player.x + (tx - S.player.x) / d * st.castRange;
      ty = S.player.y + (ty - S.player.y) / d * st.castRange;
    }
    const c = clampToDeck(tx, ty, 6);
    const ready = sk.cdLeft <= 0;
    if (!groundRuneImage('rune_player', c.x, c.y, st.radius, ready ? 0.55 : 0.2)){
      groundRing(c.x, c.y, st.radius, PAL.teal, 2.6, ready ? 0.45 : 0.16);
      groundRing(c.x, c.y, st.radius * 0.24, PAL.teal, 2, ready ? 0.35 : 0.12);
      const g = groundEllipsePath(c.x, c.y, st.radius);
      ctx.save();
      ctx.globalAlpha = ready ? 0.30 : 0.10;
      ctx.strokeStyle = PAL.teal; ctx.lineWidth = 1.6 * g.p.k;
      for (let t = 0; t < 12; t++){
        const a = t / 12 * TAU;
        ctx.beginPath();
        ctx.moveTo(g.p.x + Math.cos(a) * g.rx * 0.88, g.p.y + Math.sin(a) * g.ry * 0.88);
        ctx.lineTo(g.p.x + Math.cos(a) * g.rx, g.p.y + Math.sin(a) * g.ry);
        ctx.stroke();
      }
      ctx.restore();
    }
    return;
  }
}

function drawFields(){
  for (const f of S.fields){
    const E = ELEMENTS[f.elem];
    const k = clamp(f.life / 2, 0, 1);
    const g = groundEllipsePath(f.x, f.y, f.r);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.34 * k;
    const rg = ctx.createRadialGradient(g.p.x, g.p.y, 1, g.p.x, g.p.y, Math.max(1, g.rx));
    rg.addColorStop(0, hexToRgba(E.glow, 0.8));
    rg.addColorStop(0.6, hexToRgba(E.color, 0.5));
    rg.addColorStop(1, hexToRgba(E.color, 0));
    ctx.fillStyle = rg; ctx.fill();
    ctx.restore();
    groundRing(f.x, f.y, f.r * (0.92 + Math.sin(S.rt * 3 + f.seed) * 0.05), E.color, 3, 0.6 * k);
  }
}

function drawPickupBillboard(p){
  const bob = Math.sin(p.bob) * 5;
  const fade = p.life < 3 ? (0.4 + 0.6 * Math.abs(Math.sin(p.life * 8))) : 1;

  ctx.globalAlpha = fade;
  ctx.translate(q.x, q.y);

function drawBolts(){

/* ---------------------------------------------------------------------------
   LANE RENDERING — walls, cannons, crew, the enemy hulk, and the lane readout.
   All inert unless PRESET.lanes.
--------------------------------------------------------------------------- */

// A cargo run drawn as a projected box: top face on the ground plane, plus the
// near vertical face so it reads as something you cannot walk through.
function drawLaneWalls(){
  if (!PRESET.lanes) return;
  const H = 96;
  ctx.save();
  ctx.lineJoin = 'round';
  for (const w of LANE_WALLS){
    const nearY = w.y1, farY = w.y0;
    const bl = CAM.project(w.x0, nearY, 0), br = CAM.project(w.x1, nearY, 0);
    const tl = CAM.project(w.x0, farY, 0),  tr = CAM.project(w.x1, farY, 0);
    const BL = CAM.project(w.x0, nearY, H), BR = CAM.project(w.x1, nearY, H);
    const TL = CAM.project(w.x0, farY, H),  TR = CAM.project(w.x1, farY, H);
    // near face
    ctx.beginPath();
    ctx.moveTo(bl.x, bl.y); ctx.lineTo(br.x, br.y);
    ctx.lineTo(BR.x, BR.y); ctx.lineTo(BL.x, BL.y); ctx.closePath();
    fillStroke('#2A2027', PAL.ink, 4);
    // top face
    ctx.beginPath();
    ctx.moveTo(BL.x, BL.y); ctx.lineTo(BR.x, BR.y);
    ctx.lineTo(TR.x, TR.y); ctx.lineTo(TL.x, TL.y); ctx.closePath();
    fillStroke('#3D2E30', PAL.ink, 4);
    // lashed crates along the run, so it reads as cargo not a wall texture
    const n = Math.max(2, Math.round((nearY - farY) / 150));
    for (let i = 0; i < n; i++){
      const y = lerp(farY + 40, nearY - 40, n === 1 ? 0.5 : i / (n - 1));
      const a = CAM.project(w.x0 + 12, y, H), b = CAM.project(w.x1 - 12, y, H);
      ctx.strokeStyle = hexToRgba(PAL.brass, 0.42); ctx.lineWidth = 3 * a.k;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.strokeStyle = hexToRgba(PAL.leather, 0.5); ctx.lineWidth = 2.4 * a.k;
      ctx.beginPath(); ctx.moveTo(a.x, a.y + 5 * a.k); ctx.lineTo(b.x, b.y + 5 * b.k); ctx.stroke();
    }
    // brass capping rail catching the moonlight
    ctx.strokeStyle = hexToRgba(PAL.brass, 0.55); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(BL.x, BL.y); ctx.lineTo(TL.x, TL.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(BR.x, BR.y); ctx.lineTo(TR.x, TR.y); ctx.stroke();
  }
  ctx.restore();
}

function drawTurretBillboard(t){
  entityShadow(t.x, t.y, t.r * 1.25, 0.55);
  const r = drawBillboard(turretSprite(t.dead), t.x, t.y, t.dead ? 74 : 138,
                          { flash: t.flash > 0 });
  addOccluder(r.p.x, r.p.y, r.wpx * 0.42, r.hpx * 0.58, t.y);
  if (t.dead) return;
  if (t.fireFx > 0){
    const m = CAM.project(t.x + Math.cos(t.ang) * 60, t.y + Math.sin(t.ang) * 60, 96);
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    drawGlow(m.x, m.y, 34 * m.k, PAL.teal, t.fireFx / 0.14);
    ctx.restore();
  }
  // health, always legible: losing a cannon opens the lane
  const top = CAM.project(t.x, t.y, 168);

  const w = 76 * top.k, h = 7 * top.k;

function drawHulk(){
  const H = S.hulk;
  if (!H || H.dead) return;
  const p = CAM.project(H.x, H.y, 0);
  const img = hulkSprite();
  const hpx = 560 * p.k, wpx = hpx * (img.width / img.height);
  ctx.save();
  if (H.flash > 0){
    ctx.drawImage(img, p.x - wpx/2, p.y - hpx * 0.96, wpx, hpx);
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = clamp(H.flash / 0.1, 0, 1) * 0.5;
    ctx.drawImage(tintVersion(img, '#FFD9A0'), p.x - wpx/2, p.y - hpx * 0.96, wpx, hpx);
  } else {
    ctx.drawImage(img, p.x - wpx/2, p.y - hpx * 0.96, wpx, hpx);
  }
  ctx.restore();
  // sealed vs open plating — the whole push/hold read depends on this
  if (H.vulnerable){
    const q = CAM.project(H.x, H.y, 260);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    drawGlow(q.x, q.y, 150 * q.k, PAL.fireCore, 0.30 + Math.sin(S.rt * 6) * 0.12);
    ctx.restore();
  }
  if (rnd() < 0.3) pSmoke(H.x + rnd(-200, 200), H.y + 40, 1, 'rgba(40,36,48,0.5)', 60);
}

}

/* ---------------------------------------------------------------------------
   SKILL VFX — the shapes live on the ground, so they are projected onto it.
   Saturated pops off the dark base (§1.2).
--------------------------------------------------------------------------- */
function jitterAt(i, seed){
  const n = Math.sin(i * 127.1 + seed * 311.7) * 43758.5453;
  return (n - Math.floor(n)) * 2 - 1;
}

function drawGroundFx(){
  ctx.save();
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const f of S.fx){
    if (f.delay > 0) continue;
    const k = clamp(f.t / f.life, 0, 1), inv = 1 - k, e = easeOut(k);

    if (f.kind === 'arc'){
      const R = f.r * (0.6 + 0.44 * e), R0 = R * (0.4 + 0.2 * e);
      const half = f.arc/2 * (0.3 + 0.7 * e);
      groundWedgePath(f.x, f.y, R0, R, f.a - half, f.a + half);
      ctx.globalAlpha = inv * 0.55; ctx.fillStyle = f.col; ctx.fill();
      ctx.globalAlpha = inv * 0.95;
      ctx.strokeStyle = f.glow; ctx.lineWidth = 3; ctx.stroke();
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      groundWedgePath(f.x, f.y, R0, R, f.a - half, f.a + half);
      ctx.globalAlpha = inv * 0.5; ctx.fillStyle = f.glow; ctx.fill();
      ctx.restore();

    } else if (f.kind === 'cone'){
      const R = f.r * (0.35 + 0.75 * e);
      groundWedgePath(f.x, f.y, 8, R, f.a - f.arc/2, f.a + f.arc/2);
      ctx.globalAlpha = inv * 0.42; ctx.fillStyle = f.col; ctx.fill();
      ctx.globalAlpha = inv * 0.85; ctx.strokeStyle = f.glow; ctx.lineWidth = 3; ctx.stroke();
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      groundWedgePath(f.x, f.y, R * 0.5, R, f.a - f.arc/2, f.a + f.arc/2);
      ctx.globalAlpha = inv * 0.45; ctx.fillStyle = f.glow; ctx.fill();
      ctx.restore();

    } else if (f.kind === 'line'){
      groundBandPath(f.x, f.y, f.a, f.len, f.w * (0.7 + 0.5 * inv), 0);
      ctx.globalAlpha = inv * 0.5; ctx.fillStyle = f.col; ctx.fill();
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      groundBandPath(f.x, f.y, f.a, f.len, f.w * 0.34, 0);
      ctx.globalAlpha = inv * 0.9; ctx.fillStyle = f.glow; ctx.fill();
      ctx.restore();

    } else if (f.kind === 'aoe'){
      const R = f.r * (0.45 + 0.55 * e);
      groundDisc(f.x, f.y, R, f.col, inv * 0.30);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = groundEllipsePath(f.x, f.y, R * 0.7);
      const rg = ctx.createRadialGradient(g.p.x, g.p.y, 1, g.p.x, g.p.y, Math.max(1, g.rx));
      rg.addColorStop(0, hexToRgba('#FFFFFF', Math.max(0, 1 - k * 2.4)));
      rg.addColorStop(0.4, hexToRgba(f.glow || f.col, inv * 0.7));
      rg.addColorStop(1, hexToRgba(f.col, 0));
      ctx.fillStyle = rg; ctx.fill();
      ctx.restore();
      groundRing(f.x, f.y, f.r * (0.55 + 0.45 * e), f.col, 8 * inv + 3, inv * 0.95);
      groundRing(f.x, f.y, f.r * (0.55 + 0.45 * e), f.glow || '#FFF', 3 * inv + 1, inv * 0.7);
      const gg = groundEllipsePath(f.x, f.y, R);
      ctx.save();
      ctx.globalAlpha = inv * 0.4; ctx.strokeStyle = f.glow || f.col; ctx.lineWidth = 2.4 * gg.p.k;
      for (let i = 0; i < 8; i++){
        const a = i / 8 * TAU + (f.x + f.y) * 0.01;
        ctx.beginPath();
        ctx.moveTo(gg.p.x + Math.cos(a) * gg.rx * 0.35, gg.p.y + Math.sin(a) * gg.ry * 0.35);
        ctx.lineTo(gg.p.x + Math.cos(a) * gg.rx * 1.05, gg.p.y + Math.sin(a) * gg.ry * 1.05);
        ctx.stroke();
      }
      ctx.restore();

    } else if (f.kind === 'pop' || f.kind === 'fizzle'){
      groundRing(f.x, f.y, (f.r || 20) * (0.4 + 1.3 * e), f.col,
                 5 * inv + 1, inv * (f.kind === 'pop' ? 0.8 : 0.35));

    } else if (f.kind === 'swing'){
      groundWedgePath(f.x, f.y, f.r * 0.55, f.r * 0.95, f.a - f.arc/2, f.a + f.arc/2);
      ctx.globalAlpha = inv * 0.4; ctx.fillStyle = '#D8D2E4'; ctx.fill();
    }
  }
  ctx.restore();
}

// chain arcs, muzzle flashes and the sustained ray live above the deck
function drawAirFx(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const f of S.fx){
    if (f.delay > 0) continue;
    const k = clamp(f.t / f.life, 0, 1), inv = 1 - k;
    if (f.kind === 'chain'){
      const seed = Math.floor(f.t * 34);
      const pts = f.pts.map(p => CAM.project(p.x, p.y, 56));
      for (let pass = 0; pass < 2; pass++){
        ctx.globalAlpha = inv * (pass ? 0.95 : 0.32);
        ctx.strokeStyle = pass ? (f.glow || '#FFF') : f.col;
        ctx.lineWidth = pass ? (3.4 * inv + 1.4) : (14 * inv + 5);
        ctx.beginPath();
        for (let s = 0; s < pts.length - 1; s++){
          const a = pts[s], b = pts[s+1];
          const dx = b.x - a.x, dy = b.y - a.y;
          const L = Math.hypot(dx, dy) || 1;
          const nx = -dy / L, ny = dx / L;
          ctx.moveTo(a.x, a.y);
          for (let i = 1; i <= 5; i++){
            const t = i / 5;
            const amp = (i === 5 ? 0 : 12 * inv);
            const j = jitterAt(s * 11 + i, seed) * amp;
            ctx.lineTo(a.x + dx * t + nx * j, a.y + dy * t + ny * j);
          }
        }
        ctx.stroke();
      }
      ctx.globalAlpha = inv;
      for (let i = 1; i < pts.length; i++)
        drawGlow(pts[i].x, pts[i].y, 24 * inv + 6, f.glow || '#FFFFFF', 1);

    } else if (f.kind === 'muzzle'){
      const q = CAM.project(f.x, f.y, 70);
      ctx.globalAlpha = inv;
      drawGlow(q.x, q.y, (26 * inv + 8) * q.k, f.glow || f.col, 1);
      drawGlow(q.x, q.y, (12 * inv + 4) * q.k, '#FFFFFF', 0.9);
      const im = Assets.get('fx_impact');
      if (im){
        const s = (70 * inv + 26) * q.k;
        ctx.drawImage(im, q.x - s/2, q.y - s/2, s, s);
      }

    } else if (f.kind === 'gear'){
      const q = CAM.project(f.x, f.y, 60);
      ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(f.t * 6); ctx.scale(q.k, q.k);
      ctx.globalAlpha = inv * 0.9;
      ctx.strokeStyle = PAL.brassLite; ctx.lineWidth = 5 * inv + 2;
      const R = 30 + 40 * easeOut(k);
      circ(0, 0, R); ctx.stroke();
      for (let i = 0; i < 8; i++){
        const a = i / 8 * TAU;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * R, Math.sin(a) * R);
        ctx.lineTo(Math.cos(a) * (R + 10), Math.sin(a) * (R + 10)); ctx.stroke();
      }
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawRay(){
  const R = S.player.ray;
  if (!R) return;
  const sk = S.slots[R.slot];
  if (!sk) return;
  const st = skillStats(sk), E = ELEMENTS[sk.element];
  const P = S.player, a = P.aim;
  const pulse = 0.85 + Math.sin(S.rt * 40) * 0.15;
  // scorch band on the deck
  groundBandPath(P.x, P.y, a, R.len, st.width * 1.1, 12);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.35; ctx.fillStyle = E.color; ctx.fill();
  // the beam itself, at chest height
  const A = CAM.project(P.x + Math.cos(a) * 16, P.y + Math.sin(a) * 16, 62);
  const B = CAM.project(P.x + Math.cos(a) * R.len, P.y + Math.sin(a) * R.len, 62);
  const wA = st.width * 0.5 * pulse * A.k, wB = st.width * 0.5 * pulse * B.k;
  const nx = -(B.y - A.y), ny = (B.x - A.x);
  const L = Math.hypot(nx, ny) || 1;
  const ux = nx / L, uy = ny / L;
  const quad = (sa, sb, col, al) => {
    ctx.globalAlpha = al;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(A.x + ux*sa, A.y + uy*sa); ctx.lineTo(B.x + ux*sb, B.y + uy*sb);
    ctx.lineTo(B.x - ux*sb, B.y - uy*sb); ctx.lineTo(A.x - ux*sa, A.y - uy*sa);
    ctx.closePath(); ctx.fill();
  };
  quad(wA, wB, E.color, 0.6);
  quad(wA * 0.44, wB * 0.44, E.glow, 0.75);
  quad(wA * 0.16, wB * 0.16, '#FFFFFF', 0.85);
  ctx.globalAlpha = 1;
  drawGlow(A.x, A.y, 30 * A.k, E.glow, 0.9);
  drawGlow(B.x, B.y, 44 * B.k * pulse, E.glow, 1);
  drawGlow(B.x, B.y, 20 * B.k * pulse, '#FFFFFF', 0.9);
  ctx.restore();
}

/* --- particles & floating numbers, both billboarded ---------------------- */
function drawParticles(){
  const pool = Particles.pool;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of pool){
    if (!p.live || !p.add) continue;
    const k = p.life / p.max;
    const gy = p.gy === undefined ? p.y : p.gy;
    const q = CAM.project(p.x, gy, Math.max(0, gy - p.y));
    ctx.globalAlpha = clamp(k, 0, 1);
    if (p.kind === 'spark'){
      ctx.strokeStyle = p.col; ctx.lineWidth = p.size * k * q.k;
      ctx.beginPath();
      ctx.moveTo(q.x, q.y);
      ctx.lineTo(q.x - p.vx * 0.014 * p.w * q.k, q.y - p.vy * 0.014 * p.w * q.k);
      ctx.stroke();
    } else {
      ctx.fillStyle = p.col; circ(q.x, q.y, p.size * k * q.k); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  const smoke = Assets.get('fx_smoke');
  for (const p of pool){
    if (!p.live || p.add) continue;
    const k = p.life / p.max;
    const gy = p.gy === undefined ? p.y : p.gy;
    const q = CAM.project(p.x, gy, Math.max(0, gy - p.y));
    if (p.kind === 'shard'){
      ctx.save();
      ctx.globalAlpha = clamp(k * 1.4, 0, 1);
      ctx.translate(q.x, q.y); ctx.rotate(p.rot); ctx.scale(q.k, q.k);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.7);
      ctx.strokeStyle = PAL.ink; ctx.lineWidth = 1.6;
      ctx.strokeRect(-p.size/2, -p.size/2, p.size, p.size * 0.7);
      ctx.restore();
    } else if (p.kind === 'smoke'){
      const r = p.size * (1.6 - k * 0.6) * q.k;
      ctx.globalAlpha = clamp(k * 0.7, 0, 1);
      if (smoke) ctx.drawImage(smoke, q.x - r, q.y - r, r * 2, r * 2);
      else { ctx.fillStyle = p.col; circ(q.x, q.y, r); ctx.fill(); }
    } else {
      ctx.globalAlpha = clamp(k, 0, 1);
      ctx.fillStyle = p.col; circ(q.x, q.y, p.size * k * q.k); ctx.fill();
    }
  }
  ctx.restore();
}

function drawNums(){
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 5; ctx.lineJoin = 'round';
  let lastPx = -1;
  for (const n of S.nums){
    const k = n.t / n.life;
    const pop = n.crit ? (1 + Math.max(0, 0.5 - k * 4)) : 1;
    const gy = n.gy === undefined ? n.y : n.gy;
    const q = CAM.project(n.x, gy, Math.max(0, gy - n.y) + 40);
    ctx.globalAlpha = k < 0.7 ? 1 : (1 - (k - 0.7) / 0.3);
    const px = Math.max(8, Math.round(n.size * pop * q.k));
    if (px !== lastPx){ setFont(px, 800, true); lastPx = px; }
    // §2.9 — crit numbers are yellow with a bang
    const txt = n.crit ? n.text + '!!' : n.text;
    ctx.strokeStyle = PAL.ink; ctx.strokeText(txt, q.x, q.y);
    ctx.fillStyle = n.crit ? PAL.crit : n.col;
    ctx.fillText(txt, q.x, q.y);
  }
  ctx.restore();
}


/* ---------------------------------------------------------------------------
   HUD — brass gauge plate over the dark base (§4.7)
--------------------------------------------------------------------------- */
function hudScale(){ return clamp(Math.min(View.w / 1400, View.h / 860), 0.6, 1.4); }

function brassPanel(x, y, w, h, r, alpha){
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  rr(x, y, w, h, r);
  ctx.fillStyle = 'rgba(20,18,27,0.92)'; ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 5; ctx.stroke();
  rr(x + 3, y + 3, w - 6, h - 6, Math.max(2, r - 3));
  ctx.strokeStyle = hexToRgba(PAL.brass, 0.85); ctx.lineWidth = 2.2; ctx.stroke();
  ctx.fillStyle = PAL.brass;
  const pd = 9;
  for (const p of [[x+pd,y+pd],[x+w-pd,y+pd],[x+pd,y+h-pd],[x+w-pd,y+h-pd]]){
    ctx.beginPath(); ctx.arc(p[0], p[1], 2.6, 0, TAU); ctx.fill();
  }
  ctx.restore();
}
function gaugeRing(cx, cy, r, col, teeth){
  const asset = Assets.get('ui_gauge');
  if (asset){ ctx.drawImage(asset, cx - r * 1.22, cy - r * 1.22, r * 2.44, r * 2.44); return; }
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = col; ctx.lineWidth = 2.6;
  circ(0, 0, r * 1.1); ctx.stroke();
  ctx.lineWidth = 2;
  for (let i = 0; i < (teeth || 16); i++){
    const a = i / (teeth || 16) * TAU;
    const l = i % 4 === 0 ? 0.2 : 0.11;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 1.1, Math.sin(a) * r * 1.1);
    ctx.lineTo(Math.cos(a) * r * (1.1 + l), Math.sin(a) * r * (1.1 + l));
    ctx.stroke();
  }
  ctx.restore();
}

const SKILL_ICON_ASSET = {
  CLOSEHIT:'ui_icon_slash', LINE_BURST:'ui_icon_hook', CONE:'ui_icon_cone',
  RANGED_AOE:'ui_icon_aoe', CHAIN:'ui_icon_ult', RAY:'ui_icon_turret',
};
function paintGlyph(shape, r, col, glow){
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = col; ctx.fillStyle = col;
  ctx.shadowColor = glow; ctx.shadowBlur = 12;
  if (shape === 'CLOSEHIT'){
    ctx.lineWidth = r * 0.30;
    ctx.beginPath(); ctx.arc(-r*0.35, 0, r * 0.82, -1.15, 1.15); ctx.stroke();
    ctx.strokeStyle = glow; ctx.lineWidth = r * 0.15;
    ctx.beginPath(); ctx.arc(-r*0.35, 0, r * 0.82, -0.95, 0.95); ctx.stroke();
  } else if (shape === 'LINE_BURST'){
    ctx.lineWidth = r * 0.28;
    ctx.beginPath(); ctx.moveTo(-r*0.9, 0); ctx.lineTo(r*0.42, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r*0.92, 0); ctx.lineTo(r*0.30, -r*0.46); ctx.lineTo(r*0.30, r*0.46);
    ctx.closePath(); ctx.fill();
  } else if (shape === 'CONE'){
    ctx.beginPath(); ctx.moveTo(-r*0.85, 0); ctx.arc(-r*0.85, 0, r * 1.6, -0.6, 0.6);
    ctx.closePath(); ctx.globalAlpha = 0.4; ctx.fill();
    ctx.globalAlpha = 1; ctx.lineWidth = r * 0.16; ctx.stroke();
  } else if (shape === 'RANGED_AOE'){
    ctx.lineWidth = r * 0.19;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.76, 0, TAU); ctx.stroke();
    ctx.globalAlpha = 0.32; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = glow; ctx.lineWidth = r * 0.16;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.32, 0, TAU); ctx.stroke();
  } else if (shape === 'CHAIN'){
    ctx.lineWidth = r * 0.2;
    ctx.beginPath();
    ctx.moveTo(-r*0.95, r*0.4); ctx.lineTo(-r*0.25, -r*0.5);
    ctx.lineTo(r*0.15, r*0.25); ctx.lineTo(r*0.95, -r*0.55);
    ctx.stroke();
    ctx.strokeStyle = glow; ctx.lineWidth = r * 0.08; ctx.stroke();
  } else {
    ctx.globalAlpha = 0.5; ctx.lineWidth = r * 0.42;
    ctx.beginPath(); ctx.moveTo(-r*0.8, 0); ctx.lineTo(r*0.95, 0); ctx.stroke();
    ctx.globalAlpha = 1; ctx.strokeStyle = glow; ctx.lineWidth = r * 0.16;
    ctx.beginPath(); ctx.moveTo(-r*0.8, 0); ctx.lineTo(r*0.95, 0); ctx.stroke();
    ctx.fillStyle = col; circ(-r*0.82, 0, r * 0.26); ctx.fill();
  }
}
function drawShapeGlyph(shape, cx, cy, r, col, glow){
  const a = Assets.get(SKILL_ICON_ASSET[shape]);
  if (a){ ctx.drawImage(a, cx - r * 1.5, cy - r * 1.5, r * 3, r * 3); return; }
  r = Math.max(1, Math.round(r));
  const half = Math.ceil(r * 1.9 + 18);
  const cn = cachedSprite('g|'+shape+'|'+r+'|'+col, half*2, half*2, (c2, w, h) => {
    c2.translate(w/2, h/2);
    paintGlyph(shape, r, col, glow);
  });
  ctx.drawImage(cn, cx - half, cy - half);
}

const SLOT_KEYS = ['LMB', 'RMB', 'SPACE', 'SHIFT'];
const SLOT_UNLOCK_WAVE = [1, 1, 3, 6];

/* The auto-attack has no key, but it still needs to be legible: you should be
   able to see it swinging and know it is doing work without a slot of its own. */
function drawAutoPip(x, y, size){
  const AA = FEEL.autoAttack;
  if (!AA) return;
  const P = S.player, r = size * 0.34;
  ctx.save();
  ctx.translate(x, y);
  circ(0, 0, r); ctx.fillStyle = PAL.base; ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 4; ctx.stroke();
  gaugeRing(0, 0, r, hexToRgba(PAL.brass, 0.55), 12);
  // sabre glyph
  ctx.strokeStyle = P.atkTarget ? '#E8E2D2' : '#6E667A';
  ctx.lineWidth = r * 0.20; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(-r*0.30, 0, r*0.72, -1.1, 1.1); ctx.stroke();
  // cadence sweep
  const frac = clamp(P.atkCd / AA.cd, 0, 1);
  if (frac > 0){
    ctx.save(); circ(0, 0, r - 2); ctx.clip();
    ctx.globalAlpha = 0.7; ctx.fillStyle = '#0B0910';
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.arc(0, 0, r * 2, -Math.PI/2, -Math.PI/2 + TAU * frac);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  if (P.atkSwing > 0){
    ctx.globalAlpha = P.atkSwing / 0.18;
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3;
    circ(0, 0, r + 5); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  setFont(Math.round(9.5 * (size/78)), 800, true);
  textOut('AUTO', 0, r + 12 * (size/78), P.atkTarget ? PAL.bone : '#6E667A');
  ctx.restore();
}

function drawSkillBar(){
  const HS = hudScale();
  const size = 78 * HS, gap = 14 * HS;
  const total = size * 4 + gap * 3;
  const x0 = (View.w - total) / 2;
  const y0 = View.h - size - 46 * HS;

  drawAutoPip(x0 - 48 * HS, y0 + size * 0.5, size);
  const frame = Assets.get('ui_frame');
  if (frame) ctx.drawImage(frame, x0 - 40*HS, y0 - 26*HS, total + 80*HS, size + 72*HS);
  else brassPanel(x0 - 16*HS, y0 - 14*HS, total + 32*HS, size + 46*HS, 12*HS, 0.94);

  for (let i = 0; i < 4; i++){
    const x = x0 + i * (size + gap), y = y0;
    const sk = S.slots[i];
    const locked = i >= S.unlockedSlots;
    ctx.save();
    ctx.translate(x + size/2, y + size/2);
    circ(0, 0, size * 0.46);
    ctx.fillStyle = locked ? 'rgba(13,11,18,0.95)' : PAL.base;
    fillStroke(null, PAL.ink, 5);
    ctx.fillStyle = locked ? 'rgba(13,11,18,0.95)' : PAL.base; ctx.fill();
    gaugeRing(0, 0, size * 0.46, locked ? '#3A3440' : hexToRgba(PAL.brass, 0.9), 16);

    if (locked){
      ctx.strokeStyle = '#4A4450'; ctx.lineWidth = 4;
      rr(-size*0.16, -size*0.05, size*0.32, size*0.24, 4); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -size*0.05, size*0.12, Math.PI, 0); ctx.stroke();
      setFont(Math.round(12*HS), 700, true);
      textOut('WAVE ' + SLOT_UNLOCK_WAVE[i], 0, size*0.32, '#6E667A');
    } else if (!sk){
      setFont(Math.round(13*HS), 700, true);
      textOut('EMPTY', 0, 0, '#5E5668');
    } else {
      const E = ELEMENTS[sk.element], st = skillStats(sk);
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      drawGlow(0, 0, size * 0.5, E.color, 0.22);
      ctx.restore();
      drawShapeGlyph(sk.shape, 0, -2*HS, size * 0.28, E.color, E.glow);
      if (sk.cdLeft > 0){
        const frac = clamp(sk.cdLeft / Math.max(0.001, st.cd), 0, 1);
        ctx.save();
        circ(0, 0, size * 0.45); ctx.clip();
        ctx.globalAlpha = 0.76; ctx.fillStyle = '#0B0910';
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, size, -Math.PI/2, -Math.PI/2 + TAU * frac);
        ctx.closePath(); ctx.fill();
        ctx.restore();
        setFont(Math.round(19*HS), 800, true);
        textOut(sk.cdLeft.toFixed(1), 0, -2*HS, PAL.bone, PAL.ink, 4);
      }
      if (S.player.ray && S.player.ray.slot === i){
        const kk = 1 - S.player.ray.t / st.maxDur;
        ctx.strokeStyle = E.glow; ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.46, -Math.PI/2, -Math.PI/2 + TAU * clamp(kk, 0, 1));
        ctx.stroke();
      }
      if (sk.readyPulse > 0){
        const kk = sk.readyPulse / 0.35;
        ctx.save();
        ctx.globalAlpha = kk * 0.9;
        ctx.strokeStyle = PAL.teal; ctx.lineWidth = 2 + 6 * kk;
        circ(0, 0, size * 0.46 + kk * 12); ctx.stroke();
        ctx.restore();
      }
      if (slotHeld(i) && sk.cdLeft <= 0){
        ctx.strokeStyle = E.glow; ctx.lineWidth = 3;
        circ(0, 0, size * 0.42); ctx.stroke();
      }
      setFont(Math.round(11.5*HS), 700, true);
      textOut(skillName(sk).toUpperCase(), 0, size/2 + 14*HS, E.color, PAL.ink, 3.5);
    }
    setFont(Math.round(11*HS), 800, true);
    const kw = ctx.measureText(SLOT_KEYS[i]).width + 12*HS;
    rr(-kw/2, -size/2 - 12*HS, kw, 16*HS, 4*HS);
    ctx.fillStyle = PAL.ink; ctx.fill();
    ctx.strokeStyle = locked ? '#4A4450' : PAL.brass; ctx.lineWidth = 1.8; ctx.stroke();
    textOut(SLOT_KEYS[i], 0, -size/2 - 4*HS, locked ? '#6E667A' : PAL.bone);
    ctx.restore();
  }
}

function drawHealthPanel(){
  const HS = hudScale();
  const w = 262 * HS, h = 84 * HS;
  const x = 20 * HS, y = View.h - h - 20 * HS;
  brassPanel(x, y, w, h, 10*HS, 0.94);
  const P = S.player;

  const port = Assets.get('ui_portrait');
  const pr = 26 * HS;
  ctx.save();
  circ(x + 16*HS + pr, y + h/2, pr); ctx.clip();
  if (port) ctx.drawImage(port, x + 16*HS, y + h/2 - pr, pr*2, pr*2);
  else {
    ctx.fillStyle = '#241F2E'; ctx.fillRect(x + 16*HS, y + h/2 - pr, pr*2, pr*2);
    withCtxNone(() => {});
    ctx.save();
    ctx.translate(x + 16*HS + pr, y + h/2 + pr * 1.5);
    ctx.scale(pr / 62, pr / 62);
    ctx.lineJoin = 'round';
    paintHero(false, false);
    ctx.restore();
  }
  ctx.restore();
  ctx.strokeStyle = PAL.brass; ctx.lineWidth = 2.4;
  circ(x + 16*HS + pr, y + h/2, pr); ctx.stroke();

  const bx = x + 16*HS + pr*2 + 12*HS, bw = w - (bx - x) - 16*HS;
  const frac = clamp(P.hp / P.maxHp, 0, 1);
  const by = y + 22*HS, bh = 20*HS;
  rr(bx, by, bw, bh, 4*HS);
  ctx.fillStyle = '#0B0910'; ctx.fill();
  ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3; ctx.stroke();
  const g = ctx.createLinearGradient(bx, by, bx, by + bh);
  g.addColorStop(0, frac > 0.3 ? '#E8542E' : '#FF7A5A');
  g.addColorStop(1, frac > 0.3 ? '#8B2418' : '#B0301A');
  rr(bx + 1, by + 1, Math.max(0, (bw - 2) * frac), bh - 2, 3*HS);
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = hexToRgba(PAL.ink, 0.5); ctx.lineWidth = 2;
  const segs = Math.max(1, Math.round(P.maxHp / 20));
  for (let i = 1; i < segs; i++){
    const sx = bx + bw * (i / segs);
    ctx.beginPath(); ctx.moveTo(sx, by + 2); ctx.lineTo(sx, by + bh - 2); ctx.stroke();
  }
  setFont(Math.round(12*HS), 700, true);

/* With a moving camera the Boiler can drift to the edge of frame. It is the
   thing you lose the run by ignoring, so it gets a persistent marker: a health
   pip on screen when visible, an arrow pinned to the edge when it is not. */
function drawObjectiveMarker(){
  if (!CAM.follow || !S.boiler) return;
  const B = S.boiler;
  const p = CAM.project(B.x, B.y, 150);
  const HS = hudScale();
  const m = 74 * HS;
  const onScreen = p.x > m && p.x < View.w - m && p.y > m * 1.4 && p.y < View.h - m;
  const frac = clamp(B.hp / B.maxHp, 0, 1);
  const hurt = frac < 0.5;

  ctx.save();
  if (onScreen){
    // a slim pip above the Boiler, only once it has taken a hit
    if (frac >= 0.999){ ctx.restore(); return; }
    const w = 74 * HS, h = 7 * HS;
    ctx.globalAlpha = 0.9;
    rr(p.x - w/2 - 2, p.y - 2, w + 4, h + 4, 3);
    ctx.fillStyle = 'rgba(13,11,18,0.85)'; ctx.fill();
    ctx.fillStyle = hurt ? PAL.danger : PAL.fire;
    rr(p.x - w/2, p.y, w * frac, h, 2); ctx.fill();
    ctx.restore();
    return;
  }
  // off frame: clamp to the edge and point at it
  const cx = View.w / 2, cy = View.h / 2;
  let dx = p.x - cx, dy = p.y - cy;
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  const ex = clamp(cx + dx * View.w, m, View.w - m);
  const ey = clamp(cy + dy * View.h, m * 1.4, View.h - m);
  const pulse = 0.72 + Math.sin(S.rt * (hurt ? 9 : 4)) * 0.24;
  ctx.globalAlpha = pulse;
  ctx.translate(ex, ey);
  ctx.globalCompositeOperation = 'lighter';
  drawGlow(0, 0, 44 * HS, hurt ? PAL.danger : PAL.fire, 0.55);
  ctx.globalCompositeOperation = 'source-over';
  ctx.rotate(Math.atan2(dy, dx));
  ctx.beginPath();
  ctx.moveTo(20 * HS, 0); ctx.lineTo(-8 * HS, -14 * HS); ctx.lineTo(-2 * HS, 0);
  ctx.lineTo(-8 * HS, 14 * HS); ctx.closePath();
  fillStroke(hurt ? PAL.danger : PAL.fire, PAL.ink, 4);
  ctx.rotate(-Math.atan2(dy, dx));
  setFont(Math.round(11 * HS), 800, true);
  textOut('BOILER ' + Math.round(frac * 100) + '%', 0, 28 * HS,
          hurt ? PAL.danger : PAL.bone, PAL.ink, 4);
  ctx.restore();
}
